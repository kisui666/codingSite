﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Python P2 课程 | 汽水老师编程课堂</title>
<style>
:root {
  --primary: #8B5CF6;
  --primary-dark: #7C3AED;
  --primary-soft: #EDE9FE;
  --yellow: #FBBF24;
  --orange: #F97316;
  --coral: #F43F5E;
  --mint: #14B8A6;
  --green: #10B981;
  --lavender: #A78BFA;
  --bg: #F5F3FF;
  --surface: #FFFFFF;
  --text: #1E1B2E;
  --text-sub: #5B5577;
  --border: #DDD6FE;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --shadow-sm: 0 4px 12px rgba(139,92,246,.10);
  --shadow-md: 0 12px 30px rgba(30,27,46,.12);
  --shadow-lg: 0 24px 60px rgba(139,92,246,.22);
  --font-display: 'Trebuchet MS', 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, sans-serif;
  --font-body: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-mono: 'Consolas', 'Courier New', monospace;
  --code-bg: #1e1e2e;
  --code-surface: #181825;
  --code-border: #313244;
  --code-text: #cdd6f4;
  --code-kw: #cba6f7;
  --code-str: #a6e3a1;
  --code-cmt: #6c7086;
  --code-num: #fab387;
  --code-fn: #89b4fa;
  --code-builtin: #f9e2af;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); color: var(--text); background: var(--bg); line-height: 1.6; overflow-x: hidden; }
h1,h2,h3,h4 { font-family: var(--font-display); line-height: 1.25; color: var(--text); }
a { color: inherit; text-decoration: none; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
.section { padding: 56px 0; position: relative; }
.section-title { font-size: clamp(24px, 3.5vw, 34px); font-weight: 800; margin-bottom: 10px; }
.section-sub { color: var(--text-sub); font-size: 16px; margin-bottom: 28px; }

/* 顶部固定栏 */
.topbar {
  position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
}
.topbar-inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; gap: 16px; flex-wrap: wrap; }
.course-info { display: flex; align-items: center; gap: 14px; }
.course-badge {
  background: linear-gradient(135deg, var(--primary), var(--lavender)); color: #fff;
  padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap;
}
.course-info h1 { font-size: 18px; font-weight: 800; }
.course-info .meta { font-size: 13px; color: var(--text-sub); }
.lesson-progress { display: flex; gap: 6px; align-items: center; }
.progress-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--border); cursor: pointer;
  transition: all .3s;
}
.progress-dot.active { background: var(--primary); transform: scale(1.3); }
.progress-dot.done { background: var(--green); transform: scale(1.3); }
.progress-label { font-size: 13px; color: var(--text-sub); margin-left: 8px; }
@media (max-width: 700px) { .lesson-progress { display: none; } }

/* 学习目标卡 */
.goals-card {
  background: linear-gradient(135deg, var(--primary), var(--lavender));
  color: #fff; border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg);
}
.goals-card h2 { color: #fff; margin-bottom: 20px; }
.goal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.goal-item {
  background: rgba(255,255,255,.15); border-radius: var(--radius-md); padding: 18px;
  backdrop-filter: blur(8px);
}
.goal-item .icon {
  width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,.25);
  display: grid; place-items: center; margin-bottom: 12px; font-size: 20px;
}
.goal-item h4 { color: #fff; font-size: 16px; margin-bottom: 6px; }
.goal-item p { font-size: 14px; opacity: .92; }
@media (max-width: 700px) { .goal-grid { grid-template-columns: 1fr; } }

/* 教学环节 */
.step-block { display: flex; gap: 24px; margin-bottom: 28px; }
.step-num {
  flex-shrink: 0; width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--lavender)); color: #fff;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 22px;
  box-shadow: 0 8px 20px rgba(139,92,246,.35); position: relative;
}
.step-num::after {
  content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: calc(100% + 28px);
  background: linear-gradient(var(--primary), transparent); transform: translateX(-50%);
}
.step-block:last-child .step-num::after { display: none; }
.step-content { flex: 1; background: #fff; border-radius: var(--radius-md); padding: 24px 28px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.step-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
.step-head h3 { font-size: 22px; }
.step-time {
  font-size: 13px; color: var(--primary); background: var(--primary-soft);
  padding: 5px 12px; border-radius: 999px; font-weight: 700;
}
.step-desc { color: var(--text-sub); margin-bottom: 16px; }

/* Python 代码块 */
.code-block {
  background: var(--code-bg); border-radius: var(--radius-sm); margin: 16px 0;
  overflow: hidden; border: 1px solid var(--code-border);
}
.code-block .code-header {
  display: flex; align-items: center; gap: 6px; padding: 8px 16px;
  background: var(--code-surface); border-bottom: 1px solid var(--code-border);
}
.code-block .code-dot { width: 12px; height: 12px; border-radius: 50%; }
.code-block .code-label { font-size: 12px; color: #6c7086; margin-left: 8px; font-family: var(--font-body); }
.code-block pre { padding: 16px 20px; overflow-x: auto; font-family: var(--font-mono); font-size: 14px; line-height: 1.7; color: var(--code-text); }
.code-block .py-kw { color: var(--code-kw); font-weight: 600; }
.code-block .py-str { color: var(--code-str); }
.code-block .py-cmt { color: var(--code-cmt); font-style: italic; }
.code-block .py-num { color: var(--code-num); }
.code-block .py-fn { color: var(--code-fn); }
.code-block .py-builtin { color: var(--code-builtin); }
.code-block .py-deco { color: var(--code-fn); }

/* 互动演示区 */
.demo-box {
  background: var(--bg); border: 2px dashed var(--border); border-radius: var(--radius-md);
  padding: 24px; margin: 16px 0; text-align: center;
}
.demo-stage {
  width: 100%; max-width: 520px; height: 260px; margin: 0 auto; background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
  border-radius: var(--radius-sm); position: relative; overflow: hidden; border: 3px solid var(--primary-dark); box-shadow: var(--shadow-sm);
}
.demo-actor { position: absolute; }
.demo-output {
  position: absolute; top: 12px; left: 12px; right: 12px; text-align: left;
  font-family: var(--font-mono); font-size: 13px; color: #a6e3a1;
  background: rgba(0,0,0,.4); border-radius: 8px; padding: 10px 14px;
  max-height: 160px; overflow-y: auto; line-height: 1.6;
}
.demo-output .out-line { margin-bottom: 2px; }
.demo-output .out-err { color: #f38ba8; }
.demo-output .out-info { color: #89b4fa; }
.demo-output .out-warn { color: #f9e2af; }
.demo-bubble {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: #fff; padding: 8px 14px;
  border-radius: 14px; font-size: 14px; font-weight: 600; opacity: 0; transform: translateX(-50%) scale(.8);
  transition: all .3s; box-shadow: var(--shadow-sm); z-index: 5;
}
.demo-bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
.demo-controls { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.demo-btn {
  padding: 10px 20px; border: none; border-radius: 999px; font-weight: 700; cursor: pointer;
  font-family: inherit; font-size: 14px; transition: transform .15s, box-shadow .15s; color: #fff;
}
.demo-btn:hover { transform: translateY(-2px); }
.demo-btn:active { transform: translateY(0); }
.demo-btn.python { background: var(--primary); box-shadow: 0 4px 12px rgba(139,92,246,.3); }
.demo-btn.data { background: var(--mint); box-shadow: 0 4px 12px rgba(20,184,166,.3); }
.demo-btn.chart { background: var(--green); box-shadow: 0 4px 12px rgba(16,185,129,.3); }
.demo-btn.game { background: var(--coral); box-shadow: 0 4px 12px rgba(244,63,94,.3); }
.demo-btn.sound { background: var(--orange); box-shadow: 0 4px 12px rgba(249,115,22,.3); }
.demo-btn.event { background: var(--yellow); color: #4A3B00; box-shadow: 0 4px 12px rgba(251,191,36,.3); }
.demo-btn.reset { background: var(--text-sub); }
.demo-stage canvas { border-radius: 8px; display: block; margin: 0 auto; }
.demo-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.demo-table th, .demo-table td { padding: 6px 10px; border: 1px solid var(--code-border); text-align: left; color: var(--code-text); }
.demo-table th { background: var(--code-surface); color: var(--code-kw); font-weight: 600; }
.demo-table tr:nth-child(even) td { background: rgba(255,255,255,.03); }
.demo-input-row { display: flex; gap: 8px; margin: 10px 0; justify-content: center; flex-wrap: wrap; }
.demo-input {
  padding: 8px 14px; border: 2px solid var(--primary); border-radius: 8px;
  font-family: var(--font-mono); font-size: 14px; background: #fff; color: var(--text); outline: none;
}
.demo-input:focus { border-color: var(--primary-dark); box-shadow: 0 0 0 3px var(--primary-soft); }
.demo-status { font-size: 13px; color: var(--text-sub); margin-top: 8px; }

/* 任务清单 */
.task-list { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
.task-item {
  display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px;
  background: var(--bg); border-radius: var(--radius-sm); cursor: pointer; transition: all .25s;
  border: 2px solid transparent; position: relative;
}
.task-item > * { position: relative; z-index: 1; }
.task-item::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(135deg, rgba(254,240,138,.5), rgba(253,224,71,.42));
  opacity: 0; transition: opacity .45s ease;
}
.task-item:hover { border-color: var(--primary-soft); }
.task-item.done { border-color: rgba(234,179,8,.5); box-shadow: 0 4px 14px rgba(234,179,8,.18); }
.task-item.done::before { opacity: 1; }
.task-check {
  width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border);
  flex-shrink: 0; display: grid; place-items: center; transition: all .25s; margin-top: 1px;
}
.task-item.done .task-check { background: var(--green); border-color: var(--green); }
.task-check svg { opacity: 0; transition: opacity .2s; }
.task-item.done .task-check svg { opacity: 1; color: #fff; }
.task-text { font-size: 15px; }
.task-item.done .task-text { text-decoration: line-through; color: var(--text-sub); }
.task-hint { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

/* 小贴士 */
.tip {
  background: var(--primary-soft); border-left: 4px solid var(--primary); border-radius: var(--radius-sm);
  padding: 14px 18px; margin: 16px 0; display: flex; gap: 12px; align-items: flex-start;
}
.tip .tip-icon { flex-shrink: 0; }
.tip strong { color: var(--primary-dark); }

/* 小结 */
.summary-card {
  background: linear-gradient(135deg, var(--primary-soft), #DDD6FE); border-radius: var(--radius-lg);
  padding: 32px; border: 2px solid var(--lavender);
}
.summary-card h3 { color: var(--primary-dark); margin-bottom: 16px; }
.knowledge-points { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.kp-chip {
  background: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  color: var(--primary-dark); box-shadow: var(--shadow-sm);
}

/* 课后作业 */
.homework { background: #fff; border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.hw-item { padding: 18px 0; border-bottom: 1px dashed var(--border); display: flex; gap: 16px; align-items: flex-start; }
.hw-item:last-child { border-bottom: none; }
.hw-star { color: var(--yellow); font-size: 20px; flex-shrink: 0; }
.hw-item h4 { font-size: 17px; margin-bottom: 4px; }
.hw-item p { color: var(--text-sub); font-size: 14px; }

/* 页脚导航 */
.lesson-nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 40px; flex-wrap: wrap; }
.lesson-nav a {
  flex: 1; min-width: 200px; padding: 18px 24px; background: #fff; border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: all .25s; display: flex;
  align-items: center; gap: 14px;
}
.lesson-nav a:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
.lesson-nav .arrow { font-size: 24px; color: var(--primary); }
.lesson-nav .label { font-size: 13px; color: var(--text-sub); }
.lesson-nav .title { font-weight: 700; font-size: 16px; }
.lesson-nav .next { text-align: right; flex-direction: row-reverse; }
.back-home { text-align: center; margin-top: 20px; }
.back-home a { color: var(--primary); font-weight: 600; }
.back-home a:hover { text-decoration: underline; }

/* 响应式 */
@media (max-width: 700px) {
  .section { padding: 40px 0; }
  .topbar-inner { padding: 10px 14px; gap: 10px; }
  .course-info h1 { font-size: 15px; }
  .course-info .meta { display: none; }
  .step-block { flex-direction: column; gap: 14px; }
  .step-num::after { display: none; }
  .step-num { width: 44px; height: 44px; font-size: 16px; }
  .step-content { padding: 18px 14px; }
  .step-head h3 { font-size: 19px; }
  .step-desc { font-size: 14px; }
  .demo-stage { height: 200px; }
  .demo-box { overflow-x: auto; }
  .code-block pre { padding: 14px; font-size: 12.5px; }
  .task-item { padding: 14px; gap: 10px; }
}

/* 左侧课程目录 */
.toc-sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 240px; z-index: 101;
  background: #fff; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; transition: transform .3s ease;
}
.toc-head { padding: 16px 16px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.toc-home {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 12px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px;
  background: var(--primary); color: #fff; transition: transform .2s, box-shadow .2s;
}
.toc-home:hover { transform: translateY(-2px); box-shadow: 0 8px 18px var(--primary-soft); color: #fff; }
.toc-title { font-size: 12px; font-weight: 800; color: var(--text-sub); letter-spacing: 2px; margin-top: 12px; }
.toc-list { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
.toc-unit { font-size: 12px; font-weight: 700; color: var(--text-sub); padding: 12px 8px 4px; }
.toc-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px;
  font-size: 13.5px; cursor: pointer; transition: background .2s; line-height: 1.45;
}
.toc-item:hover { background: var(--primary-soft); }
.toc-item.active { background: var(--primary-soft); color: var(--primary-dark); font-weight: 700; }
.toc-no { flex-shrink: 0; font-size: 11px; font-weight: 700; color: #fff; background: var(--primary); border-radius: 6px; padding: 2px 6px; }
.toc-item.active .toc-no { background: var(--primary-dark); }
.toc-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 100; opacity: 0; pointer-events: none; transition: opacity .3s; }
.toc-mask.open { opacity: 1; pointer-events: auto; }
.toc-fab {
  display: none; position: fixed; right: 18px; bottom: 18px; z-index: 94;
  border: none; cursor: pointer; padding: 12px 18px; border-radius: 999px;
  background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; font-family: var(--font-body);
  box-shadow: 0 8px 20px rgba(0,0,0,.18);
}
@media (max-width: 1100px) {
  .toc-sidebar { transform: translateX(-100%); }
  .toc-sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,.2); }
  .toc-fab { display: block; }
}
/* 目录收起/展开按钮 */
.toc-collapse {
  position: absolute; right: -13px; top: 14px; width: 26px; height: 26px;
  border-radius: 50%; border: 1px solid var(--border); background: #fff;
  color: var(--text-sub); cursor: pointer; font-size: 11px; font-family: inherit;
  display: grid; place-items: center; box-shadow: 0 2px 8px rgba(30,42,68,.16);
  transition: transform .3s ease; padding: 0; z-index: 5;
}
.toc-collapse:hover { color: var(--primary); border-color: var(--primary-soft); }
@media (min-width: 1101px) {
  #app { margin-left: 240px; transition: margin-left .3s ease; }
  body.toc-collapsed #app { margin-left: 0; }
  body.toc-collapsed .toc-sidebar { transform: translateX(-100%); }
  body.toc-collapsed .toc-collapse { transform: rotate(180deg); }
}
@media (max-width: 1100px) {
  .toc-collapse { display: none; }
}
</style>

<script>
/* ================================================================
   Python 语法高亮
   ================================================================ */
function pyCode(code) {
  code = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  var kwList = 'def|class|return|if|elif|else|for|while|break|continue|import|from|as|in|not|and|or|is|None|True|False|try|except|finally|raise|with|lambda|pass|yield|global|nonlocal|assert|del|async|await';
  var builtinList = 'print|len|range|input|int|str|float|list|dict|set|tuple|bool|enumerate|zip|map|filter|sorted|reversed|sum|min|max|abs|round|type|isinstance|open|format|chr|ord|hex|bin|oct';
  var pattern = new RegExp(
    '(#[^\\n]*)' +                                                                                   // comments
    '|("""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\')' +                                                    // triple strings
    '|("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')' +                                            // strings
    '|\\b(' + kwList + ')\\b' +                                                                      // keywords
    '|\\b(' + builtinList + ')\\b' +                                                                 // builtins
    '|\\b(\\d+\\.?\\d*)\\b' +                                                                        // numbers
    '|(@\\w+)', 'g');
  return code.replace(pattern, function(m, cmt, tri, str, kw, bi, num, deco) {
    if (cmt) return '<span class="py-cmt">' + cmt + '</span>';
    if (tri) return '<span class="py-str">' + tri + '</span>';
    if (str) return '<span class="py-str">' + str + '</span>';
    if (kw) return '<span class="py-kw">' + kw + '</span>';
    if (bi) return '<span class="py-builtin">' + bi + '</span>';
    if (num) return '<span class="py-num">' + num + '</span>';
    if (deco) return '<span class="py-deco">' + deco + '</span>';
    return m;
  });
}

/* ================================================================
   32 讲课程数据
   ================================================================ */
var LESSONS = {

/* ===== 第 1 课 ===== */
'p2-01': {
  no: 1, title: '自定义函数 def', subtitle: '把代码打包成可复用的函数',
  unit: '函数与模块', unitNo: 1, duration: '90 分钟', isProject: false,
  goals: [
    { icon: '📦', title: '理解函数概念', desc: '知道函数是什么，为什么要用函数把代码「打包」起来。' },
    { icon: '✏', title: '学会 def 语法', desc: '掌握 def 关键字定义函数，学会调用函数执行代码。' },
    { icon: '🔁', title: '函数复用', desc: '能定义简单函数并多次调用，体会代码复用的好处。' }
  ],
  steps: [
    { title: '趣味导入：食谱的启示', emoji: '🌟', time: '10 分钟',
      desc: '同学们，你们有没有做过菜？做菜需要一份食谱——写好步骤，每次按食谱做就行。在编程里，函数就是「食谱」：把一段代码写好命名，之后只需喊它的名字就能执行，不用重复写。',
      tips: [{ icon: '💡', strong: '汽水老师说：', text: 'Python 里用 <strong>def</strong>（define 的缩写）来定义函数。函数让代码更整洁、更容易复用，也方便修改——改一处，所有调用的地方都跟着变！' }]
    },
    { title: '认识 def 语法', emoji: '🔍', time: '15 分钟',
      desc: '定义函数的语法很简单：def + 函数名 + 括号 + 冒号，下一行缩进写代码。调用时直接喊函数名加括号。',
      code: `# 定义一个打招呼的函数
def say_hello():
    print("你好，欢迎来到 Python 课堂！")

import random, time

# 题库（列表套字典）
questions = [
    {"q": "Python 中定义函数用什么关键字？", "a": "def"},
    {"q": "list 的长度用什么函数？", "a": "len"},
    {"q": "1-100 随机整数用什么？", "a": "randint"},
    # ... 可以加更多题
]

def draw_questions(n):
    """从题库随机抽 n 题"""
    return random.sample(questions, n)

def ask_question(item):
    """出一道题，返回对错"""
    answer = input(item["q"] + " → ")
    return answer.strip() == item["a"]

def run_quiz(n=5):
    """运行测验，返回得分"""
    quiz = draw_questions(n)
    score = 0
    for i, item in enumerate(quiz, 1):
        print(f"\\n第 {i} 题：")
        if ask_question(item):
            print("✅ 正确！")
            score += 1
        else:
            print(f"❌ 错误！答案是 {item['a']}")
        time.sleep(0.5)
    return score`,

pygame.init()
screen = pygame.display.set_mode((640, 480))
clock = pygame.time.Clock()
font = pygame.font.Font(None, 36)

# 粒子类
class Particle:
    def __init__(self, x, y, color):
        self.x = x
        self.y = y
        angle = random.uniform(0, math.pi * 2)  # 随机方向
        speed = random.uniform(2, 8)             # 随机速度
        self.vx = math.cos(angle) * speed
        self.vy = math.sin(angle) * speed
        self.color = color
        self.life = random.randint(30, 60)      # 寿命（帧）
        self.size = random.randint(3, 8)        # 大小

    def update(self):
        self.x += self.vx
        self.y += self.vy
        self.vy += 0.2  # 重力
        self.life -= 1
        self.size = max(1, self.size - 0.1)  # 缩小

    def draw(self, surf):
        if self.life > 0:
            alpha = int(255 * self.life / 60)  # 透明度随寿命减小
            pygame.draw.circle(surf, self.color,
                             (int(self.x), int(self.y)), int(self.size))

particles = []
player = pygame.Rect(300, 220, 30, 30)

running = True
while running:
    for event in pygame.event.get():
        if event.type == pygame.QUIT:
            running = False
        if event.type == pygame.MOUSEBUTTONDOWN:
            # 鼠标点击产生爆炸粒子
            mx, my = event.pos
            for _ in range(30):
                color = random.choice([(255,100,100),(255,200,50),
                                      (100,255,100),(100,200,255),(200,100,255)])

    if keys[pygame.K_LEFT]:  player.x -= 5
    if keys[pygame.K_RIGHT]: player.x += 5
    if keys[pygame.K_UP]:    player.y -= 5
    if keys[pygame.K_DOWN]:  player.y += 5

    # 玩家移动产生拖尾粒子
    if random.random() < 0.5:
        particles.append(Particle(player.centerx, player.centery, (139,92,246)))

    # 更新和绘制粒子

        p.update()
        p.draw(screen)
    particles = [p for p in particles if p.life > 0]  # 清理死亡粒子

    screen.blit(font.render(f"Particles: {len(particles)}  [Click!]", True, (255,255,255)), (10, 10))
    pygame.display.flip()
    clock.tick(60)

STATE_OVER = "game_over"

state = STATE_MENU
score = 0
player = pygame.Rect(300, 220, 30, 30)

# 按钮区域
start_btn = pygame.Rect(270, 200, 100, 50)
restart_btn = pygame.Rect(270, 280, 100, 50)

def draw_menu(scr):
    scr.fill((30, 30, 50))
    title = font_big.render("MY GAME", True, (139,92,246))
    scr.blit(title, (220, 120))

def draw_game(scr):
    scr.fill((0, 0, 0))
    pygame.draw.rect(scr, (139,92,246), player)
    scr.blit(font.render(f"Score: {score}  [P]Pause", True, (255,255,255)), (10, 10))

def draw_pause(scr):
    draw_game(scr)  # 先画游戏画面
    overlay = pygame.Surface((640, 480), pygame.SRCALPHA)
    overlay.fill((0, 0, 0, 150))  # 半透明遮罩
    scr.blit(overlay, (0, 0))
    scr.blit(font_big.render("PAUSED", True, (255,255,255)), (240, 200))
    scr.blit(font.render("Press P to Resume", True, (200,200,200)), (240, 280))

    scr.blit(font.render(f"Final Score: {score}", True, (255,255,255)), (260, 230))
    pygame.draw.rect(scr, (139,92,246), restart_btn, border_radius=10)
    scr.blit(font.render("RESTART", True, (255,255,255)), (278, 295))

running = True
while running:
    for event in pygame.event.get():
        if event.type == pygame.QUIT:
            running = False
        if event.type == pygame.KEYDOWN:
            if state == STATE_MENU and event.key == pygame.K_SPACE:
                state = STATE_PLAY; score = 0
            elif state == STATE_PLAY and event.key == pygame.K_p:
                state = STATE_PAUSE
            elif state == STATE_PAUSE and event.key == pygame.K_p:
                state = STATE_PLAY
            elif state == STATE_OVER and event.key == pygame.K_r:
                state = STATE_PLAY; score = 0
        if event.type == pygame.MOUSEBUTTONDOWN:
            if state == STATE_MENU and start_btn.collidepoint(event.pos):
                state = STATE_PLAY; score = 0
            elif state == STATE_OVER and restart_btn.collidepoint(event.pos):
                state = STATE_PLAY; score = 0

    if state == STATE_PLAY:
        keys = pygame.key.get_pressed()
        if keys[pygame.K_LEFT]:  player.x -= 5
        if keys[pygame.K_RIGHT]: player.x += 5
        if keys[pygame.K_UP]:    player.y -= 5
        if keys[pygame.K_DOWN]:  player.y += 5
        # 模拟掉血结束
        if pygame.time.get_ticks() > 10000:
            state = STATE_OVER

    # 根据状态绘制
    if state == STATE_MENU:   draw_menu(screen)
    elif state == STATE_PLAY: draw_game(screen)
    elif state == STATE_PAUSE: draw_pause(screen)
    elif state == STATE_OVER: draw_over(screen)

    clock.tick(60)

# 初始化数据库
def init_db():
    conn = sqlite3.connect('grades.db')
    conn.execute('''CREATE TABLE IF NOT EXISTS scores (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        name TEXT, chinese INTEGER, 
        math INTEGER, english INTEGER
    )''')
    return conn

# 录入成绩
def add_student(conn, name, c, m, e):
    conn.execute(
        "INSERT INTO scores (name, chinese, math, english) VALUES (?,?,?,?)",
        (name, c, m, e)
    )
    conn.commit()

# 统计分析（用推导式！）
def analyze(conn):
    rows = conn.execute("SELECT name, chinese, math, english FROM scores").fetchall()
    students = [
        {'name': r[0], 'scores': [r[1], r[2], r[3]], 
         'total': sum(r[1:]), 'avg': sum(r[1:])/3}
        for r in rows
    ]
    students.sort(key=lambda s: s['total'], reverse=True)
    
    all_scores = [s for st in students for s in st['scores']]
    report = {
        '人数': len(students),
        '最高分': max(all_scores) if all_scores else 0,
        '最低分': min(all_scores) if all_scores else 0,
        '平均分': sum(all_scores)/len(all_scores) if all_scores else 0,
        '排名': [{'name': s['name'], '总分': s['total']} for s in students]
    }
    return report

# 导出报告
def export(report, fmt='json'):
    try:
        if fmt == 'json':
            with open('report.json', 'w', encoding='utf-8') as f:
                json.dump(report, f, ensure_ascii=False, indent=2)
        elif fmt == 'csv':
            with open('report.csv', 'w', newline='', encoding='utf-8') as f:
                w = csv.writer(f)
                w.writerow(['姓名', '总分'])
                for r in report['排名']:
                    w.writerow([r['name'], r['总分']])
        print(f'✅ 导出 {fmt} 成功！')
    except Exception as e:
        print(f'❌ 导出失败：{e}')

# 主程序
conn = init_db()
add_student(conn, '小明', 95, 88, 92)
add_student(conn, '小红', 85, 96, 90)
report = analyze(conn)
print(json.dumps(report, ensure_ascii=False, indent=2))
export(report, 'json')
export(report, 'csv')`,

        spine.set_color('#E0E0E0')

# 趋势图 + 环比对比

    data = []

def analyze(data):
    scores = [d['score'] for d in data]
    # 等级分布（用推导式！）
    grades = {
        'A(90+)': len([s for s in scores if s >= 90]),
        'B(80+)': len([s for s in scores if 80 <= s < 90]),
        'C(70+)': len([s for s in scores if 70 <= s < 80]),
        'D(60+)': len([s for s in scores if 60 <= s < 70]),
        'F(<60)': len([s for s in scores if s < 60])
    }
    return {
        'count': len(data),
        'avg': sum(scores) / len(scores),
        'max': max(scores),
        'min': min(scores),
        'grades': grades
    }

# === 3. 可视化看板 ===

    ]):
        ax = fig.add_subplot(gs[0, i])
        ax.text(0.5, 0.6, str(val), ha='center', fontsize=24, fontweight='bold')

    add: function(s) { DEMOS.function._out(s, '3 + 5 = 8', 'add(3, 5) → return 8'); },
    bmi: function(s) { DEMOS.function._out(s, 'BMI = 20.8', 'bmi(60, 1.7) → return 20.8'); },
    reset: function(s) { s.output.innerHTML = '<div class="out-line">&gt;&gt;&gt; 已清空</div>'; s.bubble.classList.remove('show'); },
    _out: function(s, text, label) {
      var lines = text.split('\n');
      var html = '<div class="out-line out-info">&gt;&gt;&gt; ' + label + '</div>';
      lines.forEach(function(l) { html += '<div class="out-line">' + l + '</div>'; });
      s.output.innerHTML = html;
      var retMatch = label.match(/return (.+)/);
      if (retMatch) {
        s.bubble.textContent = '↩ 返回值: ' + retMatch[1];
        s.bubble.classList.add('show');
        setTimeout(function() { s.bubble.classList.remove('show'); }, 2500);
      }
    }

  actions: {

DEMOS['quiz'] = {
  stage: function() {
    return '<div class="demo-stage" id="demoStage">' +

      '<button class="demo-btn reset" onclick="demoAction(\'reset\')">🔄 重置</button>';
  },
  init: function(s) {
    s.output = document.getElementById('demoOutput');
    s.bubble = document.getElementById('demoBubble');
    s.bank = [
      { q: 'Python 定义函数用什么关键字?', o: ['def','func','define','function'], a: 0 },
      { q: '生成 1-100 随机整数用什么?', o: ['random()','randint(1,100)','rand(1,100)','randomint(100)'], a: 1 },
      { q: '函数返回值用什么语句?', o: ['print','output','return','yield'], a: 2 },
      { q: 'math.sqrt(144) 等于?', o: ['10','11','12','13'], a: 2 },
      { q: 'time.sleep(2) 的作用是?', o: ['计算时间','暂停2秒','显示时间','报时'], a: 1 }
    ];
    s.idx = 0; s.score = 0; s.quiz = [];
    s.answering = false;
  },
  actions: {
    start: function(s) {
      s.idx = 0; s.score = 0;
      s.quiz = s.bank.slice().sort(function(){return Math.random()-0.5;}).slice(0, 5);
      DEMOS.quiz._show(s);
    },
    answer1: function(s) { if(s.answering) DEMOS.quiz._answer(s, 0); },
    answer2: function(s) { if(s.answering) DEMOS.quiz._answer(s, 1); },
    answer3: function(s) { if(s.answering) DEMOS.quiz._answer(s, 2); },
    answer4: function(s) { if(s.answering) DEMOS.quiz._answer(s, 3); },
    reset: function(s) {
      s.idx = 0; s.score = 0; s.quiz = []; s.answering = false;
      s.output.innerHTML = '<div class="out-line out-info">📝 随机抽题测验 —— 点击「开始测验」</div>';
      s.bubble.classList.remove('show');
    },
    _show: function(s) {
      if (s.idx >= s.quiz.length) {
        s.answering = false;
        s.output.innerHTML = '<div class="out-line out-warn" style="font-size:18px;text-align:center;">🎉 测验结束！</div>' +
          '<div class="out-line" style="font-size:20px;color:#a6e3a1;text-align:center;">得分: ' + s.score + '/' + s.quiz.length + '</div>' +
          '<div class="out-line out-info">正确率: ' + Math.round(s.score/s.quiz.length*100) + '%</div>';
        s.bubble.textContent = '得分: ' + s.score + '/' + s.quiz.length;
        s.bubble.classList.add('show');
        return;
      }
      var item = s.quiz[s.idx];
      var html = '<div class="out-line out-info">第 ' + (s.idx+1) + ' 题 / 共 ' + s.quiz.length + ' 题</div>';
      html += '<div class="out-line" style="font-size:15px;color:#cdd6f4;">' + item.q + '</div>';
      item.o.forEach(function(opt, i) { html += '<div class="out-line">' + 'ABCD'[i] + '. ' + opt + '</div>'; });
      s.output.innerHTML = html;
      s.answering = true;
      s.bubble.textContent = '得分: ' + s.score + '/' + s.quiz.length;
      s.bubble.classList.add('show');
    },
    _answer: function(s, choice) {
      s.answering = false;
      var item = s.quiz[s.idx];
      if (choice === item.a) {
        s.score++;
        s.output.innerHTML = '<div class="out-line" style="color:#a6e3a1;text-align:center;">✅ 正确！</div>';
      } else {
        s.output.innerHTML = '<div class="out-line out-err" style="text-align:center;">❌ 错误！正确答案: ' + 'ABCD'[item.a] + '</div>';
      }
      s.bubble.textContent = '得分: ' + s.score + '/' + s.quiz.length;
      s.idx++;
      setTimeout(function() { DEMOS.quiz._show(s); }, 1200);
    }
  }
};

      '<button class="demo-btn reset" onclick="demoAction(\'reset\')">🔄 重置</button>';

    s.canvas = document.getElementById('demoCanvas');
    s.ctx = s.canvas.getContext('2d');
    s.x = 230; s.y = 100; s.active = false;
    s.keyHandler = function(e) {
      if (!s.active) return;
      var step = 15;
      if (e.key === 'ArrowUp') { s.y = Math.max(0, s.y - step); e.preventDefault(); }
      else if (e.key === 'ArrowDown') { s.y = Math.min(190, s.y + step); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { s.x = Math.max(0, s.x - step); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { s.x = Math.min(480, s.x + step); e.preventDefault(); }
      DEMOS['pg-move']._draw(s);
    };
    window.addEventListener('keydown', s.keyHandler);
    DEMOS['pg-move']._draw(s);
  },
  cleanup: function(s) { if (s.keyHandler) window.removeEventListener('keydown', s.keyHandler); s.active = false; },
  actions: {
    start: function(s) {
      s.active = true;
      DEMOS['pg-move']._draw(s);
    },
    reset: function(s) {
      s.active = false; s.x = 230; s.y = 100;
      DEMOS['pg-move']._draw(s);
    },
    _draw: function(s) {
      var ctx = s.ctx;
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,500,220);
      // 画角色（彩色方块）
      ctx.fillStyle = s.active ? '#8B5CF6' : '#6c7086';

  },
  cleanup: function(s) { if (s.interval) { clearInterval(s.interval); s.interval = null; } s.running = false; },
  actions: {
    start: function(s) {
      if (s.running) return;
      s.state = 'PLAYING'; s.running = true;
      s.bubble.textContent = '🎮 游戏中！'; s.bubble.classList.add('show');
      s.interval = setInterval(function() {
        DEMOS['pg-game']._update(s);
        DEMOS['pg-game']._draw(s);
      }, 1000/30);
    },
    pause: function(s) {
      if (s.state === 'PLAYING') { s.state = 'PAUSED'; s.running = false; if(s.interval){clearInterval(s.interval);s.interval=null;} s.bubble.textContent = '⏸ 已暂停'; }
      else if (s.state === 'PAUSED') { s.state = 'PLAYING'; s.running = true; s.bubble.textContent = '🎮 继续游戏'; DEMOS['pg-game'].actions.start(s); }
      s.bubble.classList.add('show');
    },
    collision: function(s) {
      // 检测角色和目标碰撞
      if (s.px < s.target.x + s.target.w && s.px + 30 > s.target.x &&
          s.py < s.target.y + s.target.h && s.py + 30 > s.target.y) {
        s.score += 10;
        s.bubble.textContent = '💥 碰撞！+10 分';
        s.bubble.classList.add('show');
        s.target.x = 30 + Math.random()*440; s.target.y = 20 + Math.random()*150;
        // 粒子效果
        for (var i = 0; i < 10; i++) s.particles.push({x:s.px+15,y:s.py+15,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:30});
        setTimeout(function() { s.bubble.classList.remove('show'); }, 1500);
      } else {
        s.bubble.textContent = '📏 未碰撞，靠近目标！';
        s.bubble.classList.add('show');
        setTimeout(function() { s.bubble.classList.remove('show'); }, 1000);
      }
    },
    particles: function(s) {
      for (var i = 0; i < 20; i++) s.particles.push({x:250,y:110,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:40});
    },
    level: function(s) {
      s.level = s.level % 3 + 1;
      s.bubble.textContent = '🎮 切换到关卡 ' + s.level;
      s.bubble.classList.add('show');
      setTimeout(function() { s.bubble.classList.remove('show'); }, 1500);
    },
    reset: function(s) {
      if (s.interval) { clearInterval(s.interval); s.interval = null; }
      s.running = false; s.px = 240; s.py = 180; s.score = 0; s.level = 1;
      s.state = 'READY'; s.particles = []; s.target = {x:100,y:50,w:30,h:30};
      s.bubble.textContent = '点击「开始游戏」'; s.bubble.classList.remove('show');
      DEMOS['pg-game']._draw(s);
    },
    _update: function(s) {
      // 目标移动
      s.target.x += (Math.random()-0.5) * 4;
      s.target.y += (Math.random()-0.5) * 4;
      s.target.x = Math.max(10, Math.min(460, s.target.x));
      s.target.y = Math.max(10, Math.min(180, s.target.y));
      // 粒子更新
      s.particles = s.particles.filter(function(p) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.life--;
        return p.life > 0;
      });
    },
    _draw: function(s) {
      var ctx = s.ctx;
      ctx.fillStyle = '#000'; ctx.fillRect(0,0,500,220);
      // 目标
      var colors = ['#F43F5E','#FBBF24','#10B981'];
      ctx.fillStyle = colors[(s.level-1)%3];
      ctx.fillRect(s.target.x, s.target.y, s.target.w, s.target.h);
      // 粒子
      s.particles.forEach(function(p) {
        ctx.fillStyle = 'rgba(139,92,246,' + (p.life/40) + ')';
        ctx.fillRect(p.x-2, p.y-2, 4, 4);
      });
      // 角色
      ctx.fillStyle = '#8B5CF6'; ctx.fillRect(s.px, s.py, 30, 30);
      ctx.fillStyle = '#fff'; ctx.fillRect(s.px+6, s.py+6, 6, 6); ctx.fillRect(s.px+18, s.py+6, 6, 6);
      // HUD
      s.hud.textContent = 'SCORE: ' + s.score + ' | LV.' + s.level + ' | STATE: ' + s.state;
    }
  }
};

  stage: function() {

  },
  controls: function() {
    return '<button class="demo-btn data" onclick="demoAction(\'load\')">📂 加载CSV</button>' +
      '<button class="demo-btn data" onclick="demoAction(\'sort\')">🔢 按成绩排序</button>' +
      '<button class="demo-btn data" onclick="demoAction(\'filter\')">✅ 筛选≥90分</button>' +
      '<button class="demo-btn data" onclick="demoAction(\'avg\')">📊 求平均分</button>' +
      '<button class="demo-btn reset" onclick="demoAction(\'reset\')">🧹 清空</button>';
  },
  init: function(s) {
    s.table = document.getElementById('demoTable');
    s.data = [
      ['姓名','语文','数学','英语'],
      ['小明',95,88,92],
      ['小红',78,96,85],
      ['小刚',90,76,88],
      ['小丽',98,95,100],
      ['小强',65,72,68]
    ];
    s.loaded = false;
    s.table.innerHTML = '<tr><td>点击「加载CSV」</td></tr>';
  },
  actions: {
    load: function(s) {
      s.loaded = true;
      DEMOS.csv._render(s, s.data);
    },
    sort: function(s) {
      if (!s.loaded) { DEMOS.csv._msg(s, '请先加载CSV！'); return; }
      var header = s.data[0];
      var rows = s.data.slice(1).sort(function(a,b) { return b[2] - a[2]; });
      s.data = [header].concat(rows);
      DEMOS.csv._render(s, s.data);
      DEMOS.csv._msg(s, '✅ 按数学成绩降序排序');
    },
    filter: function(s) {
      if (!s.loaded) { DEMOS.csv._msg(s, '请先加载CSV！'); return; }
      var header = s.data[0];
      var rows = s.data.slice(1).filter(function(r) { return r[1] >= 90; });
      DEMOS.csv._render(s, [header].concat(rows));
      DEMOS.csv._msg(s, '✅ 筛选出语文≥90的 ' + rows.length + ' 条');
    },
    avg: function(s) {
      if (!s.loaded) { DEMOS.csv._msg(s, '请先加载CSV！'); return; }
      var rows = s.data.slice(1);
      var total = [0,0,0];
      rows.forEach(function(r) { for(var i=0;i<3;i++) total[i]+=r[i+1]; });
      var avg = total.map(function(t) { return Math.round(t/rows.length*10)/10; });
      s.table.innerHTML += '<tr style="color:#a6e3a1;"><td>平均</td><td>' + avg[0] + '</td><td>' + avg[1] + '</td><td>' + avg[2] + '</td></tr>';
      DEMOS.csv._msg(s, '📊 平均分：语文' + avg[0] + ' 数学' + avg[1] + ' 英语' + avg[2]);
    },
    reset: function(s) {
      s.loaded = false;
      s.table.innerHTML = '<tr><td>点击「加载CSV」</td></tr>';
    },
    _render: function(s, data) {
      s.table.innerHTML = data.map(function(row, i) {
        return '<tr>' + row.map(function(cell) {
          return (i === 0 ? '<th>' : '<td>') + cell + (i === 0 ? '</th>' : '</td>');
        }).join('') + '</tr>';
      }).join('');
    },
    _msg: function(s, msg) {
      s.table.innerHTML += '<tr><td colspan="4" style="color:#89b4fa;">' + msg + '</td></tr>';
    }
  }
};

  init: function(s) {

    ];
  },
  actions: {
    load: function(s) {
      s.output.innerHTML = '<div class="out-line out-info">📂 从 CSV 加载成绩数据：</div>' +
        '<div class="out-line" style="color:#a6e3a1;">姓名,成绩</div>' +
        '<div class="out-line">小明,95</div>' +
        '<div class="out-line">小红,88</div>' +
        '<div class="out-line">小刚,76</div>' +
        '<div class="out-line">小丽,92</div>' +
        '<div class="out-line">小强,65</div>' +
        '<div class="out-line">小芳,81</div>' +
        '<div class="out-line out-warn">✅ 共加载 6 条记录</div>';
    },
    stats: function(s) {
      var sc = s.students.map(function(x){return x.score;});
      var avg = (sc.reduce(function(a,b){return a+b;},0)/sc.length).toFixed(1);
      var mx = Math.max.apply(null,sc); var mn = Math.min.apply(null,sc);
      s.output.innerHTML = '<div class="out-line out-info">📊 统计分析结果：</div>' +
        '<div class="out-line">📊 平均分：' + avg + '</div>' +
        '<div class="out-line">📈 最高分：' + mx + '（小明）</div>' +
        '<div class="out-line">📉 最低分：' + mn + '（小强）</div>' +
        '<div class="out-line">👥 总人数：' + sc.length + '</div>' +
        '<div class="out-line out-warn">✅ 使用 sum()/len()/max()/min() 计算</div>';
    },
    rank: function(s) {
      var sorted = s.students.slice().sort(function(a,b){return b.score-a.score;});
      var html = '<div class="out-line out-info">🏆 成绩排名：</div>';
      sorted.forEach(function(st,i){
        var medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':'  ';
        html += '<div class="out-line">' + medal + ' 第' + (i+1) + '名：' + st.name + ' - ' + st.score + '分</div>';
      });
      html += '<div class="out-line out-warn">✅ 使用 sorted(key=, reverse=True) 排序</div>';
      s.output.innerHTML = html;
    },
    grade: function(s) {
      var html = '<div class="out-line out-info">📝 等级评定（A/B/C/D）：</div>';
      s.students.forEach(function(st){
        var g = st.score>=90?'A':st.score>=80?'B':st.score>=70?'C':'D';
        var color = g==='A'?'#a6e3a1':g==='B'?'#89b4fa':g==='C'?'#f9e2af':'#f38ba8';
        html += '<div class="out-line" style="color:'+color+';">' + st.name + '：' + st.score + ' → ' + g + ' 级</div>';
      });
      html += '<div class="out-line out-warn">✅ 使用 if-elif-else 判断等级</div>';
      s.output.innerHTML = html;
    },
    reset: function(s) { s.output.innerHTML = '<div class="out-line out-info">📊 成绩分析系统——点击按钮开始</div>'; }
  }
};

    load: function(s) {
      var ctx = s.ctx;
      ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,500,240);
      ctx.fillStyle = '#a6e3a1'; ctx.font = '11px monospace';
      ctx.fillText('weather.csv:', 20, 25);
      s.temps.forEach(function(t,i){
        ctx.fillStyle = '#cdd6f4';
        ctx.fillText(s.months[i]+'月,'+t+'°C', 20, 45+i*16);
      });
      ctx.fillStyle = '#cba6f7'; ctx.font = '12px sans-serif';
      ctx.fillText('📂 12 个月温度数据已加载', 200, 130);
    },
    temp: function(s) {
      var ctx = s.ctx;
      ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,500,240);
      ctx.strokeStyle = '#6c7086'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(50,20); ctx.lineTo(50,210); ctx.lineTo(480,210); ctx.stroke();
      var maxT = 35;
      ctx.fillStyle = 'rgba(251,191,36,.15)';
      ctx.beginPath(); ctx.moveTo(50,210);
      s.temps.forEach(function(t,i){
        var x = 50+i*35, y = 210-(t/maxT)*180;
        ctx.lineTo(x,y);
      });
      ctx.lineTo(50+11*35,210); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#FBBF24'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      s.temps.forEach(function(t,i){
        var x = 50+i*35, y = 210-(t/maxT)*180;
        if (i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      });
      ctx.stroke();
      s.temps.forEach(function(t,i){
        var x = 50+i*35, y = 210-(t/maxT)*180;
        ctx.fillStyle = '#FBBF24'; ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#6c7086'; ctx.font = '9px sans-serif';
        ctx.fillText(s.months[i], x-3, 225);
      });
      ctx.fillStyle = '#cba6f7'; ctx.font = '12px sans-serif';
      ctx.fillText('🌡 年度温度趋势', 180, 15);
    },
    stats: function(s) {
      var ctx = s.ctx;
      ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,500,240);
      var avg = (s.temps.reduce(function(a,b){return a+b;},0)/s.temps.length).toFixed(1);
      var mx = Math.max.apply(null,s.temps); var mn = Math.min.apply(null,s.temps);
      var mxIdx = s.temps.indexOf(mx); var mnIdx = s.temps.indexOf(mn);
      ctx.fillStyle = '#cba6f7'; ctx.font = '14px sans-serif'; ctx.fillText('📊 天气统计', 180, 30);
      ctx.fillStyle = '#cdd6f4'; ctx.font = '13px monospace';
      ctx.fillText('平均温度: ' + avg + '°C', 100, 70);
      ctx.fillStyle = '#FBBF24'; ctx.fillText('最高温度: ' + mx + '°C ('+s.months[mxIdx]+'月)', 100, 100);
      ctx.fillStyle = '#89b4fa'; ctx.fillText('最低温度: ' + mn + '°C ('+s.months[mnIdx]+'月)', 100, 130);
      ctx.fillStyle = '#a6e3a1'; ctx.fillText('温差: ' + (mx-mn) + '°C', 100, 160);
      ctx.fillStyle = '#6c7086'; ctx.font = '11px sans-serif';
      ctx.fillText('使用 sum()/len()/max()/min() 分析', 120, 200);
    },
    clear: function(s) { s.ctx.fillStyle = '#1a1a2e'; s.ctx.fillRect(0,0,500,240); }
  }
};

      function draw3D() {
        ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0,0,500,240);

        ctx.beginPath();
        ctx.moveTo(cx,cy); ctx.lineTo(cx+80,cy+40); ctx.stroke();
        ctx.moveTo(cx,cy); ctx.lineTo(cx-80,cy+40); ctx.stroke();
        ctx.moveTo(cx,cy); ctx.lineTo(cx,cy-80); ctx.stroke();
        var pts = [];
        for (var i = 0; i < 30; i++) {
          var x = (Math.random()-0.5)*120, y = (Math.random()-0.5)*120, z = (Math.random()-0.5)*120;

        }

          var px = cx + rx, py = cy + ry*0.4 - p[2]*0.5;

          ctx.beginPath(); ctx.arc(px,py,size,0,Math.PI*2); ctx.fill();

    '</div>' +
    '<div class="lesson-progress">' + dots +
      '<span class="progress-label" id="progressLabel">5 个环节</span>' +
    '</div>' +
  '</div></div>';
}

function renderGoals(lesson) {
  var goals = lesson.goals.map(function(g) {
    return '<div class="goal-item"><div class="icon">' + g.icon + '</div>' +
      '<h4>' + g.title + '</h4><p>' + g.desc + '</p></div>';
  }).join('');
  return '<section class="section"><div class="container">' +
    '<div class="goals-card"><h2>🎯 这节课我们要学会</h2>' +
    '<div class="goal-grid">' + goals + '</div></div></div></section>';
}

function renderInfoGrid(items) {
  var html = items.map(function(item) {
    return '<div style="background:' + item.bg + ';border-radius:var(--radius-sm);padding:16px;text-align:center;">' +
      '<div style="font-size:32px;margin-bottom:8px;">' + item.icon + '</div>' +
      '<h4 style="font-size:16px;margin-bottom:4px;">' + item.title + '</h4>' +
      '<p style="font-size:13px;color:var(--text-sub);">' + item.desc + '</p></div>';
  }).join('');
  return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:16px 0;">' + html + '</div>';
}

function renderCode(code, label) {
  var dots = '<span class="code-dot" style="background:#ff5f56;"></span>' +
    '<span class="code-dot" style="background:#ffbd2e;"></span>' +
    '<span class="code-dot" style="background:#27c93f;"></span>';
  return '<div class="code-block"><div class="code-header">' + dots +
    '<span class="code-label">' + (label || 'main.py') + '</span></div>' +
    '<pre>' + pyCode(code) + '</pre></div>';
}

function renderTips(tips) {
  if (!tips) return '';
  return tips.map(function(t) {
    return '<div class="tip"><span class="tip-icon">' + t.icon + '</span>' +
      '<div><strong>' + t.strong + '</strong>' + t.text + '</div></div>';
  }).join('');
}

function renderTasks(tasks) {
  var html = tasks.map(function(t) {
    return '<div class="task-item" onclick="toggleTask(this)">' +
      '<div class="task-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
      '<div><div class="task-text">' + t.text + '</div>' +
      (t.hint ? '<div class="task-hint">' + t.hint + '</div>' : '') + '</div></div>';
  }).join('');
  return '<div class="task-list">' + html + '</div>';
}

function renderDemoBox(demoType) {
  var demo = DEMOS[demoType];
  if (!demo) return '';
  return '<div class="demo-box">' + demo.stage() +
    '<div class="demo-controls">' + demo.controls() + '</div></div>';
}

function renderSummary(lesson) {
  var chips = lesson.knowledgePoints.map(function(kp) {
    return '<span class="kp-chip">' + kp + '</span>';
  }).join('');
  return '<div class="summary-card"><h3>📝 今天我们学到了</h3>' +
    '<p>' + lesson.summary + '</p>' +
    '<div class="knowledge-points">' + chips + '</div></div>';
}

function renderHomework(lesson) {
  var items = lesson.homework.map(function(hw) {
    var stars = '';
    for (var i = 0; i < hw.stars; i++) stars += '⭐';
    return '<div class="hw-item"><span class="hw-star">' + stars + '</span>' +
      '<div><h4>' + hw.title + '</h4><p>' + hw.desc + '</p></div></div>';
  }).join('');
  return '<div style="margin-top:24px;" class="homework">' +
    '<h3 style="margin-bottom:6px;">🏠 课后小任务</h3>' +
    '<p style="color:var(--text-sub);font-size:14px;margin-bottom:16px;">回家后打开 Python，完成下面的练习，下节课带过来分享哦！</p>' +
    items + '</div>';
}

function renderStep(step, index, lesson) {
  var html = '<div class="step-block" id="step' + (index + 1) + '">' +
    '<div class="step-num">' + (index + 1) + '</div>' +
    '<div class="step-content">' +
      '<div class="step-head"><h3>' + step.emoji + ' ' + step.title + '</h3>' +
        '<span class="step-time">⏱ ' + step.time + '</span></div>' +
      '<p class="step-desc">' + step.desc + '</p>';
  if (step.infoGrid) html += renderInfoGrid(step.infoGrid);
  if (step.code) html += renderCode(step.code, step.codeLabel);
  if (step.demoType) html += renderDemoBox(step.demoType);
  if (step.tasks) html += renderTasks(step.tasks);
  if (step.tips) html += renderTips(step.tips);
  if (index === 4) {
    html += renderSummary(lesson);
    html += renderHomework(lesson);
  }
  html += '</div></div>';
  return html;
}

function renderNav(lesson, key) {
  var no = lesson.no;
  var prevKey = no > 1 ? 'p2-' + String(no - 1).padStart(2, '0') : null;
  var nextKey = no < 32 ? 'p2-' + String(no + 1).padStart(2, '0') : null;
  var prevHTML, nextHTML;
  if (prevKey) {
    prevHTML = '<a href="#' + prevKey + '"><span class="arrow">←</span><div><div class="label">上一节课</div><div class="title">第' + (no - 1) + '课：' + LESSONS[prevKey].title + '</div></div></a>';
  } else {
    prevHTML = '<a href="index.html#courses"><span class="arrow">←</span><div><div class="label">返回课程体系</div><div class="title">Scratch & Python</div></div></a>';
  }
  if (nextKey) {
    nextHTML = '<a href="#' + nextKey + '" class="next"><div style="text-align:right;"><div class="label">下一节课</div><div class="title">第' + (no + 1) + '课：' + LESSONS[nextKey].title + '</div></div><span class="arrow">→</span></a>';
  } else {
    nextHTML = '<a href="index.html#courses" class="next"><div style="text-align:right;"><div class="label">返回课程体系</div><div class="title">全部课程完成 🎉</div></div><span class="arrow">→</span></a>';
  }
  return '<div class="lesson-nav">' + prevHTML + nextHTML + '</div>';
}

/* ================================================================
   主渲染 + 事件处理
   ================================================================ */
var demoState = { type: null };
// Fix: promote helper methods starting with an underscore inside actions to the demo top level, ensuring DEMOS['x']._helper is available
Object.keys(DEMOS).forEach(function(k) {
  var d = DEMOS[k];
  if (d && d.actions) {
    Object.keys(d.actions).forEach(function(a) {
      if (a.charAt(0) === '_' && !d[a]) d[a] = d.actions[a];
    });
  }
});

function getCurrentKey() {
  var hash = location.hash.slice(1);
  if (!LESSONS[hash]) hash = 'p2-01';
  return hash;
}

function render(key) {
  var lesson = LESSONS[key];
  if (!lesson) { key = 'p2-01'; lesson = LESSONS[key]; }

  // 清理旧 demo
  if (demoState.type && DEMOS[demoState.type] && DEMOS[demoState.type].cleanup) {
    DEMOS[demoState.type].cleanup(demoState);
  }

  // 构建 steps HTML
  var stepsHTML = lesson.steps.map(function(s, i) {
    return renderStep(s, i, lesson);
  }).join('');

  var navHTML = renderNav(lesson, key);

  var html = renderTopbar(lesson) +
    renderGoals(lesson) +
    '<section class="section" style="padding-top:0;"><div class="container">' +
    stepsHTML + navHTML + '</div></section>';

  document.getElementById('app').innerHTML = html;
  document.title = 'Python P2 第' + lesson.no + '课 · ' + lesson.title + ' | 汽水老师编程课堂';

  // 初始化 demo
  var demoStep = lesson.steps.find(function(s) { return s.demoType; });
  if (demoStep) {
    demoState = { type: demoStep.demoType };
    var demo = DEMOS[demoStep.demoType];
    if (demo) demo.init(demoState);
  } else {
    demoState = { type: null };
  }

  // 设置滚动观察器
  setupScrollObserver();

  // 滚动到顶部
  window.scrollTo(0, 0);
}

function toggleTask(el) {
  el.classList.toggle('done');
  updateProgress();
}

function updateProgress() {
  var total = document.querySelectorAll('.task-item').length;
  var done = document.querySelectorAll('.task-item.done').length;
  var dots = document.querySelectorAll('.progress-dot');
  if (total === 0 || dots.length === 0) return;
  var ratio = done / total;
  dots.forEach(function(d, i) {
    d.classList.remove('done');
    if (ratio >= (i + 1) / dots.length) d.classList.add('done');
  });
  var label = document.getElementById('progressLabel');
  if (label) label.textContent = '任务完成 ' + done + '/' + total;
}

function scrollToStep(n) {
  var el = document.getElementById('step' + n);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
}

function demoAction(action) {
  var demo = DEMOS[demoState.type];
  if (demo && demo.actions && demo.actions[action]) {
    demo.actions[action](demoState);
  }
}

function setupScrollObserver() {
  var stepBlocks = document.querySelectorAll('.step-block');
  var dots = document.querySelectorAll('.progress-dot');
  if (stepBlocks.length === 0 || dots.length === 0) return;
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        var idx = Array.from(stepBlocks).indexOf(e.target);
        dots.forEach(function(d) { d.classList.remove('active'); });
        if (dots[idx] && !dots[idx].classList.contains('done')) {
          dots[idx].classList.add('active');
        }
      }
    });
  }, { threshold: 0.3 });
  stepBlocks.forEach(function(s) { observer.observe(s); });
}

/* ================================================================
   左侧课程目录：列出全部课程，点击跳转；含回到首页
   ================================================================ */
var _rawRender = render;
render = function(key) { _rawRender(key); updateToc(); };

function buildToc() {
  var sidebar = document.getElementById('tocSidebar');
  var groups = {};
  Object.keys(LESSONS).forEach(function(k) {
    var l = LESSONS[k];
    var u = l.unitNo != null ? l.unitNo : 0;
    if (!groups[u]) groups[u] = { name: l.unit || '课程', items: [] };
    groups[u].items.push({ key: k, no: l.no, title: l.title });
  });
  var html = '<button id="tocCollapse" class="toc-collapse" title="收起/展开目录" aria-label="收起或展开目录">◀</button>' +
    '<div class="toc-head"><a class="toc-home" href="index.html">🏠 回到首页</a>' +
    '<div class="toc-title">课程目录</div></div><div class="toc-list">';
  Object.keys(groups).map(Number).sort(function(a, b) { return a - b; }).forEach(function(u) {
    html += '<div class="toc-unit">' + groups[u].name + '</div>';
    groups[u].items.forEach(function(it) {
      html += '<div class="toc-item" data-key="' + it.key + '"><span class="toc-no">第' + it.no + '课</span><span>' + it.title + '</span></div>';
    });
  });
  html += '</div>';
  sidebar.innerHTML = html;
  sidebar.addEventListener('click', function(e) {
    var item = e.target.closest('.toc-item');
    if (item) {
      location.hash = '#' + item.getAttribute('data-key');
      if (window.innerWidth <= 1100) toggleToc(false);
    }
  });
}

function updateToc() {
  var sidebar = document.getElementById('tocSidebar');
  if (!sidebar || !sidebar.querySelector('.toc-item')) return;
  var key = getCurrentKey();
  sidebar.querySelectorAll('.toc-item').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-key') === key);
  });
  var active = sidebar.querySelector('.toc-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function toggleToc(open) {
  document.getElementById('tocSidebar').classList.toggle('open', open);
  document.getElementById('tocMask').classList.toggle('open', open);
}

buildToc();
document.getElementById('tocFab').addEventListener('click', function() {
  toggleToc(!document.getElementById('tocSidebar').classList.contains('open'));
});
document.getElementById('tocMask').addEventListener('click', function() { toggleToc(false); });

/* 目录收起/展开（桌面端），状态记忆 */
try {
  if (localStorage.getItem('tocCollapsed') === '1') document.body.classList.add('toc-collapsed');
} catch (e) {}
document.getElementById('tocCollapse').addEventListener('click', function() {
  var collapsed = document.body.classList.toggle('toc-collapsed');
  try { localStorage.setItem('tocCollapsed', collapsed ? '1' : '0'); } catch (e) {}
});

// hash 变化时重新渲染
window.addEventListener('hashchange', function() { render(getCurrentKey()); });

// 初始渲染
var _initKey = getCurrentKey();
if (location.hash !== '#' + _initKey) {
  location.hash = _initKey;
} else {
  render(_initKey);
}
</script>
