﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scratch L1 课程 | 汽水老师编程课堂</title>
<style>
:root {
  --primary: #4F6BFF;
  --primary-dark: #3A52E0;
  --primary-soft: #E8ECFF;
  --yellow: #FFC93C;
  --orange: #FF7A45;
  --coral: #FF6B81;
  --mint: #2DD4BF;
  --green: #51CF66;
  --lavender: #8B5CF6;
  --bg: #F4F7FF;
  --surface: #FFFFFF;
  --text: #1E2A44;
  --text-sub: #5B6B8C;
  --border: #E3E9F5;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --shadow-sm: 0 4px 12px rgba(79,107,255,.10);
  --shadow-md: 0 12px 30px rgba(30,42,68,.12);
  --shadow-lg: 0 24px 60px rgba(79,107,255,.22);
  --font-display: 'Trebuchet MS', 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, sans-serif;
  --font-body: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-mono: 'Consolas', 'Courier New', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); color: var(--text); background: var(--bg); line-height: 1.6; overflow-x: hidden; }
h1,h2,h3,h4 { font-family: var(--font-display); line-height: 1.25; color: var(--text); }
a { color: inherit; text-decoration: none; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
.section { padding: 56px 0; position: relative; }
.section-title { font-size: clamp(24px, 3.5vw, 34px); font-weight: 800; margin-bottom: 10px; }
.section-sub { color: var(--text-sub); font-size: 16px; margin-bottom: 28px; }

/* 顶部固定栏 */
.topbar {
  position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
}
.topbar-inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; gap: 16px; flex-wrap: wrap; }
.course-info { display: flex; align-items: center; gap: 14px; }
.course-badge {
  background: linear-gradient(135deg, var(--orange), var(--coral)); color: #fff;
  padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
}
.course-info h1 { font-size: 18px; font-weight: 800; }
.course-info .meta { font-size: 13px; color: var(--text-sub); }
.lesson-progress { display: flex; gap: 6px; align-items: center; }
.progress-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--border); cursor: pointer;
  transition: all .3s;
}
.progress-dot.active { background: var(--primary); transform: scale(1.3); }
.progress-dot.done { background: var(--green); transform: scale(1.3); }
.progress-label { font-size: 13px; color: var(--text-sub); margin-left: 8px; }
@media (max-width: 700px) { .lesson-progress { display: none; } }

/* 学习目标卡 */
.goals-card {
  background: linear-gradient(135deg, var(--primary), var(--lavender));
  color: #fff; border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg);
}
.goals-card h2 { color: #fff; margin-bottom: 20px; }
.goal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.goal-item {
  background: rgba(255,255,255,.15); border-radius: var(--radius-md); padding: 18px;
  backdrop-filter: blur(8px);
}
.goal-item .icon {
  width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,.25);
  display: grid; place-items: center; margin-bottom: 12px; font-size: 20px;
}
.goal-item h4 { color: #fff; font-size: 16px; margin-bottom: 6px; }
.goal-item p { font-size: 14px; opacity: .92; }
@media (max-width: 700px) { .goal-grid { grid-template-columns: 1fr; } }

/* 教学环节 */
.step-block { display: flex; gap: 24px; margin-bottom: 28px; }
.step-num {
  flex-shrink: 0; width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--lavender)); color: #fff;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 22px;
  box-shadow: 0 8px 20px rgba(79,107,255,.35); position: relative;
}
.step-num::after {
  content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: calc(100% + 28px);
  background: linear-gradient(var(--primary), transparent); transform: translateX(-50%);
}
.step-block:last-child .step-num::after { display: none; }
.step-content { flex: 1; background: #fff; border-radius: var(--radius-md); padding: 24px 28px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.step-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
.step-head h3 { font-size: 22px; }
.step-time {
  font-size: 13px; color: var(--primary); background: var(--primary-soft);
  padding: 5px 12px; border-radius: 999px; font-weight: 700;
}
.step-desc { color: var(--text-sub); margin-bottom: 16px; }

/* Scratch 积木块样式 */
.blocks { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.block {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 6px; color: #fff; font-size: 14px; font-weight: 600;
  box-shadow: 0 2px 4px rgba(0,0,0,.12); position: relative;
}
.block.event { background: #FFBF00; color: #4A3B00; }
.block.motion { background: #4C97FF; }
.block.looks { background: #9966FF; }
.block.sound { background: #CF63CF; }
.block.control { background: #FFAB19; color: #4A3B00; }
.block.pen { background: #0FA95F; }
.block.sensing { background: #5CB1D6; }
.block.operators { background: #59C059; color: #1B5E20; }
.block.variables { background: #FF8C1A; }
.block .slot {
  background: rgba(255,255,255,.85); color: var(--text); padding: 2px 10px;
  border-radius: 4px; font-family: var(--font-mono); font-size: 13px; min-width: 30px; text-align: center;
}
.block-row { display: flex; align-items: center; gap: 8px; }
.stack-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; font-weight: 700; }

/* 互动演示区 */
.demo-box {
  background: var(--bg); border: 2px dashed var(--border); border-radius: var(--radius-md);
  padding: 24px; margin: 16px 0; text-align: center;
}
.demo-stage {
  width: 100%; max-width: 480px; height: 220px; margin: 0 auto; background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 100%);
  border-radius: var(--radius-sm); position: relative; overflow: hidden; border: 3px solid #fff; box-shadow: var(--shadow-sm);
}
.demo-actor { position: absolute; }
.demo-actor svg { width: 100%; height: 100%; }
.demo-bubble {
  position: absolute; top: 12px; left: 110px; background: #fff; padding: 8px 14px;
  border-radius: 14px; font-size: 14px; font-weight: 600; opacity: 0; transform: scale(.8);
  transition: all .3s; box-shadow: var(--shadow-sm); z-index: 5;
}
.demo-bubble.show { opacity: 1; transform: scale(1); }
.demo-bubble::before {
  content: ''; position: absolute; left: -8px; bottom: 12px; border: 8px solid transparent; border-right-color: #fff;
}
.demo-bubble.think { border-radius: 30px; }
.demo-bubble.think::before { width: 6px; height: 6px; border: none; border-radius: 50%; background: #fff; left: -6px; bottom: 6px; }
.demo-controls { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.demo-btn {
  padding: 10px 20px; border: none; border-radius: 999px; font-weight: 700; cursor: pointer;
  font-family: inherit; font-size: 14px; transition: transform .15s, box-shadow .15s; color: #fff;
}
.demo-btn:hover { transform: translateY(-2px); }
.demo-btn:active { transform: translateY(0); }
.demo-btn.motion { background: var(--primary); box-shadow: 0 4px 12px rgba(79,107,255,.3); }
.demo-btn.looks { background: var(--lavender); box-shadow: 0 4px 12px rgba(139,92,246,.3); }
.demo-btn.sound { background: var(--coral); box-shadow: 0 4px 12px rgba(255,107,129,.3); }
.demo-btn.control { background: var(--orange); box-shadow: 0 4px 12px rgba(255,122,69,.3); }
.demo-btn.sensing { background: #5CB1D6; box-shadow: 0 4px 12px rgba(92,177,214,.3); }
.demo-btn.event { background: var(--yellow); color: #4A3B00; box-shadow: 0 4px 12px rgba(255,201,60,.3); }
.demo-btn.pen { background: var(--green); box-shadow: 0 4px 12px rgba(81,207,102,.3); }
.demo-btn.reset { background: var(--text-sub); }
.demo-note { position: absolute; font-size: 24px; animation: noteFloat 1.5s ease-out forwards; pointer-events: none; z-index: 5; }
@keyframes noteFloat {
  0% { transform: translateY(0) scale(.5); opacity: 0; }
  20% { opacity: 1; transform: translateY(-20px) scale(1); }
  100% { transform: translateY(-130px) scale(.8); opacity: 0; }
}
.demo-stage canvas { border-radius: 8px; display: block; margin: 0 auto; }
.greeting-card {
  width: 180px; height: 120px; margin: 40px auto; border-radius: 12px;
  background: linear-gradient(135deg, #FF6B81, #FFC93C); display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 20px; box-shadow: 0 8px 20px rgba(255,107,129,.3);
  transition: transform .5s; cursor: pointer;
}
.greeting-card.open { transform: scale(1.1) rotate(2deg); }
.heart-float { position: absolute; font-size: 20px; animation: heartUp 1.5s ease-out forwards; pointer-events: none; z-index: 5; }
@keyframes heartUp {
  0% { transform: translateY(0) scale(0); opacity: 0; }
  20% { opacity: 1; transform: translateY(-10px) scale(1); }
  100% { transform: translateY(-100px) scale(.8); opacity: 0; }
}

/* 任务清单 */
.task-list { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
.task-item {
  display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px;
  background: var(--bg); border-radius: var(--radius-sm); cursor: pointer; transition: all .25s;
  border: 2px solid transparent; position: relative;
}
.task-item > * { position: relative; z-index: 1; }
.task-item::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(135deg, rgba(254,240,138,.5), rgba(253,224,71,.42));
  opacity: 0; transition: opacity .45s ease;
}
.task-item:hover { border-color: var(--primary-soft); }
.task-item.done { border-color: rgba(234,179,8,.5); box-shadow: 0 4px 14px rgba(234,179,8,.18); }
.task-item.done::before { opacity: 1; }
.task-check {
  width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border);
  flex-shrink: 0; display: grid; place-items: center; transition: all .25s; margin-top: 1px;
}
.task-item.done .task-check { background: var(--green); border-color: var(--green); }
.task-check svg { opacity: 0; transition: opacity .2s; }
.task-item.done .task-check svg { opacity: 1; color: #fff; }
.task-text { font-size: 15px; }
.task-item.done .task-text { text-decoration: line-through; color: var(--text-sub); }
.task-hint { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

/* 小贴士 */
.tip {
  background: #FFF8E1; border-left: 4px solid var(--yellow); border-radius: var(--radius-sm);
  padding: 14px 18px; margin: 16px 0; display: flex; gap: 12px; align-items: flex-start;
}
.tip .tip-icon { flex-shrink: 0; }
.tip strong { color: var(--orange); }

/* 小结 */
.summary-card {
  background: linear-gradient(135deg, #FFF8E1, #FFE0B2); border-radius: var(--radius-lg);
  padding: 32px; border: 2px solid var(--yellow);
}
.summary-card h3 { color: var(--orange); margin-bottom: 16px; }
.knowledge-points { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.kp-chip {
  background: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  color: var(--orange); box-shadow: var(--shadow-sm);
}

/* 课后作业 */
.homework { background: #fff; border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.hw-item { padding: 18px 0; border-bottom: 1px dashed var(--border); display: flex; gap: 16px; align-items: flex-start; }
.hw-item:last-child { border-bottom: none; }
.hw-star { color: var(--yellow); font-size: 20px; flex-shrink: 0; }
.hw-item h4 { font-size: 17px; margin-bottom: 4px; }
.hw-item p { color: var(--text-sub); font-size: 14px; }

/* 页脚导航 */
.lesson-nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 40px; flex-wrap: wrap; }
.lesson-nav a {
  flex: 1; min-width: 200px; padding: 18px 24px; background: #fff; border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: all .25s; display: flex;
  align-items: center; gap: 14px;
}
.lesson-nav a:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
.lesson-nav .arrow { font-size: 24px; color: var(--primary); }
.lesson-nav .label { font-size: 13px; color: var(--text-sub); }
.lesson-nav .title { font-weight: 700; font-size: 16px; }
.lesson-nav .next { text-align: right; flex-direction: row-reverse; }

/* 响应式 */
@media (max-width: 700px) {
  .section { padding: 40px 0; }
  .topbar-inner { padding: 10px 14px; gap: 10px; }
  .course-info h1 { font-size: 15px; }
  .course-info .meta { display: none; }
  .step-block { flex-direction: column; gap: 14px; }
  .step-num::after { display: none; }
  .step-num { width: 44px; height: 44px; font-size: 16px; }
  .step-content { padding: 18px 14px; }
  .step-head h3 { font-size: 19px; }
  .step-desc { font-size: 14px; }
  .demo-box { overflow-x: auto; }
  .code-block pre { padding: 14px; font-size: 12.5px; }
  .task-item { padding: 14px; gap: 10px; }
}

/* 左侧课程目录 */
.toc-sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 240px; z-index: 101;
  background: #fff; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; transition: transform .3s ease;
}
.toc-head { padding: 16px 16px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.toc-home {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 12px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px;
  background: var(--primary); color: #fff; transition: transform .2s, box-shadow .2s;
}
.toc-home:hover { transform: translateY(-2px); box-shadow: 0 8px 18px var(--primary-soft); color: #fff; }
.toc-title { font-size: 12px; font-weight: 800; color: var(--text-sub); letter-spacing: 2px; margin-top: 12px; }
.toc-list { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
.toc-unit { font-size: 12px; font-weight: 700; color: var(--text-sub); padding: 12px 8px 4px; }
.toc-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px;
  font-size: 13.5px; cursor: pointer; transition: background .2s; line-height: 1.45;
}
.toc-item:hover { background: var(--primary-soft); }
.toc-item.active { background: var(--primary-soft); color: var(--primary-dark); font-weight: 700; }
.toc-no { flex-shrink: 0; font-size: 11px; font-weight: 700; color: #fff; background: var(--primary); border-radius: 6px; padding: 2px 6px; }
.toc-item.active .toc-no { background: var(--primary-dark); }
.toc-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 100; opacity: 0; pointer-events: none; transition: opacity .3s; }
.toc-mask.open { opacity: 1; pointer-events: auto; }
.toc-fab {
  display: none; position: fixed; right: 18px; bottom: 18px; z-index: 94;
  border: none; cursor: pointer; padding: 12px 18px; border-radius: 999px;
  background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; font-family: var(--font-body);
  box-shadow: 0 8px 20px rgba(0,0,0,.18);
}
@media (max-width: 1100px) {
  .toc-sidebar { transform: translateX(-100%); }
  .toc-sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,.2); }
  .toc-fab { display: block; }
}
/* 目录收起/展开按钮 */
.toc-collapse {
  position: absolute; right: -13px; top: 14px; width: 26px; height: 26px;
  border-radius: 50%; border: 1px solid var(--border); background: #fff;
  color: var(--text-sub); cursor: pointer; font-size: 11px; font-family: inherit;
  display: grid; place-items: center; box-shadow: 0 2px 8px rgba(30,42,68,.16);
  transition: transform .3s ease; padding: 0; z-index: 5;
}
.toc-collapse:hover { color: var(--primary); border-color: var(--primary-soft); }
@media (min-width: 1101px) {
  #app { margin-left: 240px; transition: margin-left .3s ease; }
  body.toc-collapsed #app { margin-left: 0; }
  body.toc-collapsed .toc-sidebar { transform: translateX(-100%); }
  body.toc-collapsed .toc-collapse { transform: rotate(180deg); }
}
@media (max-width: 1100px) {
  .toc-collapse { display: none; }
}
</style>

<button id="tocFab" class="toc-fab">☰ 课程目录</button>

    _note: function(s, freq, emoji) {
      try {
        if (!s.audioCtx) s.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = s.audioCtx.createOscillator();
        var gain = s.audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        osc.connect(gain);
        gain.connect(s.audioCtx.destination);
        gain.gain.setValueAtTime(0.2, s.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, s.audioCtx.currentTime + 0.5);
        osc.start();
        osc.stop(s.audioCtx.currentTime + 0.5);
      } catch(e) {}
      DEMOS.sound._showNote(s, emoji || '🎵');
    },
    _showNote: function(s, emoji) {
      var note = document.createElement('div');
      note.className = 'demo-note';
      note.textContent = emoji;
      note.style.left = (20 + Math.random() * 60) + '%';

};

    twelve: function(s) {
      if (s.interval) { clearInterval(s.interval); s.interval = null; }
      for (var i = 0; i < 12; i++) DEMOS.loop._drawShape(s, i);
    },
    infinite: function(s) {
      if (s.interval) { clearInterval(s.interval); s.interval = null; }
      var i = 0;
      s.interval = setInterval(function() { DEMOS.loop._drawShape(s, i++); }, 300);
    },
    stop: function(s) { if (s.interval) { clearInterval(s.interval); s.interval = null; } },

      var cx = 220, cy = 100, r = 60;

      var y = cy + Math.sin(angle) * r;

      ctx.beginPath();
      ctx.arc(x, y, 12, 0, Math.PI * 2);
      ctx.stroke();
      s.count++;
      s.label.textContent = '画 ' + s.count + ' 个图形' + (s.interval ? '（无限循环中）' : '');

      s.actor.style.top = s.y + 'px';

      if (s.opened) return;
      s.opened = true;
      s.card.classList.add('open');
      s.card.innerHTML = '🎉<br>生日快乐！';
      s.bubble.textContent = '收到贺卡啦！';
      s.bubble.classList.add('show');
      for (var i = 0; i < 8; i++) {
        setTimeout(function() { DEMOS['project-card']._heart(s); }, i * 150);
      }
      setTimeout(function() { s.bubble.classList.remove('show'); }, 2000);
    },
    play: function(s) {
      s.bubble.textContent = '🎵 祝你生日快乐！';
      s.bubble.classList.add('show');
      try {
        if (!s.audioCtx) s.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var notes = [262, 262, 294, 262, 349, 330];
        notes.forEach(function(f, i) {
          var osc = s.audioCtx.createOscillator();
          var gain = s.audioCtx.createGain();
          osc.frequency.value = f;
          osc.type = 'sine';
          osc.connect(gain);
          gain.connect(s.audioCtx.destination);
          gain.gain.setValueAtTime(0.15, s.audioCtx.currentTime + i * 0.4);
          gain.gain.exponentialRampToValueAtTime(0.01, s.audioCtx.currentTime + i * 0.4 + 0.35);
          osc.start(s.audioCtx.currentTime + i * 0.4);
          osc.stop(s.audioCtx.currentTime + i * 0.4 + 0.35);
        });
      } catch(e) {}
      setTimeout(function() { s.bubble.classList.remove('show'); }, 3000);
    },
    reset: function(s) {
      s.opened = false;
      s.card.classList.remove('open');
      s.card.innerHTML = '💌<br>点击我';
      s.bubble.classList.remove('show');
      s.hearts.innerHTML = '';
    },
    _heart: function(s) {
      var h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = ['💖','💝','💗','❤️','💕'][Math.floor(Math.random()*5)];
      h.style.left = (20 + Math.random() * 60) + '%';
      h.style.top = '50%';
      s.hearts.appendChild(h);
      setTimeout(function() { if (h.parentNode) h.remove(); }, 1500);
    }
  }
};

/* --- project-final: 结课作品展示 --- */
DEMOS['project-final'] = {
  stage: function() {
    return '<div class="demo-stage" id="demoStage" style="background:linear-gradient(135deg,#4F6BFF,#8B5CF6);">' +
      '<div style="position:absolute;top:10px;left:10px;font-size:13px;color:#fff;opacity:.8;" id="demoLabel">🎬 结课作品展示</div>' +
      '<div class="demo-actor" id="demoActor" style="bottom:20px;left:50%;transform:translateX(-50%);width:80px;height:80px;transition:all .4s;">' + catSVG(1) + '</div>' +
      '<div class="demo-bubble" id="demoBubble" style="left:50%;transform:translateX(-50%);">点击「开始展示」</div>' +
      '<div id="demoEffects" style="position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;"></div>' +
      '</div>';
  },
  controls: function() {
    return '<button class="demo-btn motion" onclick="demoAction(\'run\')">▶ 开始展示</button>' +
      '<button class="demo-btn reset" onclick="demoAction(\'reset\')">重置</button>';
  },
  init: function(s) {
    s.actor = document.getElementById('demoActor');
    s.bubble = document.getElementById('demoBubble');
    s.label = document.getElementById('demoLabel');
    s.effects = document.getElementById('demoEffects');
    s.busy = false;
  },
  actions: {
    run: function(s) {
      if (s.busy) return;
      s.busy = true;
      var steps = [
        { label: '🎬 1. 移动', say: '我会走路！', fn: function() {
          s.actor.style.left = '20px';
          setTimeout(function() { s.actor.style.left = 'calc(100% - 80px)'; }, 500);
        }},
        { label: '🎭 2. 造型切换', say: '我会变身！', fn: function() {
          var c = 1;
          var iv = setInterval(function() { s.actor.innerHTML = catSVG(c = c % 4 + 1); }, 200);
          setTimeout(function() { clearInterval(iv); }, 1200);
        }},
        { label: '🎨 3. 变色', say: '我会变色！', fn: function() {
          var h = 0;
          var iv = setInterval(function() { s.actor.style.filter = 'hue-rotate(' + (h += 60) + 'deg)'; }, 200);
          setTimeout(function() { clearInterval(iv); }, 1200);
        }},
        { label: '🔊 4. 叫声', say: '喵～！', fn: function() {
          try {
            if (!s.audioCtx) s.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            var osc = s.audioCtx.createOscillator();
            var gain = s.audioCtx.createGain();
            osc.frequency.value = 800;
            osc.type = 'sine';
            osc.connect(gain);
            gain.connect(s.audioCtx.destination);
            gain.gain.setValueAtTime(0.15, s.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, s.audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(s.audioCtx.currentTime + 0.4);
          } catch(e) {}
        }},
        { label: '🎉 5. 毕业！', say: '我会编程啦！🎉', fn: function() {
          for (var i = 0; i < 10; i++) {
            setTimeout(function() {
              var p = document.createElement('div');
              p.className = 'demo-note';
              p.textContent = ['🎉','✨','🎊','⭐','💫'][Math.floor(Math.random()*5)];

/* ================================================================
   渲染函数
   ================================================================ */
function renderTopbar(lesson) {
  var dots = lesson.steps.map(function(s, i) {
    return '<span class="progress-dot' + (i === 0 ? ' active' : '') + '" data-s="' + (i + 1) + '" title="' + s.title + '" onclick="scrollToStep(' + (i + 1) + ')"></span>';
  }).join('');
  var projectTag = lesson.isProject ? ' · 🎬 作品课' : '';
  return '<div class="topbar"><div class="container topbar-inner">' +
    '<div class="course-info">' +
      '<span class="course-badge">Scratch · L1</span>' +
      '<div><h1>第' + lesson.no + '课：' + lesson.title + '</h1>' +
      '<div class="meta">汽水老师 · 6-8岁 · ' + lesson.duration + ' · ' + lesson.unit + projectTag + '</div></div>' +
    '</div>' +
    '<div class="lesson-progress">' + dots +
      '<span class="progress-label" id="progressLabel">5 个环节</span>' +
    '</div>' +
  '</div></div>';
}

function renderGoals(lesson) {
  var goals = lesson.goals.map(function(g) {
    return '<div class="goal-item"><div class="icon">' + g.icon + '</div>' +
      '<h4>' + g.title + '</h4><p>' + g.desc + '</p></div>';
  }).join('');
  return '<section class="section"><div class="container">' +
    '<div class="goals-card"><h2>🎯 这节课我们要学会</h2>' +
    '<div class="goal-grid">' + goals + '</div></div></div></section>';
}

function renderInfoGrid(items) {
  var html = items.map(function(item) {
    return '<div style="background:' + item.bg + ';border-radius:var(--radius-sm);padding:16px;text-align:center;">' +
      '<div style="font-size:32px;margin-bottom:8px;">' + item.icon + '</div>' +
      '<h4 style="font-size:16px;margin-bottom:4px;">' + item.title + '</h4>' +
      '<p style="font-size:13px;color:var(--text-sub);">' + item.desc + '</p></div>';
  }).join('');
  return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:16px 0;">' + html + '</div>';
}

function renderBlocks(blocks) {
  var flagIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg>';
  var html = blocks.map(function(b) {
    var icon = b.type === 'event' ? flagIcon : '';
    return '<div class="block ' + b.type + '">' + icon + ' ' + b.text + '</div>';
  }).join('');
  return '<div class="stack-label">📦 积木搭建（按顺序拼好）：</div>' +
    '<div class="blocks">' + html + '</div>';
}

function renderTips(tips) {
  if (!tips) return '';
  return tips.map(function(t) {
    return '<div class="tip"><span class="tip-icon">' + t.icon + '</span>' +
      '<div><strong>' + t.strong + '</strong>' + t.text + '</div></div>';
  }).join('');
}

function renderTasks(tasks) {
  var html = tasks.map(function(t) {
    return '<div class="task-item" onclick="toggleTask(this)">' +
      '<div class="task-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
      '<div><div class="task-text">' + t.text + '</div>' +
      (t.hint ? '<div class="task-hint">' + t.hint + '</div>' : '') + '</div></div>';
  }).join('');
  return '<div class="task-list">' + html + '</div>';
}

function renderDemoBox(demoType) {
  var demo = DEMOS[demoType];
  if (!demo) return '';
  return '<div class="demo-box">' + demo.stage() +
    '<div class="demo-controls">' + demo.controls() + '</div></div>';
}

function renderSummary(lesson) {
  var chips = lesson.knowledgePoints.map(function(kp) {
    return '<span class="kp-chip">' + kp + '</span>';
  }).join('');
  return '<div class="summary-card"><h3>📝 今天我们学到了</h3>' +
    '<p>' + lesson.summary + '</p>' +
    '<div class="knowledge-points">' + chips + '</div></div>';
}

function renderHomework(lesson) {
  var items = lesson.homework.map(function(hw) {
    var stars = '';
    for (var i = 0; i < hw.stars; i++) stars += '⭐';
    return '<div class="hw-item"><span class="hw-star">' + stars + '</span>' +
      '<div><h4>' + hw.title + '</h4><p>' + hw.desc + '</p></div></div>';
  }).join('');
  return '<div style="margin-top:24px;" class="homework">' +
    '<h3 style="margin-bottom:6px;">🏠 课后小任务</h3>' +
    '<p style="color:var(--text-sub);font-size:14px;margin-bottom:16px;">回家后打开 Scratch，完成下面的练习，下节课带过来分享哦！</p>' +
    items + '</div>';
}

function renderStep(step, index, lesson) {
  var html = '<div class="step-block" id="step' + (index + 1) + '">' +
    '<div class="step-num">' + (index + 1) + '</div>' +
    '<div class="step-content">' +
      '<div class="step-head"><h3>' + step.emoji + ' ' + step.title + '</h3>' +
        '<span class="step-time">⏱ ' + step.time + '</span></div>' +
      '<p class="step-desc">' + step.desc + '</p>';
  if (step.infoGrid) html += renderInfoGrid(step.infoGrid);
  if (step.blocks) html += renderBlocks(step.blocks);
  if (step.demoType) html += renderDemoBox(step.demoType);
  if (step.tasks) html += renderTasks(step.tasks);
  if (step.tips) html += renderTips(step.tips);
  if (index === 4) {
    html += renderSummary(lesson);
    html += renderHomework(lesson);
  }
  html += '</div></div>';
  return html;
}

function renderNav(lesson, key) {
  var no = lesson.no;
  var prevKey = no > 1 ? 'l1-' + String(no - 1).padStart(2, '0') : null;
  var nextKey = no < 16 ? 'l1-' + String(no + 1).padStart(2, '0') : null;
  var prevHTML, nextHTML;
  if (prevKey) {
    prevHTML = '<a href="#' + prevKey + '"><span class="arrow">←</span><div><div class="label">上一节课</div><div class="title">第' + (no - 1) + '课：' + LESSONS[prevKey].title + '</div></div></a>';
  } else {
    prevHTML = '<a href="index.html#courses"><span class="arrow">←</span><div><div class="label">返回课程体系</div><div class="title">Scratch & Python</div></div></a>';
  }
  if (nextKey) {
    nextHTML = '<a href="#' + nextKey + '" class="next"><div style="text-align:right;"><div class="label">下一节课</div><div class="title">第' + (no + 1) + '课：' + LESSONS[nextKey].title + '</div></div><span class="arrow">→</span></a>';
  } else {
    nextHTML = '<a href="index.html#courses" class="next"><div style="text-align:right;"><div class="label">返回课程体系</div><div class="title">全部课程完成 🎉</div></div><span class="arrow">→</span></a>';
  }
  return '<div class="lesson-nav">' + prevHTML + nextHTML + '</div>';
}

/* ================================================================
   主渲染 + 事件处理
   ================================================================ */
var demoState = { type: null };
// Fix: promote helper methods starting with an underscore inside actions to the demo top level, ensuring DEMOS['x']._helper is available
Object.keys(DEMOS).forEach(function(k) {
  var d = DEMOS[k];
  if (d && d.actions) {
    Object.keys(d.actions).forEach(function(a) {
      if (a.charAt(0) === '_' && !d[a]) d[a] = d.actions[a];
    });
  }
});

function getCurrentKey() {
  var hash = location.hash.slice(1);
  if (!LESSONS[hash]) hash = 'l1-01';
  return hash;
}

function render(key) {
  var lesson = LESSONS[key];
  if (!lesson) { key = 'l1-01'; lesson = LESSONS[key]; }

  // 清理旧 demo
  if (demoState.type && DEMOS[demoState.type] && DEMOS[demoState.type].cleanup) {
    DEMOS[demoState.type].cleanup(demoState);
  }

  // 构建 steps HTML
  var stepsHTML = lesson.steps.map(function(s, i) {
    return renderStep(s, i, lesson);
  }).join('');

  var navHTML = renderNav(lesson, key);

  var html = renderTopbar(lesson) +
    renderGoals(lesson) +
    '<section class="section" style="padding-top:0;"><div class="container">' +
    stepsHTML + navHTML + '</div></section>';

  document.getElementById('app').innerHTML = html;
  document.title = 'Scratch L1 第' + lesson.no + '课 · ' + lesson.title + ' | 汽水老师编程课堂';

  // 初始化 demo
  var demoStep = lesson.steps.find(function(s) { return s.demoType; });
  if (demoStep) {
    demoState = { type: demoStep.demoType };
    var demo = DEMOS[demoStep.demoType];
    if (demo) demo.init(demoState);
  } else {
    demoState = { type: null };
  }

  // 设置滚动观察器
  setupScrollObserver();

  // 滚动到顶部
  window.scrollTo(0, 0);
}

function toggleTask(el) {
  el.classList.toggle('done');
  updateProgress();
}

function updateProgress() {
  var total = document.querySelectorAll('.task-item').length;
  var done = document.querySelectorAll('.task-item.done').length;
  var dots = document.querySelectorAll('.progress-dot');
  if (total === 0 || dots.length === 0) return;
  var ratio = done / total;
  dots.forEach(function(d, i) {
    d.classList.remove('done');
    if (ratio >= (i + 1) / dots.length) d.classList.add('done');
  });
  var label = document.getElementById('progressLabel');
  if (label) label.textContent = '任务完成 ' + done + '/' + total;
}

function scrollToStep(n) {
  var el = document.getElementById('step' + n);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
}

function demoAction(action) {
  var demo = DEMOS[demoState.type];
  if (demo && demo.actions && demo.actions[action]) {
    demo.actions[action](demoState);
  }
}

function setupScrollObserver() {
  var stepBlocks = document.querySelectorAll('.step-block');
  var dots = document.querySelectorAll('.progress-dot');
  if (stepBlocks.length === 0 || dots.length === 0) return;
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        var idx = Array.from(stepBlocks).indexOf(e.target);
        dots.forEach(function(d) { d.classList.remove('active'); });
        if (dots[idx] && !dots[idx].classList.contains('done')) {
          dots[idx].classList.add('active');
        }
      }
    });
  }, { threshold: 0.3 });
  stepBlocks.forEach(function(s) { observer.observe(s); });
}

/* ================================================================
   左侧课程目录：列出全部课程，点击跳转；含回到首页
   ================================================================ */
var _rawRender = render;
render = function(key) { _rawRender(key); updateToc(); };

function buildToc() {
  var sidebar = document.getElementById('tocSidebar');
  var groups = {};
  Object.keys(LESSONS).forEach(function(k) {
    var l = LESSONS[k];
    var u = l.unitNo != null ? l.unitNo : 0;
    if (!groups[u]) groups[u] = { name: l.unit || '课程', items: [] };
    groups[u].items.push({ key: k, no: l.no, title: l.title });
  });
  var html = '<button id="tocCollapse" class="toc-collapse" title="收起/展开目录" aria-label="收起或展开目录">◀</button>' +
    '<div class="toc-head"><a class="toc-home" href="index.html">🏠 回到首页</a>' +
    '<div class="toc-title">课程目录</div></div><div class="toc-list">';
  Object.keys(groups).map(Number).sort(function(a, b) { return a - b; }).forEach(function(u) {
    html += '<div class="toc-unit">' + groups[u].name + '</div>';
    groups[u].items.forEach(function(it) {
      html += '<div class="toc-item" data-key="' + it.key + '"><span class="toc-no">第' + it.no + '课</span><span>' + it.title + '</span></div>';
    });
  });
  html += '</div>';
  sidebar.innerHTML = html;
  sidebar.addEventListener('click', function(e) {
    var item = e.target.closest('.toc-item');
    if (item) {
      location.hash = '#' + item.getAttribute('data-key');
      if (window.innerWidth <= 1100) toggleToc(false);
    }
  });
}

function updateToc() {
  var sidebar = document.getElementById('tocSidebar');
  if (!sidebar || !sidebar.querySelector('.toc-item')) return;
  var key = getCurrentKey();
  sidebar.querySelectorAll('.toc-item').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-key') === key);
  });
  var active = sidebar.querySelector('.toc-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function toggleToc(open) {
  document.getElementById('tocSidebar').classList.toggle('open', open);
  document.getElementById('tocMask').classList.toggle('open', open);
}

buildToc();
document.getElementById('tocFab').addEventListener('click', function() {
  toggleToc(!document.getElementById('tocSidebar').classList.contains('open'));
});
document.getElementById('tocMask').addEventListener('click', function() { toggleToc(false); });

/* 目录收起/展开（桌面端），状态记忆 */
try {
  if (localStorage.getItem('tocCollapsed') === '1') document.body.classList.add('toc-collapsed');
} catch (e) {}
document.getElementById('tocCollapse').addEventListener('click', function() {
  var collapsed = document.body.classList.toggle('toc-collapsed');
  try { localStorage.setItem('tocCollapsed', collapsed ? '1' : '0'); } catch (e) {}
});

// hash 变化时重新渲染
window.addEventListener('hashchange', function() { render(getCurrentKey()); });

// 初始渲染
var _initKey = getCurrentKey();
if (location.hash !== '#' + _initKey) {
  location.hash = _initKey;
} else {
  render(_initKey);
}
