﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Python P3 · AI 与竞赛课程 | 汽水老师编程课堂</title>
<style>
:root {
  --primary: #51CF66;
  --primary-dark: #37B24D;
  --primary-soft: #E7F9EC;
  --green-deep: #2F9E44;
  --green-light: #94D82D;
  --teal: #12B886;
  --blue: #4DABF7;
  --yellow: #FCC419;
  --orange: #FF922B;
  --coral: #FF6B6B;
  --purple: #9775FA;
  --pink: #F783AC;
  --bg: #F2FBF4;
  --surface: #FFFFFF;
  --text: #1A2B22;
  --text-sub: #4B6B58;
  --border: #D6EDD9;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --shadow-sm: 0 4px 12px rgba(47,158,68,.10);
  --shadow-md: 0 12px 30px rgba(26,43,34,.12);
  --shadow-lg: 0 24px 60px rgba(47,158,68,.22);
  --code-bg: #0F1B17;
  --code-fg: #E6EDF0;
  --font-display: 'Trebuchet MS', 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, sans-serif;
  --font-body: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-mono: 'Consolas', 'JetBrains Mono', 'Courier New', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); color: var(--text); background: var(--bg); line-height: 1.65; overflow-x: hidden; }
h1,h2,h3,h4 { font-family: var(--font-display); line-height: 1.3; color: var(--text); }
a { color: inherit; text-decoration: none; }
.container { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
.section { padding: 48px 0; position: relative; }

/* 顶部固定栏 */
.topbar {
  position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.94);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
}
.topbar-inner { display: flex; align-items: center; justify-content: space-between; padding: 12px 24px; gap: 16px; flex-wrap: wrap; }
.course-info { display: flex; align-items: center; gap: 14px; }
.course-badge {
  background: linear-gradient(135deg, var(--primary), var(--green-deep)); color: #fff;
  padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap;
}
.course-info h1 { font-size: 18px; font-weight: 800; }
.course-info .meta { font-size: 12.5px; color: var(--text-sub); }
.lesson-progress { display: flex; gap: 6px; align-items: center; }
.progress-dot {
  width: 10px; height: 10px; border-radius: 50%; background: var(--border); cursor: pointer;
  transition: all .3s;
}
.progress-dot.active { background: var(--primary); transform: scale(1.3); }
.progress-dot.done { background: var(--green-deep); transform: scale(1.3); }
.progress-label { font-size: 13px; color: var(--text-sub); margin-left: 8px; }
@media (max-width: 760px) { .lesson-progress { display: none; } }

/* 学习目标卡 */
.goals-card {
  background: linear-gradient(135deg, var(--primary), var(--green-deep)); color: #fff;
  border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg); position: relative; overflow: hidden;
}
.goals-card::after {
  content: ''; position: absolute; right: -40px; top: -40px; width: 180px; height: 180px;
  border-radius: 50%; background: rgba(255,255,255,.10);
}
.goals-card h2 { color: #fff; margin-bottom: 20px; position: relative; }
.goal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; position: relative; }
.goal-item {
  background: rgba(255,255,255,.16); border-radius: var(--radius-md); padding: 18px;
  backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.14);
}
.goal-item .icon {
  width: 44px; height: 44px; border-radius: 12px; background: rgba(255,255,255,.25);
  display: grid; place-items: center; margin-bottom: 12px; font-size: 22px;
}
.goal-item h4 { color: #fff; font-size: 16px; margin-bottom: 6px; }
.goal-item p { font-size: 13.5px; opacity: .94; }
@media (max-width: 760px) { .goal-grid { grid-template-columns: 1fr; } }

/* 教学环节 */
.step-block { display: flex; gap: 24px; margin-bottom: 28px; }
.step-num {
  flex-shrink: 0; width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--green-deep)); color: #fff;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 22px;
  box-shadow: 0 8px 20px rgba(47,158,68,.35); position: relative;
}
.step-num::after {
  content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: calc(100% + 28px);
  background: linear-gradient(var(--primary), transparent); transform: translateX(-50%);
}
.step-block:last-child .step-num::after { display: none; }
.step-content { flex: 1; background: #fff; border-radius: var(--radius-md); padding: 24px 28px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.step-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
.step-head h3 { font-size: 21px; }
.step-time {
  font-size: 13px; color: var(--primary-dark); background: var(--primary-soft);
  padding: 5px 12px; border-radius: 999px; font-weight: 700; white-space: nowrap;
}
.step-desc { color: var(--text-sub); margin-bottom: 16px; }

/* 概念卡片网格 */
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 16px 0; }
.info-item { border-radius: var(--radius-sm); padding: 16px; text-align: center; }
.info-item .icon { font-size: 30px; margin-bottom: 8px; }
.info-item h4 { font-size: 15px; margin-bottom: 4px; }
.info-item p { font-size: 12.5px; color: var(--text-sub); }
@media (max-width: 760px) { .info-grid { grid-template-columns: 1fr; } }

/* Python 代码块 */
.code-block {
  background: var(--code-bg); border-radius: var(--radius-sm);
  margin: 16px 0; overflow: hidden; border: 1px solid rgba(255,255,255,.06);
  box-shadow: 0 6px 20px rgba(15,27,23,.18);
}
.code-header {
  background: rgba(255,255,255,.04); padding: 10px 16px; display: flex;
  justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,.06); gap: 12px;
}
.code-lang { color: var(--primary); font-family: var(--font-mono); font-size: 12px; font-weight: 700; }
.code-title { color: #94A3B8; font-size: 12.5px; font-family: var(--font-mono); }
.code-copy {
  background: rgba(81,207,102,.18); color: var(--primary); border: none; padding: 5px 12px;
  border-radius: 6px; font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 600;
  transition: background .2s; margin-left: auto;
}
.code-copy:hover { background: rgba(81,207,102,.32); }
.code-content {
  margin: 0; padding: 16px 20px; color: var(--code-fg); font-family: var(--font-mono);
  font-size: 13.2px; line-height: 1.62; overflow-x: auto; white-space: pre; tab-size: 4;
}
.code-content code { font-family: inherit; }
.c-keyword { color: #FF7B72; font-weight: 600; }
.c-string  { color: #A5D6FF; }
.c-comment { color: #8B949E; font-style: italic; }
.c-number  { color: #79C0FF; }
.c-builtin { color: #D2A8FF; }
.c-func    { color: #B393F1; }
.c-decorator { color: #FFA657; }
.c-self    { color: #FFA657; }

/* 互动演示区 */
.demo-box {
  background: var(--bg); border: 2px dashed var(--border); border-radius: var(--radius-md);
  padding: 20px; margin: 16px 0; text-align: center;
}
.demo-stage {
  width: 100%; max-width: 520px; height: 240px; margin: 0 auto;
  background: #fff; border-radius: var(--radius-sm); position: relative; overflow: hidden;
  border: 2px solid #fff; box-shadow: 0 6px 20px rgba(47,158,68,.16);
}
.demo-stage.dark { background: #0F1B17; }
.demo-stage canvas { display: block; margin: 0 auto; border-radius: 6px; }
.demo-label {
  position: absolute; top: 8px; left: 10px; font-size: 12px; color: #4B6B58; font-weight: 700;
  background: rgba(255,255,255,.8); padding: 3px 8px; border-radius: 6px;
}
.demo-stage.dark .demo-label { color: #94D82D; background: rgba(15,27,23,.7); }
.demo-bubble {
  position: absolute; top: 10px; left: 50%; transform: translateX(-50%) scale(.8);
  background: #fff; padding: 6px 14px; border-radius: 14px; font-size: 13px; font-weight: 600;
  opacity: 0; transition: all .3s; box-shadow: var(--shadow-sm); z-index: 5; white-space: nowrap;
}
.demo-bubble.show { opacity: 1; transform: translateX(-50%) scale(1); }
.demo-controls { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.demo-btn {
  padding: 9px 16px; border: none; border-radius: 999px; font-weight: 700; cursor: pointer;
  font-family: inherit; font-size: 13px; transition: transform .15s, box-shadow .15s; color: #fff;
}
.demo-btn:hover { transform: translateY(-2px); }
.demo-btn:active { transform: translateY(0); }
.demo-btn.run { background: var(--primary); box-shadow: 0 4px 12px rgba(81,207,102,.3); }
.demo-btn.alt  { background: var(--teal); box-shadow: 0 4px 12px rgba(18,184,134,.3); }
.demo-btn.info { background: var(--blue); box-shadow: 0 4px 12px rgba(77,171,247,.3); }
.demo-btn.warn { background: var(--orange); box-shadow: 0 4px 12px rgba(255,146,43,.3); }
.demo-btn.purple { background: var(--purple); box-shadow: 0 4px 12px rgba(151,117,250,.3); }
.demo-btn.reset { background: #6C757D; }

/* 任务清单 */
.task-list { display: flex; flex-direction: column; gap: 10px; margin: 16px 0; }
.task-item {
  display: flex; align-items: flex-start; gap: 14px; padding: 14px 18px;
  background: var(--bg); border-radius: var(--radius-sm); cursor: pointer; transition: all .25s;
  border: 2px solid transparent; position: relative;
}
.task-item > * { position: relative; z-index: 1; }
.task-item::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(135deg, rgba(254,240,138,.5), rgba(253,224,71,.42));
  opacity: 0; transition: opacity .45s ease;
}
.task-item:hover { border-color: var(--primary-soft); }
.task-item.done { border-color: rgba(234,179,8,.5); box-shadow: 0 4px 14px rgba(234,179,8,.18); }
.task-item.done::before { opacity: 1; }
.task-check {
  width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border);
  flex-shrink: 0; display: grid; place-items: center; transition: all .25s; margin-top: 1px; color: #fff;
}
.task-item.done .task-check { background: var(--primary); border-color: var(--primary); }
.task-check svg { opacity: 0; transition: opacity .2s; }
.task-item.done .task-check svg { opacity: 1; }
.task-text { font-size: 14.5px; }
.task-item.done .task-text { text-decoration: line-through; color: var(--text-sub); }
.task-hint { font-size: 12.5px; color: var(--text-sub); margin-top: 4px; }

/* 小贴士 */
.tip {
  background: #FFF9DB; border-left: 4px solid var(--yellow); border-radius: var(--radius-sm);
  padding: 14px 18px; margin: 16px 0; display: flex; gap: 12px; align-items: flex-start;
}
.tip.tip-green { background: #EBFBEE; border-left-color: var(--primary); }
.tip.tip-blue  { background: #E7F5FF; border-left-color: var(--blue); }
.tip.tip-purple{ background: #F3F0FF; border-left-color: var(--purple); }
.tip .tip-icon { flex-shrink: 0; }
.tip strong { color: var(--green-deep); }
.tip.tip-green strong { color: var(--green-deep); }
.tip.tip-blue strong { color: #1971C2; }
.tip.tip-purple strong { color: #5F3DC4; }

/* 小结 */
.summary-card {
  background: linear-gradient(135deg, #EBFBEE, #D3F9D8); border-radius: var(--radius-lg);
  padding: 28px; border: 2px solid var(--primary);
}
.summary-card h3 { color: var(--green-deep); margin-bottom: 14px; }
.knowledge-points { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.kp-chip {
  background: #fff; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600;
  color: var(--green-deep); box-shadow: var(--shadow-sm);
}

/* 课后作业 */
.homework { background: #fff; border-radius: var(--radius-lg); padding: 28px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.hw-item { padding: 16px 0; border-bottom: 1px dashed var(--border); display: flex; gap: 16px; align-items: flex-start; }
.hw-item:last-child { border-bottom: none; }
.hw-star { color: var(--yellow); font-size: 18px; flex-shrink: 0; letter-spacing: 1px; }
.hw-item h4 { font-size: 16px; margin-bottom: 4px; }
.hw-item p { color: var(--text-sub); font-size: 13.5px; }
.hw-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; margin-left: 8px; vertical-align: middle; }
.hw-tag.basic { background: var(--primary-soft); color: var(--green-deep); }
.hw-tag.adv { background: #FFE8CC; color: #E8590C; }
.hw-tag.pro { background: #F3F0FF; color: #5F3DC4; }

/* 页脚导航 */
.lesson-nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 40px; flex-wrap: wrap; }
.lesson-nav a {
  flex: 1; min-width: 220px; padding: 18px 24px; background: #fff; border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: all .25s; display: flex;
  align-items: center; gap: 14px;
}
.lesson-nav a:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
.lesson-nav .arrow { font-size: 24px; color: var(--primary); }
.lesson-nav .label { font-size: 12.5px; color: var(--text-sub); }
.lesson-nav .title { font-weight: 700; font-size: 15px; }
.lesson-nav .next { text-align: right; flex-direction: row-reverse; }
.back-home {
  display: inline-block; margin: 8px 0 18px; color: var(--green-deep); font-weight: 700; font-size: 14px;
}
.back-home:hover { text-decoration: underline; }

/* 响应式 */
@media (max-width: 760px) {
  .section { padding: 40px 0; }
  .topbar-inner { padding: 10px 14px; gap: 10px; }
  .course-info h1 { font-size: 15px; }
  .course-info .meta { display: none; }
  .step-block { flex-direction: column; gap: 14px; }
  .step-num::after { display: none; }
  .step-num { width: 44px; height: 44px; font-size: 16px; }
  .step-content { padding: 18px 14px; }
  .step-head h3 { font-size: 19px; }
  .step-desc { font-size: 14px; }
  .demo-stage { height: 200px; }
  .demo-box { overflow-x: auto; }
  .code-block pre { padding: 14px; font-size: 12.5px; }
  .task-item { padding: 14px; gap: 10px; }
}

/* 左侧课程目录 */
.toc-sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 240px; z-index: 101;
  background: #fff; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; transition: transform .3s ease;
}
.toc-head { padding: 16px 16px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.toc-home {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 12px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px;
  background: var(--primary); color: #fff; transition: transform .2s, box-shadow .2s;
}
.toc-home:hover { transform: translateY(-2px); box-shadow: 0 8px 18px var(--primary-soft); color: #fff; }
.toc-title { font-size: 12px; font-weight: 800; color: var(--text-sub); letter-spacing: 2px; margin-top: 12px; }
.toc-list { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
.toc-unit { font-size: 12px; font-weight: 700; color: var(--text-sub); padding: 12px 8px 4px; }
.toc-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px;
  font-size: 13.5px; cursor: pointer; transition: background .2s; line-height: 1.45;
}
.toc-item:hover { background: var(--primary-soft); }
.toc-item.active { background: var(--primary-soft); color: var(--primary-dark); font-weight: 700; }
.toc-no { flex-shrink: 0; font-size: 11px; font-weight: 700; color: #fff; background: var(--primary); border-radius: 6px; padding: 2px 6px; }
.toc-item.active .toc-no { background: var(--primary-dark); }
.toc-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 100; opacity: 0; pointer-events: none; transition: opacity .3s; }
.toc-mask.open { opacity: 1; pointer-events: auto; }
.toc-fab {
  display: none; position: fixed; right: 18px; bottom: 18px; z-index: 94;
  border: none; cursor: pointer; padding: 12px 18px; border-radius: 999px;
  background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; font-family: var(--font-body);
  box-shadow: 0 8px 20px rgba(0,0,0,.18);
}
@media (max-width: 1100px) {
  .toc-sidebar { transform: translateX(-100%); }
  .toc-sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,.2); }
  .toc-fab { display: block; }
}
/* 目录收起/展开按钮 */
.toc-collapse {
  position: absolute; right: -13px; top: 14px; width: 26px; height: 26px;
  border-radius: 50%; border: 1px solid var(--border); background: #fff;
  color: var(--text-sub); cursor: pointer; font-size: 11px; font-family: inherit;
  display: grid; place-items: center; box-shadow: 0 2px 8px rgba(30,42,68,.16);
  transition: transform .3s ease; padding: 0; z-index: 5;
}
.toc-collapse:hover { color: var(--primary); border-color: var(--primary-soft); }
@media (min-width: 1101px) {
  #app { margin-left: 240px; transition: margin-left .3s ease; }
  body.toc-collapsed #app { margin-left: 0; }
  body.toc-collapsed .toc-sidebar { transform: translateX(-100%); }
  body.toc-collapsed .toc-collapse { transform: rotate(180deg); }
}
@media (max-width: 1100px) {
  .toc-collapse { display: none; }
}
</style>

<div id="app"></div>
<aside id="tocSidebar" class="toc-sidebar" aria-label="课程目录"></aside>
<div id="tocMask" class="toc-mask"></div>
<button id="tocFab" class="toc-fab">☰ 课程目录</button>
<script>
/* ================================================================
   Python 语法高亮（基于正则的单遍扫描，避免重复匹配）
   ================================================================ */
function highlightPython(code) {
  code = code.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  var re = /("""[\s\S]*?"""|'''[\s\S]*?''')|(#[^\n]*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+\.?\d*\b)|(@[A-Za-z_]\w*)|(\b(?:def|class|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|try|except|finally|with|as|lambda|yield|global|nonlocal|pass|break|continue|raise|assert|del|import|from)\b)|(\b(?:len|range|enumerate|zip|map|filter|sum|min|max|abs|sorted|reversed|list|dict|set|tuple|int|str|float|bool|complex|type|isinstance|input|open|format|round|print|any|all|next|iter|super|staticmethod|classmethod|property|ord|chr|hex|bin|oct|pow|divmod|id|hash|vars|dir|locals|globals|eval|exec)\b)|(\bself\b)/g;
  return code.replace(re, function(m, tStr, comment, str, num, deco, kw, bi, slf) {
    if (tStr)    return '<span class="c-string">' + tStr + '</span>';
    if (comment) return '<span class="c-comment">' + comment + '</span>';
    if (str)     return '<span class="c-string">' + str + '</span>';
    if (num)     return '<span class="c-number">' + num + '</span>';
    if (deco)    return '<span class="c-decorator">' + deco + '</span>';
    if (kw)      return '<span class="c-keyword">' + kw + '</span>';
    if (bi)      return '<span class="c-builtin">' + bi + '</span>';
    if (slf)     return '<span class="c-self">' + slf + '</span>';
    return m;
  });
}

/* ================================================================
   40 讲课程数据（P3 · Python AI 与竞赛）
   ================================================================ */
var LESSONS = {

    { icon: '🌍', title: 'AI 在身边', desc: '识别推荐系统、语音助手、自动驾驶中的 AI 技术。' }

    db = -2 * np.mean(y - y_pre)

    b -= lr * db

from collections import Counter

def knn_predict(X_train, y_train, x, k=3):
    dists = [np.sqrt(np.sum((x - xi) ** 2)) for xi in X_train]
    idx = np.argsort(dists)[:k]
    votes = [y_train[i] for i in idx]
    return Counter(votes).most_common(1)[0][0]

X = np.array([[150,0],[160,0],[170,1],[120,0],[180,1]])
y = np.array(['苹果','苹果','橘子','苹果','橘子'])

class Perceptron:
    def __init__(self, n_features, lr=0.1):
        self.w = np.zeros(n_features)
        self.b = 0.0
        self.lr = lr

    def fit(self, X, y, epochs=100):
        for _ in range(epochs):
            for xi, yi in zip(X, y):
                y_pre = 1 if np.dot(self.w, xi) + self.b > 0 else -1
                if y_pre != yi:  # 预测错就调
                    self.w += self.lr * yi * xi
                    self.b += self.lr * yi

    def predict(self, x):
        return 1 if np.dot(self.w, x) + self.b > 0 else -1

def grade_answer(standard, student, keywords):
    # 1. 关键词命中 (60%)
    hit = sum(1 for kw in keywords if kw in student)
    kw_score = hit / len(keywords) * 60

    # 2. 文本相似度 (40%)
    sim = difflib.SequenceMatcher(None, standard, student).ratio()
    sim_score = sim * 40

    # 3. 综合
    total = kw_score + sim_score
    missed = [kw for kw in keywords if kw not in student]
    return round(total), missed

score, missed = grade_answer(
    '光合作用是植物利用光合成有机物',
    '植物用光合成养分',
    ['光合作用', '植物', '光', '有机物']
)
print(f'得分:{score} 缺失词:{missed}')  # 得分:60 缺失词:['光合作用','有机物']` }], tips: [{ icon: '🧠', strong: '设计思路', text: '先拆模块再写代码，这是工程思维的第一步。' }] },

        if missed:

def relu(x): return np.maximum(0, x)
def softmax(x):
    e = np.exp(x - x.max())
    return e / e.sum()

# 两层 MLP：784→128→10
W1 = np.random.randn(784, 128) * 0.01
b1 = np.zeros(128)
W2 = np.random.randn(128, 10) * 0.01
b2 = np.zeros(10)

def forward(x):
    z1 = x @ W1 + b1      # 第一层加权
    a1 = relu(z1)          # 激活
    z2 = a1 @ W2 + b2      # 第二层加权
    return softmax(z2)     # 输出概率

print(forward(np.random.randn(1, 784)))  # → 10 类概率` }], tips: [{ icon: '🧠', strong: '深度', text: '隐藏层越多 = 越深 = 能拟合越复杂的函数，但也越难训练。' }] },

def conv2d(img, kernel):
    h, w = img.shape
    kh, kw = kernel.shape
    out = np.zeros((h - kh + 1, w - kw + 1))
    for i in range(out.shape[0]):
        for j in range(out.shape[1]):
            out[i, j] = np.sum(img[i:i+kh, j:j+kw] * kernel)
    return out

# 边缘检测核

img = np.random.rand(8, 8)  # 模拟图像
edge = conv2d(img, sobel)   # → 提取竖直边缘
print(edge.shape)  # (6, 6)` }], tips: [{ icon: '🧠', strong: '优势', text: '卷积核全图共享，比全连接参数少得多，还能保留空间结构。' }] },

def three_sum(nums):
    nums.sort()
    res = []
    n = len(nums)
    for i in range(n - 2):
        if i > 0 and nums[i] == nums[i-1]: continue   # 去重
        l, r = i + 1, n - 1
        while l < r:
            s = nums[i] + nums[l] + nums[r]
            if s == 0:
                res.append([nums[i], nums[l], nums[r]])
                while l < r and nums[l] == nums[l+1]: l += 1
                while l < r and nums[r] == nums[r-1]: r -= 1
                l += 1; r -= 1
            elif s < 0: l += 1
            else: r -= 1
    return res

print(three_sum([-1,0,1,2,-1,-4]))   # [[-1,-1,2],[-1,0,1]]

# board[i][j]: -1 雷, 0-8 周围雷数, -2 已点开
def click(board, r, c):
    if board[r][c] == -1:
        return 'BOOM'   # 踩雷
    # BFS 展开 0 区域
    q = deque([(r, c)])
    while q:

        if board[r][c] != 0: continue
        board[r][c] = -2    # 标记展开
        for dr in (-1, 0, 1):
            for dc in (-1, 0, 1):

                nr, nc = r + dr, c + dc
                if 0 <= nr < len(board) and 0 <= nc < len(board[0]):

def knap_2d(W, wt, val):
    n = len(wt)
    dp = [[0] * (W + 1) for _ in range(n + 1)]
    for i in range(1, n + 1):
        for j in range(W + 1):
            dp[i][j] = dp[i-1][j]   # 不选 i
            if j >= wt[i-1]:
                dp[i][j] = max(dp[i][j], dp[i-1][j-wt[i-1]] + val[i-1])

def knap_1d(W, wt, val):

    for i in range(len(wt)):
        for j in range(W, wt[i] - 1, -1):   # 倒序！

    n, m = len(text), len(pattern)
    if m == 0: return 0
    nxt = build_next(pattern)
    i = j = 0

            if j == m:

    k = 0
    for i in range(1, m):
        while k > 0 and p[i] != p[k]:
            k = nxt[k - 1]
        if p[i] == p[k]:
            k += 1
        nxt[i] = k
    return nxt

def is_prime(n):
    if n < 2: return False
    i = 2
    while i * i <= n:
        if n % i == 0: return False
        i += 1
    return True

# 埃氏筛：返回 [0..n] 的质数表
def sieve(n):
    is_p = [True] * (n + 1)
    is_p[0] = is_p[1] = False
    i = 2
    while i * i <= n:
        if is_p[i]:
            for j in range(i*i, n+1, i):
                is_p[j] = False
        i += 1
    return [i for i in range(2, n+1) if is_p[i]]

        a, b = b, a % b
    return a

def lcm(a, b):

# 要求 gcd(a, p) == 1
def mod_inv(a, p):
    g, x, _ = ext_gcd(a, p)
    if g != 1:
        return None   # 不存在逆元
    return x % p

print(mod_inv(3, 11))   # 4，因为 3*4=12 ≡ 1 (mod 11)

# 应用：组合数 C(n,k) mod p
def comb_mod(n, k, p=10**9+7):
    if k > n: return 0
    # 预处理阶乘和逆元
    fact = [1] * (n + 1)
    for i in range(1, n + 1):
        fact[i] = fact[i-1] * i % p
    inv_fact = [1] * (n + 1)
    inv_fact[n] = fast_pow(fact[n], p - 2, p)   # 费马小定理
    for i in range(n, 0, -1):
        inv_fact[i-1] = inv_fact[i] * i % p
    return fact[n] * inv_fact[k] % p * inv_fact[n-k] % p

    def __init__(self, n):

    def __init__(self, a):
        self.n = len(a)
        self.tree = [0] * (4 * self.n)
        self._build(a, 1, 0, self.n - 1)

    def _build(self, a, node, l, r):
        if l == r:
            self.tree[node] = a[l]
            return
        mid = (l + r) // 2
        self._build(a, node*2, l, mid)
        self._build(a, node*2+1, mid+1, r)
        self.tree[node] = self.tree[node*2] + self.tree[node*2+1]

    def update(self, idx, val, node=1, l=None, r=None):
        if l is None: l, r = 0, self.n - 1
        if l == r:
            self.tree[node] = val
            return
        mid = (l + r) // 2
        if idx <= mid:
            self.update(idx, val, node*2, l, mid)
        else:
            self.update(idx, val, node*2+1, mid+1, r)
        self.tree[node] = self.tree[node*2] + self.tree[node*2+1]

    def query(self, ql, qr, node=1, l=None, r=None):
        if l is None: l, r = 0, self.n - 1
        if qr < l or r < ql: return 0
        if ql <= l and r <= qr: return self.tree[node]
        mid = (l + r) // 2
        return self.query(ql, qr, node*2, l, mid) + \\
               self.query(ql, qr, node*2+1, mid+1, r)

    def __init__(self, n):
        self.p = list(range(n)); self.r = [0]*n
    def find(self, x):
        if self.p[x] != x: self.p[x] = self.find(self.p[x])
        return self.p[x]
    def union(self, a, b):
        ra, rb = self.find(a), self.find(b)
        if ra == rb: return False
        if self.r[ra] < self.r[rb]: ra, rb = rb, ra
        self.p[rb] = ra
        if self.r[ra] == self.r[rb]: self.r[ra] += 1
        return True

def kruskal(n, edges):
    # edges: [(w, u, v), ...]
    edges.sort()                       # 按权重排序
    uf = UnionFind(n)
    mst = []
    total = 0
    for w, u, v in edges:
        if uf.union(u, v):
            mst.append((u, v, w))
            total += w
            if len(mst) == n - 1:      # MST 有 n-1 条边
                break
    return mst, total

# 例：4 个村子，5 条候选路

def prim(n, graph):
    # graph: 邻接表 {u: [(v, w), ...]}
    visited = [False] * n
    mst = []
    total = 0
    # 从点 0 开始
    visited[0] = True
    h = [(w, 0, v) for v, w in graph[0]]
    heapq.heapify(h)
    while h and len(mst) < n - 1:
        w, u, v = heapq.heappop(h)
        if visited[v]: continue
        visited[v] = True
        mst.append((u, v, w))
        total += w
        for nv, nw in graph[v]:
            if not visited[nv]:
                heapq.heappush(h, (nw, v, nv))
    return mst, total

    n = len(stones)
    # 前缀和：sum[l..r] = pref[r+1] - pref[l]
    pref = [0] * (n + 1)
    for i in range(n):
        pref[i+1] = pref[i] + stones[i]

    # dp[l][r] = 合并 [l,r] 的最小代价
    dp = [[0]*n for _ in range(n)]
    for length in range(2, n+1):     # 区间长度从 2 开始
        for l in range(n - length + 1):
            r = l + length - 1
            dp[l][r] = float('inf')
            total = pref[r+1] - pref[l]   # 本区间总和
            for k in range(l, r):
                # 在 k 处分两半：[l,k] + [k+1,r]
                cost = dp[l][k] + dp[k+1][r] + total
                if cost < dp[l][r]:
                    dp[l][r] = cost
    return dp[0][n-1]

# 邻接表表示图
graph = {
    'A': ['B', 'C'],
    'B': ['A', 'D', 'E'],
    'C': ['A', 'F'],
    'D': ['B'],
    'E': ['B', 'F'],

# BFS：从 start 出发，按层扩散
def bfs(graph, start):
    visited = {start}
    q = deque([start])
    order = []
    while q:
        v = q.popleft()
        order.append(v)
        for nb in graph[v]:
            if nb not in visited:
                visited.add(nb)
                q.append(nb)
    return order
print(bfs(graph, 'A'))   # ['A','B','C','D','E','F']

# DFS：递归版
def dfs(graph, start, visited=None):
    if visited is None: visited = set()
    visited.add(start)
    order = [start]
    for nb in graph[start]:
        if nb not in visited:
            order += dfs(graph, nb, visited)
    return order
print(dfs(graph, 'A'))   # ['A','B','D','E','F','C']

# BFS 求无权图最短路径
def shortest_path(graph, s, t):
    visited = {s}
    q = deque([(s, [s])])

        if v == t: return path
        for nb in graph[v]:
            if nb not in visited:
                visited.add(nb)
                q.append((nb, path + [nb]))
    return None

    if not grid: return 0
    rows, cols = len(grid), len(grid[0])
    count = 0

        if grid[r][c] != '1': return
        grid[r][c] = '2'   # 标记访问

        dfs(r, c-1); dfs(r, c+1)

class HashTable:
    def __init__(self, cap=8):
        self.cap = cap
        self.table = [[] for _ in range(cap)]
        self.size = 0

    def _hash(self, key):
        return hash(key) % self.cap

    def put(self, key, val):
        h = self._hash(key)
        for i, (k, _) in enumerate(self.table[h]):
            if k == key:
                self.table[h][i] = (key, val)
                return
        self.table[h].append((key, val))
        self.size += 1

    def get(self, key):
        h = self._hash(key)
        for k, v in self.table[h]:
            if k == key: return v
        return None

    def __init__(self, n):
        self.parent = list(range(n))
        self.rank = [0] * n
        self.count = n    # 当前集合数

    def find(self, x):
        # 路径压缩：递归版，把链压平
        if self.parent[x] != x:
            self.parent[x] = self.find(self.parent[x])
        return self.parent[x]

    def union(self, x, y):
        rx, ry = self.find(x), self.find(y)
        if rx == ry: return False    # 已同集合
        # 按秩合并：矮的挂高的
        if self.rank[rx] < self.rank[ry]:
            self.parent[rx] = ry
        elif self.rank[rx] > self.rank[ry]:
            self.parent[ry] = rx
        else:
            self.parent[ry] = rx
            self.rank[rx] += 1
        self.count -= 1
        return True

    def connected(self, x, y):
        return self.find(x) == self.find(y)

# 例：5 人，朋友关系 (0,1),(1,2),(3,4)
uf = UnionFind(5)
uf.union(0, 1)
uf.union(1, 2)
uf.union(3, 4)
print(uf.connected(0, 2))   # True
print(uf.connected(0, 3))   # False
print(uf.count)             # 2（两个集合）` }],

    # graph: {u: [(v, w), ...]}

def shortest_path_bfs(graph, s, t):

    while q:

        for nb in graph[v]:

    # 回溯路径

    path = []
    cur = t

def merge_sort(a):
    if len(a) <= 1: return a
    mid = len(a) // 2
    L = merge_sort(a[:mid])
    R = merge_sort(a[mid:])
    return merge(L, R)

def merge(L, R):
    res, i, j = [], 0, 0
    while i < len(L) and j < len(R):
        if L[i] <= R[j]:
            res.append(L[i]); i += 1
        else:
            res.append(R[j]); j += 1
    res += L[i:] + R[j:]
    return res

# 快排：原地分区（Lomuto 版）
def quick_sort(a, lo, hi):
    if lo < hi:
        p = partition(a, lo, hi)
        quick_sort(a, lo, p - 1)
        quick_sort(a, p + 1, hi)

def partition(a, lo, hi):
    pivot = a[hi]      # 取末位作 pivot
    i = lo
    for j in range(lo, hi):
        if a[j] < pivot:
            a[i], a[j] = a[j], a[i]
            i += 1
    a[i], a[hi] = a[hi], a[i]
    return i` }],

    for i, x in enumerate(a):

        if a[mid] == target:

        elif a[mid] < target:

def huffman(freq):
    # freq: {char: 频率}
    heap = [[f, [ch, '']] for ch, f in freq.items()]
    heapq.heapify(heap)
    while len(heap) > 1:
        lo = heapq.heappop(heap)
        hi = heapq.heappop(heap)
        for node in lo[1:]:
            node[1] = '0' + node[1]
        for node in hi[1:]:
            node[1] = '1' + node[1]
        heapq.heappush(heap, [lo[0] + hi[0]] + lo[1:] + hi[1:])
    return sorted(heap[0][1:], key=lambda x: (len(x[1]), x[0]))

      codeBlocks: [{ lang: 'Python', title: '全排列与 N 皇后回溯', code: `# 全排列 — 回溯模板
def permute(nums):
    res = []
    def backtrack(path, used):
        if len(path) == len(nums):
            res.append(path[:])    # 注意拷贝
            return
        for i in range(len(nums)):
            if used[i]: continue
            used[i] = True          # 做选择
            path.append(nums[i])
            backtrack(path, used)
            path.pop()               # 撤销选择
            used[i] = False
    backtrack([], [False]*len(nums))
    return res

print(permute([1,2,3]))   # 6 种排列

# N 皇后：每行放一个皇后，不能同行/同列/同对角
def solve_n_queens(n):
    res = []
    def backtrack(row, cols, diag1, diag2, board):
        if row == n:
            res.append([''.join(r) for r in board])
            return
        for c in range(n):
            d1, d2 = row - c, row + c
            if c in cols or d1 in diag1 or d2 in diag2:
                continue
            board[row][c] = 'Q'
            cols.add(c); diag1.add(d1); diag2.add(d2)
            backtrack(row + 1, cols, diag1, diag2, board)
            board[row][c] = '.'
            cols.discard(c); diag1.discard(d1); diag2.discard(d2)
    backtrack(0, set(), set(), set(), [['.']*n for _ in range(n)])
    return res

print(len(solve_n_queens(8)))   # 8 皇后共 92 解` }],

# 子集回溯
def subsets(nums):
    res = []
    def bt(start, path):
        res.append(path[:])
        for i in range(start, len(nums)):
            path.append(nums[i])
            bt(i+1, path)
            path.pop()
    bt(0, [])
    return res

def bubble_sort_record(a):

            if a[j] > a[j+1]:

                # 记录「交换」事件

    snapshots.append(('done', a[:]))

  _draw: function(s) {
    var ctx = s.ctx, n = s.n, W = 440, H = 240, pad = 35;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
    for (var i = 0; i <= 5; i++) { ctx.beginPath(); ctx.moveTo(pad, pad + i * 35); ctx.lineTo(W - 10, pad + i * 35); ctx.stroke(); }
    ctx.fillStyle = '#5B6B8C'; ctx.font = '11px sans-serif';
    var maxV = n * n;
    var scaleY = 170 / Math.max(maxV, 1);
    var curves = [
      { fn: function(x) { return 1; }, color: '#51CF66', label: 'O(1)' },
      { fn: function(x) { return Math.log(x + 1) / Math.log(2); }, color: '#4F6BFF', label: 'O(log n)' },
      { fn: function(x) { return x; }, color: '#FFC93C', label: 'O(n)' },
      { fn: function(x) { return x * x; }, color: '#FF6B81', label: 'O(n²)' }
    ];
    for (var c = 0; c < curves.length; c++) {
      var cv = curves[c];
      ctx.strokeStyle = cv.color; ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (var x = 0; x <= n; x++) {
        var px = pad + (x / n) * (W - pad - 20);
        var py = H - pad - Math.min(cv.fn(x) * scaleY, 170);
        if (x === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);

      ctx.fillStyle = cv.color; ctx.font = 'bold 12px sans-serif';
      ctx.fillText(cv.label, W - 60, 30 + c * 16);

    ctx.fillStyle = '#5B6B8C'; ctx.font = '11px sans-serif';

      var bh = (arr[i] / 100) * 160;
      var y = H - 30 - bh;
      if (!s.done && i === s.j) ctx.fillStyle = '#FF6B81';
      else if (!s.done && i === s.j + 1) ctx.fillStyle = '#FFC93C';
      else if (s.done) ctx.fillStyle = '#51CF66';
      else ctx.fillStyle = '#4F6BFF';
      ctx.fillRect(x, y, bw, bh);

    if (s.done) ctx.fillText('✓ 排序完成！', 10, 20);

  actions: {
    step: function(s) {
      if (s.done) return;
      if (s.j < s.arr.length - 1 - s.i) {
        if (s.arr[s.j] > s.arr[s.j + 1]) {
          var t = s.arr[s.j]; s.arr[s.j] = s.arr[s.j + 1]; s.arr[s.j + 1] = t;
        }
        s.j++;
      } else {
        s.i++; s.j = 0;
        if (s.i >= s.arr.length - 1) s.done = true;
      }
      DEMOS['sort-vis']._draw(s);
    },
    auto: function(s) {
      if (s.timer) { clearInterval(s.timer); s.timer = null; return; }
      s.timer = setInterval(function() {
        if (s.done) { clearInterval(s.timer); s.timer = null; return; }
        DEMOS['sort-vis'].actions.step(s);
      }, 300);

'recursion-tree': {
  stage: function() {
    return '<div class="demo-stage" id="demoStage" style="background:#fff;">' +
      '<canvas id="demoCanvas" width="440" height="240"></canvas>' +
      '</div>';
  },
  controls: function() {
    return '<button class="demo-btn motion" onclick="demoAction(\'fib5\')">fib(5)</button>' +
      '<button class="demo-btn motion" onclick="demoAction(\'fib7\')">fib(7)</button>' +
      '<button class="demo-btn looks" onclick="demoAction(\'fact\')">阶乘</button>' +
      '<button class="demo-btn reset" onclick="demoAction(\'reset\')">🔄 重置</button>';
  },
  init: function(s) {
    s.canvas = document.getElementById('demoCanvas');
    s.ctx = s.canvas.getContext('2d');
    s.mode = 'fib5';
    DEMOS['recursion-tree']._draw(s);
  },
  _draw: function(s) {
    var ctx = s.ctx, W = 440, H = 240;
    ctx.clearRect(0, 0, W, H);
    var nodes = [];
    function buildFib(n, x, y, depth, maxDepth) {
      nodes.push({ x: x, y: y, val: n, depth: depth });
      if (n <= 1 || depth >= maxDepth) return;
      var spread = 80 / (depth + 1);
      buildFib(n - 1, x - spread * 2, y + 55, depth + 1, maxDepth);
      buildFib(n - 2, x + spread * 2, y + 55, depth + 1, maxDepth);
    }
    function buildFact(n, x, y, depth, maxDepth) {
      nodes.push({ x: x, y: y, val: n + '!', depth: depth });
      if (n <= 1 || depth >= maxDepth) return;
      buildFact(n - 1, x, y + 55, depth + 1, maxDepth);
    }
    var startN = s.mode === 'fib5' ? 5 : (s.mode === 'fib7' ? 7 : 5);
    var maxD = s.mode === 'fib7' ? 7 : 5;
    if (s.mode === 'fact') buildFact(5, W / 2, 20, 0, 5);
    else buildFib(startN, W / 2, 20, 0, maxD);
    ctx.strokeStyle = '#4F6BFF'; ctx.lineWidth = 1.5;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n.depth === 0) continue;
      var parent = null;
      for (var j = 0; j < nodes.length; j++) {
        if (nodes[j].depth === n.depth - 1 && Math.abs(nodes[j].y + 55 - n.y) < 5) { parent = nodes[j]; break; }
      }
      if (parent) { ctx.beginPath(); ctx.moveTo(parent.x, parent.y + 12); ctx.lineTo(n.x, n.y - 12); ctx.stroke(); }
    }
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var isLeaf = s.mode !== 'fact' && (typeof n.val === 'number' && n.val <= 1);
      ctx.fillStyle = isLeaf ? '#51CF66' : '#4F6BFF';
      ctx.beginPath(); ctx.arc(n.x, n.y, 14, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(n.val, n.x, n.y + 4); ctx.textAlign = 'left';
    }
    ctx.fillStyle = '#5B6B8C'; ctx.font = '12px sans-serif';
    ctx.fillText(s.mode === 'fact' ? '递归树：factorial(5)' : '递归树：fib(' + startN + ')', 10, H - 8);
  },
  actions: {
    fib5: function(s) { s.mode = 'fib5'; DEMOS['recursion-tree']._draw(s); },
    fib7: function(s) { s.mode = 'fib7'; DEMOS['recursion-tree']._draw(s); },
    fact: function(s) { s.mode = 'fact'; DEMOS['recursion-tree']._draw(s); },
    reset: function(s) { s.mode = 'fib5'; DEMOS['recursion-tree']._draw(s); }
  }
},

  },
  _getOrder: function(s) {
    var nodes = s.nodes;
    var map = {};
    for (var i = 0; i < nodes.length; i++) map[nodes[i].val] = nodes[i];
    if (s.order === 'pre') return [50, 30, 20, 40, 70, 60, 80];
    if (s.order === 'in') return [20, 30, 40, 50, 60, 70, 80];
    return [20, 40, 30, 60, 80, 70, 50];
  },
  _draw: function(s) {
    var ctx = s.ctx, W = 440, H = 240;

    var edges = [[0,1],[0,2],[1,3],[1,4],[2,5],[2,6]];
    ctx.strokeStyle = '#aaa'; ctx.lineWidth = 2;
    for (var i = 0; i < edges.length; i++) {
      var a = s.nodes[edges[i][0]], b = s.nodes[edges[i][1]];
      ctx.beginPath(); ctx.moveTo(a.x, a.y + 14); ctx.lineTo(b.x, b.y - 14); ctx.stroke();
    }
    var order = DEMOS['binary-tree']._getOrder(s);
    var map = {};
    for (var i = 0; i < s.nodes.length; i++) map[s.nodes[i].val] = s.nodes[i];
    for (var i = 0; i < s.nodes.length; i++) {
      var n = s.nodes[i];
      var visitIdx = s.visited.indexOf(n.val);
      if (visitIdx >= 0) ctx.fillStyle = '#51CF66';
      else ctx.fillStyle = '#4F6BFF';
      ctx.beginPath(); ctx.arc(n.x, n.y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(n.val, n.x, n.y + 4); ctx.textAlign = 'left';
    }
    ctx.fillStyle = '#5B6B8C'; ctx.font = '12px sans-serif';
    var label = s.order === 'pre' ? '前序' : (s.order === 'in' ? '中序' : '后序');
    ctx.fillText(label + '遍历：', 10, 220);
    ctx.fillStyle = '#51CF66'; ctx.font = 'bold 13px sans-serif';
    ctx.fillText(s.visited.join(' → '), 80, 220);

  actions: {
    pre: function(s) { s.order = 'pre'; s.visited = []; s.step = 0; DEMOS['binary-tree']._step(s); },

    post: function(s) { s.order = 'post'; s.visited = []; s.step = 0; DEMOS['binary-tree']._step(s); },
    reset: function(s) { s.visited = []; s.step = 0; DEMOS['binary-tree']._draw(s); }
  },
  _step: function(s) {
    var order = DEMOS['binary-tree']._getOrder(s);
    if (s.step < order.length) {
      s.visited.push(order[s.step]);
      s.step++;

      { val: 'D', x: 120, y: 140 }, { val: 'E', x: 240, y: 140 }, { val: 'F', x: 360, y: 140 },
      { val: 'G', x: 180, y: 210 }, { val: 'H', x: 300, y: 210 }
    ];
    s.edges = [[0,1],[1,2],[0,3],[1,4],[2,5],[3,4],[4,5],[3,6],[4,6],[5,7],[6,7]];
    s.visited = [];
    s.queue = [];
    s.stack = [];
    s.done = true;
    s.mode = '';
    DEMOS['graph-bfs-dfs']._draw(s);
  },
  _adj: function(s, idx) {
    var result = [];
    for (var i = 0; i < s.edges.length; i++) {
      if (s.edges[i][0] === idx) result.push(s.edges[i][1]);
      else if (s.edges[i][1] === idx) result.push(s.edges[i][0]);
    }
    return result.sort(function(a, b) { return a - b; });
  },
  _draw: function(s) {
    var ctx = s.ctx, W = 440, H = 240;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
    for (var i = 0; i < s.edges.length; i++) {
      var a = s.nodes[s.edges[i][0]], b = s.nodes[s.edges[i][1]];
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    for (var i = 0; i < s.nodes.length; i++) {
      var n = s.nodes[i];
      var inQ = s.queue.indexOf(i) >= 0;
      var inS = s.stack.indexOf(i) >= 0;
      var isVis = s.visited.indexOf(i) >= 0;
      if (isVis) ctx.fillStyle = s.mode === 'bfs' ? '#4F6BFF' : '#FF6B81';
      else if (inQ || inS) ctx.fillStyle = '#FFC93C';
      else ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(n.x, n.y, 16, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5B6B8C'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#5B6B8C'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(n.val, n.x, n.y + 4); ctx.textAlign = 'left';
    }
    ctx.fillStyle = '#5B6B8C'; ctx.font = '12px sans-serif';
    var label = s.visited.map(function(i) { return s.nodes[i].val; }).join(' → ');
    ctx.fillText(s.mode === 'bfs' ? 'BFS: ' : (s.mode === 'dfs' ? 'DFS: ' : '') + label, 10, 20);
  },
  _bfsStep: function(s) {
    if (s.queue.length === 0) { s.done = true; DEMOS['graph-bfs-dfs']._draw(s); return; }
    var cur = s.queue.shift();
    if (s.visited.indexOf(cur) >= 0) { DEMOS['graph-bfs-dfs']._bfsStep(s); return; }
    s.visited.push(cur);
    var adj = DEMOS['graph-bfs-dfs']._adj(s, cur);
    for (var i = 0; i < adj.length; i++) {
      if (s.visited.indexOf(adj[i]) < 0 && s.queue.indexOf(adj[i]) < 0) s.queue.push(adj[i]);
    }
    DEMOS['graph-bfs-dfs']._draw(s);
    setTimeout(function() { DEMOS['graph-bfs-dfs']._bfsStep(s); }, 400);
  },
  _dfsStep: function(s) {
    if (s.stack.length === 0) { s.done = true; DEMOS['graph-bfs-dfs']._draw(s); return; }
    var cur = s.stack.pop();
    if (s.visited.indexOf(cur) >= 0) { DEMOS['graph-bfs-dfs']._dfsStep(s); return; }
    s.visited.push(cur);
    var adj = DEMOS['graph-bfs-dfs']._adj(s, cur).reverse();
    for (var i = 0; i < adj.length; i++) {
      if (s.visited.indexOf(adj[i]) < 0) s.stack.push(adj[i]);
    }
    DEMOS['graph-bfs-dfs']._draw(s);
    setTimeout(function() { DEMOS['graph-bfs-dfs']._dfsStep(s); }, 400);
  },
  actions: {
    bfs: function(s) {
      s.visited = []; s.queue = [0]; s.stack = []; s.done = false; s.mode = 'bfs';
      DEMOS['graph-bfs-dfs']._bfsStep(s);
    },
    dfs: function(s) {
      s.visited = []; s.queue = []; s.stack = [0]; s.done = false; s.mode = 'dfs';
      DEMOS['graph-bfs-dfs']._dfsStep(s);
    },
    reset: function(s) {
      s.visited = []; s.queue = []; s.stack = []; s.done = true; s.mode = '';
      DEMOS['graph-bfs-dfs']._draw(s);
    }
  }
},
'dp-table': {
  stage: function() {
    return '<div class="demo-stage" id="demoStage" style="background:#fff;">' +
      '<canvas id="demoCanvas" width="440" height="240"></canvas>' +
      '</div>';
  },
  controls: function() {
    return '<button class="demo-btn motion" onclick="demoAction(\'step\')">▶ 填一格</button>' +
      '<button class="demo-btn looks" onclick="demoAction(\'auto\')">⏩ 自动填</button>' +
      '<button class="demo-btn reset" onclick="demoAction(\'reset\')">🔄 重置</button>';
  },
  init: function(s) {
    s.canvas = document.getElementById('demoCanvas');
    s.ctx = s.canvas.getContext('2d');
    s.timer = null;
    DEMOS['dp-table']._reset(s);
  },
  _reset: function(s) {
    if (s.timer) { clearInterval(s.timer); s.timer = null; }
    s.W = 5; s.n = 4;
    s.weights = [2, 1, 3, 2];
    s.values = [12, 10, 20, 15];
    s.dp = [];
    for (var i = 0; i <= s.n; i++) { s.dp.push(new Array(s.W + 1).fill(0)); }
    s.i = 1; s.j = 1; s.done = false;
    DEMOS['dp-table']._draw(s);
  },
  _draw: function(s) {
    var ctx = s.ctx, W = 440, H = 240;
    ctx.clearRect(0, 0, W, H);
    var cellW = 55, cellH = 35, startX = 80, startY = 40;
    ctx.fillStyle = '#5B6B8C'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText('背包容量 →', 10, 30);
    ctx.fillText('物品↓', 10, startY + cellH * 2);
    ctx.fillText('0', startX + cellW / 2 - 4, startY - 6);
    for (var j = 1; j <= s.W; j++) ctx.fillText(j, startX + j * cellW + cellW / 2 - 4, startY - 6);
    for (var i = 0; i <= s.n; i++) {
      ctx.fillText(i === 0 ? '0' : 'w' + s.weights[i - 1] + ',v' + s.values[i - 1], 10, startY + i * cellH + cellH / 2 + 4);
    }
    for (var i = 0; i <= s.n; i++) {
      for (var j = 0; j <= s.W; j++) {
        var x = startX + j * cellW, y = startY + i * cellH;
        var filled = !s.done && i < s.i;
        var current = !s.done && i === s.i && j <= s.j;
        if (s.done || filled || current) {
          ctx.fillStyle = current ? '#FFC93C' : '#51CF66';
          ctx.fillRect(x, y, cellW - 2, cellH - 2);
          ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(s.dp[i][j], x + cellW / 2, y + cellH / 2 + 4); ctx.textAlign = 'left';
        } else {
          ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
          ctx.strokeRect(x, y, cellW - 2, cellH - 2);
        }
      }
    }
    ctx.fillStyle = '#5B6B8C'; ctx.font = '12px sans-serif';
    if (s.done) ctx.fillText('✓ 最优解 = ' + s.dp[s.n][s.W], 10, H - 8);
    else ctx.fillText('填 dp[' + s.i + '][' + s.j + ']，比较放/不放', 10, H - 8);
  },
  actions: {
    step: function(s) {
      if (s.done) return;
      if (s.i > s.n) { s.done = true; DEMOS['dp-table']._draw(s); return; }
      var w = s.weights[s.i - 1], v = s.values[s.i - 1];
      s.dp[s.i][s.j] = s.dp[s.i - 1][s.j];
      if (s.j >= w) s.dp[s.i][s.j] = Math.max(s.dp[s.i][s.j], s.dp[s.i - 1][s.j - w] + v);
      s.j++;
      if (s.j > s.W) { s.i++; s.j = 1; }
      if (s.i > s.n) s.done = true;
      DEMOS['dp-table']._draw(s);
    },
    auto: function(s) {
      if (s.timer) { clearInterval(s.timer); s.timer = null; return; }
      s.timer = setInterval(function() {
        if (s.done) { clearInterval(s.timer); s.timer = null; return; }
        DEMOS['dp-table'].actions.step(s);
      }, 300);
    },
    reset: function(s) { DEMOS['dp-table']._reset(s); }
  },
  cleanup: function(s) { if (s.timer) { clearInterval(s.timer); s.timer = null; } }
},

    DEMOS['ai-regression']._draw(s);
  },
  _draw: function(s) {
    var ctx = s.ctx, W = 440, H = 240;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(30, 20); ctx.lineTo(30, H - 20); ctx.lineTo(W - 10, H - 20); ctx.stroke();
    for (var i = 0; i < s.points.length; i++) {
      var px = 30 + s.points[i][0] * 1.5;
      var py = H - 20 - s.points[i][1] * 1.0;
      ctx.fillStyle = '#4F6BFF';
      ctx.beginPath(); ctx.arc(px, py, 4, 0, Math.PI * 2); ctx.fill();
    }
    var x1 = 30, y1 = H - 20 - (s.k * 0 + s.b) * 1.0;
    var x2 = W - 10, y2 = H - 20 - (s.k * 280 + s.b) * 1.0;
    ctx.strokeStyle = '#FF6B81'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.fillStyle = '#5B6B8C'; ctx.font = '12px sans-serif';
    ctx.fillText('y = ' + s.k.toFixed(3) + 'x + ' + s.b.toFixed(2), 10, 15);
    ctx.fillText('epoch: ' + s.epoch + '  lr: ' + s.lr, 10, H - 5);

    train: function(s) {

        var dk = 0, db = 0;
        for (var i = 0; i < s.points.length; i++) {
          var x = s.points[i][0], y = s.points[i][1];
          var ypre = s.k * x + s.b;
          dk += -2 * (y - ypre) * x / s.points.length;
          db += -2 * (y - ypre) / s.points.length;
        }
        s.k -= s.lr * dk; s.b -= s.lr * db;
      }
      s.epoch += 100;
      DEMOS['ai-regression']._draw(s);
    },
    lr01: function(s) { s.lr = 0.01; DEMOS['ai-regression']._draw(s); },
    lr1: function(s) { s.lr = 0.1; DEMOS['ai-regression']._draw(s); },

  }
},

  stage: function() {

      '<button class="demo-btn motion" onclick="demoAction(\'k1\')">K=1</button>' +
      '<button class="demo-btn motion" onclick="demoAction(\'k3\')">K=3</button>' +
      '<button class="demo-btn motion" onclick="demoAction(\'k5\')">K=5</button>' +
      '<button class="demo-btn reset" onclick="demoAction(\'reset\')">🔄 重置</button>';
  },
  init: function(s) {
    s.canvas = document.getElementById('demoCanvas');
    s.ctx = s.canvas.getContext('2d');
    s.k = 3;
    s.points = [];
    for (var i = 0; i < 12; i++) {
      var isBlue = i % 2 === 0;
      var cx = isBlue ? 120 : 300;
      var cy = isBlue ? 80 : 160;
      s.points.push({ x: cx + (Math.random() - 0.5) * 100, y: cy + (Math.random() - 0.5) * 100, cls: isBlue ? 0 : 1 });
    }
    DEMOS['ai-classify']._draw(s);
  },
  _knn: function(s, x, y) {
    var dists = [];
    for (var i = 0; i < s.points.length; i++) {
      var d = Math.sqrt((x - s.points[i].x) * (x - s.points[i].x) + (y - s.points[i].y) * (y - s.points[i].y));
      dists.push({ d: d, cls: s.points[i].cls });
    }
    dists.sort(function(a, b) { return a.d - b.d; });
    var blue = 0, red = 0;
    for (var i = 0; i < Math.min(s.k, dists.length); i++) {
      if (dists[i].cls === 0) blue++; else red++;
    }
    return blue > red ? 0 : 1;
  },
  _draw: function(s) {
    var ctx = s.ctx, W = 440, H = 240;
    ctx.clearRect(0, 0, W, H);
    var step = 15;
    for (var x = 0; x < W; x += step) {
      for (var y = 0; y < H; y += step) {
        var cls = DEMOS['ai-classify']._knn(s, x, y);
        ctx.fillStyle = cls === 0 ? 'rgba(79,107,255,0.12)' : 'rgba(255,107,129,0.12)';
        ctx.fillRect(x, y, step, step);
      }
    }
    for (var i = 0; i < s.points.length; i++) {
      var p = s.points[i];
      ctx.fillStyle = p.cls === 0 ? '#4F6BFF' : '#FF6B81';
      ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.fillStyle = '#5B6B8C'; ctx.font = '12px sans-serif';
    ctx.fillText('KNN 决策边界 (K=' + s.k + ')', 10, 15);
  },
  actions: {
    k1: function(s) { s.k = 1; document.getElementById('kVal').textContent = '1'; DEMOS['ai-classify']._draw(s); },
    k3: function(s) { s.k = 3; document.getElementById('kVal').textContent = '3'; DEMOS['ai-classify']._draw(s); },
    k5: function(s) { s.k = 5; document.getElementById('kVal').textContent = '5'; DEMOS['ai-classify']._draw(s); },
    reset: function(s) { s.k = 3; document.getElementById('kVal').textContent = '3'; DEMOS['ai-classify']._draw(s); }
  }
},

    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1; ctx.strokeRect(190, 10, 240, 220);
    ctx.fillStyle = '#5B6B8C'; ctx.fillText('识别结果', 270, 245);
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#999';
    ctx.fillText('画一个 0-9 的数字', 210, 30);
    ctx.fillText('点「识别」看结果', 210, 50);
  },
  _sampleDigit: function(s) {
    var ctx = s.ctx;
    DEMOS['digit-recog']._drawGrid(s);
    var digit = Math.floor(Math.random() * 10);
    ctx.fillStyle = '#4F6BFF'; ctx.font = 'bold 120px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(digit, 90, 160); ctx.textAlign = 'left';
    s._lastDigit = digit;
  },
  _predict: function(s) {
    var ctx = s.ctx;
    var img = s.ctx.getImageData(10, 10, 160, 220);
    var dark = 0;
    for (var i = 0; i < img.data.length; i += 4) {
      if (img.data[i] < 200) dark++;
    }
    var pred = s._lastDigit !== undefined ? s._lastDigit : Math.floor(Math.random() * 10);
    if (dark < 100) pred = '?';
    ctx.fillStyle = '#fff'; ctx.fillRect(190, 10, 240, 220);
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1; ctx.strokeRect(190, 10, 240, 220);
    ctx.fillStyle = '#51CF66'; ctx.font = 'bold 100px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(pred, 310, 140); ctx.textAlign = 'left';
    ctx.fillStyle = '#5B6B8C'; ctx.font = '14px sans-serif';
    ctx.fillText('像素数: ' + dark, 210, 170);
    ctx.fillText('置信度: ' + (dark > 100 ? '95' : '0') + '%', 210, 190);
  },
  actions: {
    predict: function(s) { DEMOS['digit-recog']._predict(s); },
    sample: function(s) { DEMOS['digit-recog']._sampleDigit(s); },
    clear: function(s) { DEMOS['digit-recog']._drawGrid(s); s._lastDigit = undefined; }
  },
  cleanup: function(s) {
    s.canvas.removeEventListener('mousedown', s._md);
    s.canvas.removeEventListener('mousemove', s._mv);
    s.canvas.removeEventListener('mouseup', s._mu);
    s.canvas.removeEventListener('mouseleave', s._ml);
  }
}
};

/* ================================================================
   渲染函数
   ================================================================ */
function renderTopbar(lesson) {
  var dots = lesson.steps.map(function(s, i) {
    return '<span class="progress-dot' + (i === 0 ? ' active' : '') + '" data-s="' + (i + 1) + '" title="' + s.title + '" onclick="scrollToStep(' + (i + 1) + ')"></span>';
  }).join('');
  var projectTag = lesson.isProject ? ' · 🎬 作品课' : '';
  return '<div class="topbar"><div class="container topbar-inner">' +
    '<div class="course-info">' +
      '<span class="course-badge">Python · P3</span>' +
      '<div><h1>第' + lesson.no + '讲：' + lesson.title + '</h1>' +
      '<div class="meta">汽水老师 · 14-16岁 · ' + lesson.duration + ' · 单元' + lesson.unitNo + ' ' + lesson.unit + projectTag + '</div></div>' +
    '</div>' +
    '<div class="lesson-progress">' + dots +
      '<span class="progress-label" id="progressLabel">' + lesson.steps.length + ' 个环节</span>' +
    '</div>' +
  '</div></div>';
}

function renderGoals(lesson) {
  var goals = lesson.goals.map(function(g) {
    return '<div class="goal-item"><div class="icon">' + g.icon + '</div>' +
      '<h4>' + g.title + '</h4><p>' + g.desc + '</p></div>';
  }).join('');
  return '<section class="section"><div class="container">' +
    '<a class="back-home" href="index.html#courses">← 返回全部课程</a>' +
    '<div class="goals-card"><h2>🎯 这一讲我们要掌握</h2>' +
    '<div class="goal-grid">' + goals + '</div></div></div></section>';
}

function renderInfoGrid(items) {
  var html = items.map(function(item) {
    return '<div class="info-item" style="background:' + item.bg + ';">' +
      '<div class="icon">' + item.icon + '</div>' +
      '<h4>' + item.title + '</h4>' +
      '<p>' + item.desc + '</p></div>';
  }).join('');
  return '<div class="info-grid">' + html + '</div>';
}

function renderCodeBlocks(blocks) {
  if (!blocks) return '';
  return blocks.map(function(b) {
    var title = b.title ? '<span class="code-title">' + b.title + '</span>' : '';
    var lang = b.lang || 'Python';
    return '<div class="code-block">' +
      '<div class="code-header"><span class="code-lang">🐍 ' + lang + '</span>' + title +
      '<button class="code-copy" onclick="copyCode(this)">复制</button></div>' +
      '<pre class="code-content"><code>' + highlightPython(b.code) + '</code></pre></div>';
  }).join('');
}

function renderTips(tips) {
  if (!tips) return '';
  return tips.map(function(t) {
    var cls = t.tip ? 'tip ' + t.tip : 'tip';
    return '<div class="' + cls + '"><span class="tip-icon">' + t.icon + '</span>' +
      '<div><strong>' + t.strong + '</strong>' + t.text + '</div></div>';
  }).join('');
}

function renderTasks(tasks) {
  var html = tasks.map(function(t) {
    return '<div class="task-item" onclick="toggleTask(this)">' +
      '<div class="task-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
      '<div><div class="task-text">' + t.text + '</div>' +
      (t.hint ? '<div class="task-hint">' + t.hint + '</div>' : '') + '</div></div>';
  }).join('');
  return '<div class="task-list">' + html + '</div>';
}

function renderDemoBox(demoType) {
  var demo = DEMOS[demoType];
  if (!demo) return '';
  return '<div class="demo-box">' + demo.stage() +
    '<div class="demo-controls">' + demo.controls() + '</div></div>';
}

function renderSummary(lesson) {
  var chips = lesson.knowledgePoints.map(function(kp) {
    return '<span class="kp-chip">' + kp + '</span>';
  }).join('');
  return '<div class="summary-card"><h3>📝 本讲知识点小结</h3>' +
    '<p>' + lesson.summary + '</p>' +
    '<div class="knowledge-points">' + chips + '</div></div>';
}

function renderHomework(lesson) {
  var items = lesson.homework.map(function(hw) {
    var stars = '';
    for (var i = 0; i < hw.stars; i++) stars += '⭐';
    var tag = hw.tag ? '<span class="hw-tag ' + hw.tag + '">' + ({basic:'基础',adv:'进阶',pro:'拓展'}[hw.tag]) + '</span>' : '';
    return '<div class="hw-item"><span class="hw-star">' + stars + '</span>' +
      '<div><h4>' + hw.title + tag + '</h4><p>' + hw.desc + '</p></div></div>';
  }).join('');
  return '<div style="margin-top:24px;" class="homework">' +
    '<h3 style="margin-bottom:6px;">🏠 课后任务</h3>' +
    '<p style="color:var(--text-sub);font-size:14px;margin-bottom:16px;">课后打开 Python 环境，完成下面的练习。每讲作业要在下次课前提交到班级群，老师会逐份点评。</p>' +
    items + '</div>';
}

function renderStep(step, index, lesson) {
  var html = '<div class="step-block" id="step' + (index + 1) + '">' +
    '<div class="step-num">' + (index + 1) + '</div>' +
    '<div class="step-content">' +
      '<div class="step-head"><h3>' + step.emoji + ' ' + step.title + '</h3>' +
        '<span class="step-time">⏱ ' + step.time + '</span></div>' +
      '<p class="step-desc">' + step.desc + '</p>';
  if (step.infoGrid) html += renderInfoGrid(step.infoGrid);
  if (step.codeBlocks) html += renderCodeBlocks(step.codeBlocks);
  if (step.demoType) html += renderDemoBox(step.demoType);
  if (step.tasks) html += renderTasks(step.tasks);
  if (step.tips) html += renderTips(step.tips);
  if (index === lesson.steps.length - 1) {
    html += renderSummary(lesson);
    html += renderHomework(lesson);
  }
  html += '</div></div>';
  return html;
}

function renderNav(lesson) {
  var no = lesson.no;
  var prevKey = no > 1 ? 'p3-' + String(no - 1).padStart(2, '0') : null;
  var nextKey = no < 40 ? 'p3-' + String(no + 1).padStart(2, '0') : null;
  var prevHTML, nextHTML;
  if (prevKey) {
    prevHTML = '<a href="#' + prevKey + '"><span class="arrow">←</span><div><div class="label">上一讲</div><div class="title">第' + (no - 1) + '讲：' + LESSONS[prevKey].title + '</div></div></a>';
  } else {
    prevHTML = '<a href="index.html#courses"><span class="arrow">←</span><div><div class="label">返回课程体系</div><div class="title">全部课程</div></div></a>';
  }
  if (nextKey) {
    nextHTML = '<a href="#' + nextKey + '" class="next"><div style="text-align:right;"><div class="label">下一讲</div><div class="title">第' + (no + 1) + '讲：' + LESSONS[nextKey].title + '</div></div><span class="arrow">→</span></a>';
  } else {
    nextHTML = '<a href="index.html#courses" class="next"><div style="text-align:right;"><div class="label">返回课程体系</div><div class="title">P3 课程完结 🎉</div></div><span class="arrow">→</span></a>';
  }
  return '<div class="lesson-nav">' + prevHTML + nextHTML + '</div>';
}

/* ================================================================
   主渲染 + 事件处理
   ================================================================ */
var demoState = { type: null };
// Fix: promote helper methods starting with an underscore inside actions to the demo top level, ensuring DEMOS['x']._helper is available
Object.keys(DEMOS).forEach(function(k) {
  var d = DEMOS[k];
  if (d && d.actions) {
    Object.keys(d.actions).forEach(function(a) {
      if (a.charAt(0) === '_' && !d[a]) d[a] = d.actions[a];
    });
  }
});

function getCurrentKey() {
  var hash = location.hash.slice(1);
  if (!LESSONS[hash]) hash = 'p3-01';
  return hash;
}

function render(key) {
  var lesson = LESSONS[key];
  if (!lesson) { key = 'p3-01'; lesson = LESSONS[key]; }

  if (demoState.type && DEMOS[demoState.type] && DEMOS[demoState.type].cleanup) {
    DEMOS[demoState.type].cleanup(demoState);
  }

  var stepsHTML = lesson.steps.map(function(s, i) {
    return renderStep(s, i, lesson);
  }).join('');

  var navHTML = renderNav(lesson);

  var html = renderTopbar(lesson) +
    renderGoals(lesson) +
    '<section class="section" style="padding-top:0;"><div class="container">' +
    stepsHTML + navHTML + '</div></section>';

  document.getElementById('app').innerHTML = html;
  document.title = 'Python P3 第' + lesson.no + '讲 · ' + lesson.title + ' | 汽水老师编程课堂';

  var demoStep = lesson.steps.find(function(s) { return s.demoType; });
  if (demoStep) {
    demoState = { type: demoStep.demoType };
    var demo = DEMOS[demoStep.demoType];
    if (demo) demo.init(demoState);
  } else {
    demoState = { type: null };
  }

  setupScrollObserver();
  window.scrollTo(0, 0);
}

function toggleTask(el) {
  el.classList.toggle('done');
  updateProgress();
}

function updateProgress() {
  var total = document.querySelectorAll('.task-item').length;
  var done = document.querySelectorAll('.task-item.done').length;
  var dots = document.querySelectorAll('.progress-dot');
  if (total === 0 || dots.length === 0) return;
  var ratio = done / total;
  dots.forEach(function(d, i) {
    d.classList.remove('done');
    if (ratio >= (i + 1) / dots.length) d.classList.add('done');
  });
  var label = document.getElementById('progressLabel');
  if (label) label.textContent = '任务完成 ' + done + '/' + total;
}

function scrollToStep(n) {
  var el = document.getElementById('step' + n);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
}

function demoAction(action) {
  var demo = DEMOS[demoState.type];
  if (demo && demo.actions && demo.actions[action]) {
    demo.actions[action](demoState);
  }
}

function copyCode(btn) {
  var codeEl = btn.closest('.code-block').querySelector('.code-content code');
  var text = codeEl.innerText;
  function done() { btn.textContent = '✓ 已复制'; setTimeout(function() { btn.textContent = '复制'; }, 1500); }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function() { _fallbackCopy(text, btn); });
    } else { _fallbackCopy(text, btn); }
  } catch(e) { _fallbackCopy(text, btn); }
}
function _fallbackCopy(text, btn) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); btn.textContent = '✓ 已复制'; setTimeout(function(){ btn.textContent='复制'; }, 1500); } catch(e) {}
  document.body.removeChild(ta);
}

function setupScrollObserver() {
  var stepBlocks = document.querySelectorAll('.step-block');
  var dots = document.querySelectorAll('.progress-dot');
  if (stepBlocks.length === 0 || dots.length === 0) return;
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        var idx = Array.from(stepBlocks).indexOf(e.target);
        dots.forEach(function(d) { d.classList.remove('active'); });
        if (dots[idx] && !dots[idx].classList.contains('done')) {
          dots[idx].classList.add('active');
        }
      }
    });
  }, { threshold: 0.3 });
  stepBlocks.forEach(function(s) { observer.observe(s); });
}

/* ================================================================
   左侧课程目录：列出全部课程，点击跳转；含回到首页
   ================================================================ */
var _rawRender = render;
render = function(key) { _rawRender(key); updateToc(); };

function buildToc() {
  var sidebar = document.getElementById('tocSidebar');
  var groups = {};
  Object.keys(LESSONS).forEach(function(k) {
    var l = LESSONS[k];
    var u = l.unitNo != null ? l.unitNo : 0;
    if (!groups[u]) groups[u] = { name: l.unit || '课程', items: [] };
    groups[u].items.push({ key: k, no: l.no, title: l.title });
  });
  var html = '<button id="tocCollapse" class="toc-collapse" title="收起/展开目录" aria-label="收起或展开目录">◀</button>' +
    '<div class="toc-head"><a class="toc-home" href="index.html">🏠 回到首页</a>' +
    '<div class="toc-title">课程目录</div></div><div class="toc-list">';
  Object.keys(groups).map(Number).sort(function(a, b) { return a - b; }).forEach(function(u) {
    html += '<div class="toc-unit">' + groups[u].name + '</div>';
    groups[u].items.forEach(function(it) {
      html += '<div class="toc-item" data-key="' + it.key + '"><span class="toc-no">第' + it.no + '课</span><span>' + it.title + '</span></div>';
    });
  });
  html += '</div>';
  sidebar.innerHTML = html;
  sidebar.addEventListener('click', function(e) {
    var item = e.target.closest('.toc-item');
    if (item) {
      location.hash = '#' + item.getAttribute('data-key');
      if (window.innerWidth <= 1100) toggleToc(false);
    }
  });
}

function updateToc() {
  var sidebar = document.getElementById('tocSidebar');
  if (!sidebar || !sidebar.querySelector('.toc-item')) return;
  var key = getCurrentKey();
  sidebar.querySelectorAll('.toc-item').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-key') === key);
  });
  var active = sidebar.querySelector('.toc-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function toggleToc(open) {
  document.getElementById('tocSidebar').classList.toggle('open', open);
  document.getElementById('tocMask').classList.toggle('open', open);
}

buildToc();
document.getElementById('tocFab').addEventListener('click', function() {
  toggleToc(!document.getElementById('tocSidebar').classList.contains('open'));
});
document.getElementById('tocMask').addEventListener('click', function() { toggleToc(false); });

/* 目录收起/展开（桌面端），状态记忆 */
try {
  if (localStorage.getItem('tocCollapsed') === '1') document.body.classList.add('toc-collapsed');
} catch (e) {}
document.getElementById('tocCollapse').addEventListener('click', function() {
  var collapsed = document.body.classList.toggle('toc-collapsed');
  try { localStorage.setItem('tocCollapsed', collapsed ? '1' : '0'); } catch (e) {}
});

window.addEventListener('hashchange', function() { render(getCurrentKey()); });

var _initKey = getCurrentKey();
if (location.hash !== '#' + _initKey) {
  location.hash = _initKey;
} else {
  render(_initKey);
}
</script>
