﻿﻿﻿﻿﻿﻿﻿﻿﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scratch L3 创意大师课程 | 汽水老师编程课堂</title>
<style>
:root {
  --primary: #FF6B81;
  --primary-dark: #E85A6F;
  --primary-soft: #FFE4E9;
  --yellow: #FFC93C;
  --orange: #FF7A45;
  --coral: #FF6B81;
  --mint: #2DD4BF;
  --green: #51CF66;
  --lavender: #8B5CF6;
  --bg: #FFF5F7;
  --surface: #FFFFFF;
  --text: #2D1B2E;
  --text-sub: #7A5C66;
  --border: #F4D9DE;
  --radius-sm: 12px;
  --radius-md: 20px;
  --radius-lg: 28px;
  --shadow-sm: 0 4px 12px rgba(255,107,129,.10);
  --shadow-md: 0 12px 30px rgba(45,27,46,.12);
  --shadow-lg: 0 24px 60px rgba(255,107,129,.22);
  --font-display: 'Trebuchet MS', 'PingFang SC', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, sans-serif;
  --font-body: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --font-mono: 'Consolas', 'Courier New', monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); color: var(--text); background: var(--bg); line-height: 1.6; overflow-x: hidden; }
h1,h2,h3,h4 { font-family: var(--font-display); line-height: 1.25; color: var(--text); }
a { color: inherit; text-decoration: none; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
.section { padding: 56px 0; position: relative; }
.section-title { font-size: clamp(24px, 3.5vw, 34px); font-weight: 800; margin-bottom: 10px; }
.section-sub { color: var(--text-sub); font-size: 16px; margin-bottom: 28px; }

/* 顶部固定栏 */
.topbar {
  position: sticky; top: 0; z-index: 100; background: rgba(255,255,255,.92);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
}
.topbar-inner { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; gap: 16px; flex-wrap: wrap; }
.course-info { display: flex; align-items: center; gap: 14px; }
.course-badge {
  background: linear-gradient(135deg, var(--coral), var(--orange)); color: #fff;
  padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
}
.course-info h1 { font-size: 18px; font-weight: 800; }
.course-info .meta { font-size: 13px; color: var(--text-sub); }
.lesson-progress { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; max-width: 340px; }
.progress-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--border); cursor: pointer;
  transition: all .3s;
}
.progress-dot.active { background: var(--primary); transform: scale(1.4); }
.progress-dot.done { background: var(--green); transform: scale(1.3); }
.progress-label { font-size: 13px; color: var(--text-sub); margin-left: 8px; }
@media (max-width: 700px) { .lesson-progress { display: none; } }

/* 学习目标卡 */
.goals-card {
  background: linear-gradient(135deg, var(--coral), #FF9966); color: #fff;
  border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-lg);
}
.goals-card h2 { color: #fff; margin-bottom: 20px; }
.goal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.goal-item {
  background: rgba(255,255,255,.18); border-radius: var(--radius-md); padding: 18px;
  backdrop-filter: blur(8px);
}
.goal-item .icon {
  width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,.28);
  display: grid; place-items: center; margin-bottom: 12px; font-size: 20px;
}
.goal-item h4 { color: #fff; font-size: 16px; margin-bottom: 6px; }
.goal-item p { font-size: 14px; opacity: .95; }
@media (max-width: 700px) { .goal-grid { grid-template-columns: 1fr; } }

/* 教学环节 */
.step-block { display: flex; gap: 24px; margin-bottom: 28px; }
.step-num {
  flex-shrink: 0; width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--coral), #FF9966); color: #fff;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 900; font-size: 22px;
  box-shadow: 0 8px 20px rgba(255,107,129,.35); position: relative;
}
.step-num::after {
  content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: calc(100% + 28px);
  background: linear-gradient(var(--coral), transparent); transform: translateX(-50%);
}
.step-block:last-child .step-num::after { display: none; }
.step-content { flex: 1; background: #fff; border-radius: var(--radius-md); padding: 24px 28px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.step-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
.step-head h3 { font-size: 22px; }
.step-time {
  font-size: 13px; color: var(--coral); background: var(--primary-soft);
  padding: 5px 12px; border-radius: 999px; font-weight: 700;
}
.step-desc { color: var(--text-sub); margin-bottom: 16px; }

/* Scratch 积木块样式 */
.blocks { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.block {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 14px; border-radius: 6px; color: #fff; font-size: 14px; font-weight: 600;
  box-shadow: 0 2px 4px rgba(0,0,0,.12); position: relative;
}
.block.event { background: #FFBF00; color: #4A3B00; }
.block.motion { background: #4C97FF; }
.block.looks { background: #9966FF; }
.block.sound { background: #CF63CF; }
.block.control { background: #FFAB19; color: #4A3B00; }
.block.pen { background: #0FA95F; }
.block.sensing { background: #5CB1D6; }
.block.operators { background: #59C059; color: #1B5E20; }
.block.variables { background: #FF8C1A; }
.block.custom { background: #FF6B81; }
.block .slot {
  background: rgba(255,255,255,.85); color: var(--text); padding: 2px 10px;
  border-radius: 4px; font-family: var(--font-mono); font-size: 13px; min-width: 30px; text-align: center;
}
.block-row { display: flex; align-items: center; gap: 8px; }
.stack-label { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; font-weight: 700; }
.indent { margin-left: 24px; }

/* 互动演示区 */
.demo-box {
  background: var(--bg); border: 2px dashed var(--border); border-radius: var(--radius-md);
  padding: 24px; margin: 16px 0; text-align: center;
}
.demo-stage {
  width: 100%; max-width: 480px; height: 220px; margin: 0 auto; background: linear-gradient(180deg, #FFE4E9 0%, #FFD0D8 100%);
  border-radius: var(--radius-sm); position: relative; overflow: hidden; border: 3px solid #fff; box-shadow: var(--shadow-sm);
}
.demo-actor { position: absolute; }
.demo-actor svg { width: 100%; height: 100%; }
.demo-bubble {
  position: absolute; top: 12px; left: 110px; background: #fff; padding: 8px 14px;
  border-radius: 14px; font-size: 14px; font-weight: 600; opacity: 0; transform: scale(.8);
  transition: all .3s; box-shadow: var(--shadow-sm); z-index: 5;
}
.demo-bubble.show { opacity: 1; transform: scale(1); }
.demo-bubble::before {
  content: ''; position: absolute; left: -8px; bottom: 12px; border: 8px solid transparent; border-right-color: #fff;
}
.demo-controls { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.demo-btn {
  padding: 10px 20px; border: none; border-radius: 999px; font-weight: 700; cursor: pointer;
  font-family: inherit; font-size: 14px; transition: transform .15s, box-shadow .15s; color: #fff;
}
.demo-btn:hover { transform: translateY(-2px); }
.demo-btn:active { transform: translateY(0); }
.demo-btn.motion { background: var(--primary); box-shadow: 0 4px 12px rgba(255,107,129,.3); }
.demo-btn.looks { background: var(--lavender); box-shadow: 0 4px 12px rgba(139,92,246,.3); }
.demo-btn.sound { background: #CF63CF; box-shadow: 0 4px 12px rgba(207,99,207,.3); }
.demo-btn.control { background: var(--orange); box-shadow: 0 4px 12px rgba(255,122,69,.3); }
.demo-btn.sensing { background: #5CB1D6; box-shadow: 0 4px 12px rgba(92,177,214,.3); }
.demo-btn.event { background: var(--yellow); color: #4A3B00; box-shadow: 0 4px 12px rgba(255,201,60,.3); }
.demo-btn.pen { background: var(--green); box-shadow: 0 4px 12px rgba(81,207,102,.3); }
.demo-btn.reset { background: var(--text-sub); }
.demo-note { position: absolute; font-size: 24px; animation: noteFloat 1.5s ease-out forwards; pointer-events: none; z-index: 5; }
@keyframes noteFloat {
  0% { transform: translateY(0) scale(.5); opacity: 0; }
  20% { opacity: 1; transform: translateY(-20px) scale(1); }
  100% { transform: translateY(-130px) scale(.8); opacity: 0; }
}
.demo-stage canvas { border-radius: 8px; display: block; margin: 0 auto; }
.demo-label { position: absolute; top: 8px; left: 12px; font-size: 13px; color: var(--text-sub); font-weight: 600; z-index: 3; }
.demo-list { text-align: left; max-width: 360px; margin: 0 auto; }
.demo-list-item {
  display: flex; align-items: center; justify-content: space-between; padding: 8px 14px;
  background: #fff; border-radius: 8px; margin-bottom: 6px; font-size: 14px; font-weight: 600;
  box-shadow: 0 1px 3px rgba(0,0,0,.06); transition: all .3s;
}
.demo-list-item .idx { color: var(--coral); font-family: var(--font-mono); margin-right: 8px; }
.demo-list-item .del { color: #e74c3c; cursor: pointer; font-size: 16px; }
.demo-input {
  padding: 8px 14px; border: 2px solid var(--border); border-radius: 999px; font-size: 14px;
  font-family: inherit; outline: none; transition: border-color .2s; width: 200px;
}
.demo-input:focus { border-color: var(--coral); }

/* 任务清单 */
.task-list { display: flex; flex-direction: column; gap: 12px; margin: 16px 0; }
.task-item {
  display: flex; align-items: flex-start; gap: 14px; padding: 16px 18px;
  background: var(--bg); border-radius: var(--radius-sm); cursor: pointer; transition: all .25s;
  border: 2px solid transparent; position: relative;
}
.task-item > * { position: relative; z-index: 1; }
.task-item::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(135deg, rgba(254,240,138,.5), rgba(253,224,71,.42));
  opacity: 0; transition: opacity .45s ease;
}
.task-item:hover { border-color: var(--primary-soft); }
.task-item.done { border-color: rgba(234,179,8,.5); box-shadow: 0 4px 14px rgba(234,179,8,.18); }
.task-item.done::before { opacity: 1; }
.task-check {
  width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--border);
  flex-shrink: 0; display: grid; place-items: center; transition: all .25s; margin-top: 1px;
}
.task-item.done .task-check { background: var(--green); border-color: var(--green); }
.task-check svg { opacity: 0; transition: opacity .2s; }
.task-item.done .task-check svg { opacity: 1; color: #fff; }
.task-text { font-size: 15px; }
.task-item.done .task-text { text-decoration: line-through; color: var(--text-sub); }
.task-hint { font-size: 13px; color: var(--text-sub); margin-top: 4px; }

/* 小贴士 */
.tip {
  background: #FFF8E1; border-left: 4px solid var(--yellow); border-radius: var(--radius-sm);
  padding: 14px 18px; margin: 16px 0; display: flex; gap: 12px; align-items: flex-start;
}
.tip .tip-icon { flex-shrink: 0; }
.tip strong { color: var(--orange); }

/* 小结 */
.summary-card {
  background: linear-gradient(135deg, #FFE4E9, #FFD0D8); border-radius: var(--radius-lg);
  padding: 32px; border: 2px solid var(--coral);
}
.summary-card h3 { color: var(--coral); margin-bottom: 16px; }
.knowledge-points { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.kp-chip {
  background: #fff; padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
  color: var(--coral); box-shadow: var(--shadow-sm);
}

/* 课后作业 */
.homework { background: #fff; border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
.hw-item { padding: 18px 0; border-bottom: 1px dashed var(--border); display: flex; gap: 16px; align-items: flex-start; }
.hw-item:last-child { border-bottom: none; }
.hw-star { color: var(--yellow); font-size: 20px; flex-shrink: 0; }
.hw-item h4 { font-size: 17px; margin-bottom: 4px; }
.hw-item p { color: var(--text-sub); font-size: 14px; }

/* 页脚导航 */
.lesson-nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 40px; flex-wrap: wrap; }
.lesson-nav a {
  flex: 1; min-width: 200px; padding: 18px 24px; background: #fff; border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm); border: 1px solid var(--border); transition: all .25s; display: flex;
  align-items: center; gap: 14px;
}
.lesson-nav a:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--coral); }
.lesson-nav .arrow { font-size: 24px; color: var(--coral); }
.lesson-nav .label { font-size: 13px; color: var(--text-sub); }
.lesson-nav .title { font-weight: 700; font-size: 16px; }
.lesson-nav .next { text-align: right; flex-direction: row-reverse; }

/* 响应式 */
@media (max-width: 700px) {
  .section { padding: 40px 0; }
  .topbar-inner { padding: 10px 14px; gap: 10px; }
  .course-info h1 { font-size: 15px; }
  .course-info .meta { display: none; }
  .step-block { flex-direction: column; gap: 14px; }
  .step-num::after { display: none; }
  .step-num { width: 44px; height: 44px; font-size: 16px; }
  .step-content { padding: 18px 14px; }
  .step-head h3 { font-size: 19px; }
  .step-desc { font-size: 14px; }
  .demo-stage { height: 200px; }
  .demo-box { overflow-x: auto; }
  .code-block pre { padding: 14px; font-size: 12.5px; }
  .task-item { padding: 14px; gap: 10px; }
}

/* 左侧课程目录 */
.toc-sidebar {
  position: fixed; left: 0; top: 0; bottom: 0; width: 240px; z-index: 101;
  background: #fff; border-right: 1px solid var(--border);
  display: flex; flex-direction: column; transition: transform .3s ease;
}
.toc-head { padding: 16px 16px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.toc-home {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 12px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px;
  background: var(--primary); color: #fff; transition: transform .2s, box-shadow .2s;
}
.toc-home:hover { transform: translateY(-2px); box-shadow: 0 8px 18px var(--primary-soft); color: #fff; }
.toc-title { font-size: 12px; font-weight: 800; color: var(--text-sub); letter-spacing: 2px; margin-top: 12px; }
.toc-list { flex: 1; overflow-y: auto; padding: 4px 10px 16px; }
.toc-unit { font-size: 12px; font-weight: 700; color: var(--text-sub); padding: 12px 8px 4px; }
.toc-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px;
  font-size: 13.5px; cursor: pointer; transition: background .2s; line-height: 1.45;
}
.toc-item:hover { background: var(--primary-soft); }
.toc-item.active { background: var(--primary-soft); color: var(--primary-dark); font-weight: 700; }
.toc-no { flex-shrink: 0; font-size: 11px; font-weight: 700; color: #fff; background: var(--primary); border-radius: 6px; padding: 2px 6px; }
.toc-item.active .toc-no { background: var(--primary-dark); }
.toc-mask { position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 100; opacity: 0; pointer-events: none; transition: opacity .3s; }
.toc-mask.open { opacity: 1; pointer-events: auto; }
.toc-fab {
  display: none; position: fixed; right: 18px; bottom: 18px; z-index: 94;
  border: none; cursor: pointer; padding: 12px 18px; border-radius: 999px;
  background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; font-family: var(--font-body);
  box-shadow: 0 8px 20px rgba(0,0,0,.18);
}
@media (max-width: 1100px) {
  .toc-sidebar { transform: translateX(-100%); }
  .toc-sidebar.open { transform: translateX(0); box-shadow: 0 0 40px rgba(0,0,0,.2); }
  .toc-fab { display: block; }
}
/* 目录收起/展开按钮 */
.toc-collapse {
  position: absolute; right: -13px; top: 14px; width: 26px; height: 26px;
  border-radius: 50%; border: 1px solid var(--border); background: #fff;
  color: var(--text-sub); cursor: pointer; font-size: 11px; font-family: inherit;
  display: grid; place-items: center; box-shadow: 0 2px 8px rgba(30,42,68,.16);
  transition: transform .3s ease; padding: 0; z-index: 5;
}
.toc-collapse:hover { color: var(--primary); border-color: var(--primary-soft); }
@media (min-width: 1101px) {
  #app { margin-left: 240px; transition: margin-left .3s ease; }
  body.toc-collapsed #app { margin-left: 0; }
  body.toc-collapsed .toc-sidebar { transform: translateX(-100%); }
  body.toc-collapsed .toc-collapse { transform: rotate(180deg); }
}
@media (max-width: 1100px) {
  .toc-collapse { display: none; }
}

<body>
<div id="app"></div>
<aside id="tocSidebar" class="toc-sidebar" aria-label="课程目录"></aside>
<div id="tocMask" class="toc-mask"></div>
<button id="tocFab" class="toc-fab">☰ 课程目录</button>
<script>
/* ================================================================
   小猫 SVG 生成器 (4 种造型)
   ================================================================ */
function catSVG(costume) {
  costume = costume || 1;
  var ears = '<path d="M30 40 L22 18 L42 32 Z" fill="#FF9F43"/><path d="M90 40 L98 18 L78 32 Z" fill="#FF9F43"/>';
  var head = '<circle cx="60" cy="62" r="38" fill="#FFB84D"/>';
  var shadow = '<ellipse cx="60" cy="108" rx="34" ry="6" fill="rgba(0,0,0,.08)"/>';
  var nose = '<ellipse cx="60" cy="70" rx="3" ry="2" fill="#FF6B81"/>';
  var eyes, mouth;
  if (costume === 2) {
    eyes = '<path d="M40 58 Q46 52 52 58" stroke="#2E3A59" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M68 58 Q74 52 80 58" stroke="#2E3A59" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
    mouth = '<path d="M50 68 Q60 82 70 68" stroke="#2E3A59" stroke-width="2.5" fill="#FF6B81" stroke-linecap="round"/>';
  } else if (costume === 3) {
    eyes = '<ellipse cx="50" cy="58" rx="7" ry="9" fill="#fff"/><ellipse cx="78" cy="58" rx="7" ry="9" fill="#fff"/><circle cx="53" cy="60" r="4" fill="#2E3A59"/><circle cx="81" cy="60" r="4" fill="#2E3A59"/><circle cx="54.5" cy="58.5" r="1.5" fill="#fff"/><circle cx="82.5" cy="58.5" r="1.5" fill="#fff"/>';
    mouth = '<path d="M55 72 Q60 78 65 72" stroke="#2E3A59" stroke-width="2.5" fill="none" stroke-linecap="round"/>' + nose;
  } else if (costume === 4) {
    eyes = '<path d="M40 60 Q46 56 52 60" stroke="#2E3A59" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M68 60 Q74 56 80 60" stroke="#2E3A59" stroke-width="2.5" fill="none" stroke-linecap="round"/>';
    mouth = '<ellipse cx="60" cy="73" rx="4" ry="3" fill="#2E3A59"/>';
  } else {
    eyes = '<ellipse cx="46" cy="58" rx="7" ry="9" fill="#fff"/><ellipse cx="74" cy="58" rx="7" ry="9" fill="#fff"/><circle cx="47" cy="60" r="4" fill="#2E3A59"/><circle cx="75" cy="60" r="4" fill="#2E3A59"/><circle cx="48.5" cy="58.5" r="1.5" fill="#fff"/><circle cx="76.5" cy="58.5" r="1.5" fill="#fff"/>';
    mouth = '<path d="M55 72 Q60 78 65 72" stroke="#2E3A59" stroke-width="2.5" fill="none" stroke-linecap="round"/>' + nose;
  }
  return '<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">' + shadow + ears + head + eyes + mouth + '</svg>';
}

/* ================================================================
   演示区 DEMOS 集合
   ================================================================ */
var DEMOS = {};

/* --- 列表操作 --- */
DEMOS['list'] = {
  stage: function() {
    return '<div class="demo-stage" id="demoStage" style="background:linear-gradient(180deg,#FFE4E9,#FFF5F7);">' +
      '<div class="demo-label">📋 列表：我的百宝箱</div>' +
      '<div class="demo-list" id="demoList" style="margin-top:30px;"></div>' +
      '<div style="margin-top:10px;text-align:center;"><input class="demo-input" id="demoInput" placeholder="输入物品名..." onkeydown="if(event.key===\'Enter\')demoAction(\'add\')"/>' +
      '<button class="demo-btn motion" onclick="demoAction(\'add\')">➕ 添加</button></div>' +
      '</div>';
  },
  controls: function() {
    return '<button class="demo-btn sensing" onclick="demoAction(\'search\')">🔍 查找</button>' +
      '<button class="demo-btn control" onclick="demoAction(\'shuffle\')">🔀 打乱</button>' +
      '<button class="demo-btn looks" onclick="demoAction(\'sort\')">🔢 排序</button>' +
      '<button class="demo-btn reset" onclick="demoAction(\'clear\')">🧹 清空</button>';
  },
  init: function(s) {
    s.listEl = document.getElementById('demoList');
    s.input = document.getElementById('demoInput');
    s.items = ['苹果', '香蕉', '汽水'];
    DEMOS.list._render(s);
  },
  actions: {
    add: function(s) {
      var v = s.input.value.trim();
      if (!v) return;
      s.items.push(v);

  init: function(s) {
    s.canvas = document.getElementById('demoCanvas');
    s.ctx = s.canvas.getContext('2d');
    s.ctx.lineWidth = 2; s.ctx.lineCap = 'round'; s.ctx.lineJoin = 'round';
  },
  actions: {
    spiral: function(s) {
      var ctx = s.ctx; ctx.strokeStyle = '#FF6B81'; ctx.beginPath();
      var cx = 220, cy = 100;
      for (var i = 0; i < 200; i++) {
        var a = i * 0.15, r = i * 0.5;
        var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    },
    rose: function(s) {
      var ctx = s.ctx; ctx.strokeStyle = '#FF7A45'; ctx.beginPath();
      var cx = 220, cy = 100;
      for (var i = 0; i < 360; i++) {
        var a = i * Math.PI / 180;
        var r = 60 * Math.sin(4 * a);
        var x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    },
    poly: function(s) {
      var ctx = s.ctx;
      var sides = 6, cx = 220, cy = 100, r = 70;
      var colors = ['#FF6B81','#FF7A45','#FFC93C','#51CF66','#4F6BFF','#8B5CF6'];
      for (var n = 3; n <= sides; n++) {
        ctx.strokeStyle = colors[n - 3]; ctx.beginPath();
        for (var i = 0; i <= n; i++) {
          var a = (i / n) * Math.PI * 2 - Math.PI / 2;
          var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
    },
    star: function(s) {
      var ctx = s.ctx; ctx.strokeStyle = '#8B5CF6'; ctx.beginPath();
      var cx = 220, cy = 100, points = 5, r1 = 70, r2 = 28;
      for (var i = 0; i <= points * 2; i++) {
        var a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2;
        var r = (i % 2 === 0) ? r1 : r2;
        var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath(); ctx.stroke();
    },
    clear: function(s) { s.ctx.clearRect(0, 0, s.canvas.width, s.canvas.height); }
  }
};

      if (x < 0 || y < 0 || x > rect.width || y > rect.height) return;

      var dist = Math.sqrt(dx * dx + dy * dy);

        var dot = document.createElement('div');

        s.dots.appendChild(dot);
        setTimeout(function() { if (dot.parentNode) dot.remove(); }, 1000);
        s.actor.style.transform = 'translateX(-50%) scale(' + (1 + Math.min(dist / 100, 0.5)) + ')';
        s.bubble.textContent = '检测到动作！移动' + Math.round(dist) + 'px';
        s.bubble.classList.add('show');
      }
      s.lastX = x; s.lastY = y;
    };
    s.stage.addEventListener('mousemove', s.mouseHandler);

DEMOS['sort'] = {
  stage: function() {
    return '<div class="demo-stage" id="demoStage" style="background:#fff;">' +
      '<div class="demo-label">🔢 冒泡排序可视化</div>' +
      '<canvas id="demoCanvas" width="440" height="200"></canvas>' +
      '</div>';
  },
  controls: function() {
    return '<button class="demo-btn motion" onclick="demoAction(\'new\')">🎲 新数据</button>' +
      '<button class="demo-btn control" onclick="demoAction(\'step\')">▶ 单步排序</button>' +
      '<button class="demo-btn control" onclick="demoAction(\'auto\')">⚡ 自动排序</button>' +
      '<button class="demo-btn reset" onclick="demoAction(\'stop\')">⏹ 停止</button>';
  },
  init: function(s) {
    s.canvas = document.getElementById('demoCanvas');
    s.ctx = s.canvas.getContext('2d');
    s.data = []; s.i = 0; s.j = 0; s.interval = null; s.sorted = false;
    DEMOS.sort._newData(s);
  },
  cleanup: function(s) { if (s.interval) { clearInterval(s.interval); s.interval = null; } },
  actions: {
    new: function(s) { DEMOS.sort._newData(s); },
    step: function(s) { if (!s.sorted) DEMOS.sort._bubbleStep(s); },
    auto: function(s) {
      if (s.interval) { clearInterval(s.interval); s.interval = null; }
      s.interval = setInterval(function() {
        if (s.sorted) { clearInterval(s.interval); s.interval = null; return; }
        DEMOS.sort._bubbleStep(s);
      }, 300);
    },
    stop: function(s) { if (s.interval) { clearInterval(s.interval); s.interval = null; } },
    _newData: function(s) {
      s.data = []; for (var i = 0; i < 8; i++) s.data.push(Math.floor(Math.random() * 80) + 20);
      s.i = 0; s.j = 0; s.sorted = false;
      if (s.interval) { clearInterval(s.interval); s.interval = null; }
      DEMOS.sort._draw(s);
    },
    _bubbleStep: function(s) {
      if (s.i >= s.data.length - 1) { s.sorted = true; DEMOS.sort._draw(s); return; }
      if (s.j < s.data.length - 1 - s.i) {
        if (s.data[s.j] > s.data[s.j + 1]) {
          var tmp = s.data[s.j]; s.data[s.j] = s.data[s.j + 1]; s.data[s.j + 1] = tmp;
        }
        s.j++;
      } else { s.i++; s.j = 0; }
      DEMOS.sort._draw(s);
    },
    _draw: function(s) {
      var ctx = s.ctx;
      ctx.clearRect(0, 0, s.canvas.width, s.canvas.height);
      var bw = 40, gap = 12, baseY = 190;
      for (var i = 0; i < s.data.length; i++) {
        var x = 30 + i * (bw + gap);
        var h = s.data[i] * 1.8;
        var active = (!s.sorted && (i === s.j || i === s.j + 1));
        ctx.fillStyle = active ? '#FF6B81' : (s.sorted ? '#51CF66' : '#4F6BFF');
        ctx.fillRect(x, baseY - h, bw, h);
        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(s.data[i], x + bw / 2, baseY - h - 5);
      }
      if (s.sorted) { ctx.fillStyle = '#51CF66'; ctx.font = '16px sans-serif'; ctx.fillText('✅ 排序完成！', 220, 20); }
    }
  }
};

  init: function(s) {

  },
  actions: {
    find: function(s) {
      s.target = parseInt(prompt('输入要查找的数字（3-75）:', '33')) || 33;
      s.lo = 0; s.hi = s.data.length - 1; s.found = false; s.done = false;

    step: function(s) { if (!s.done) DEMOS.binarysearch._step(s); },
    reset: function(s) { s.lo = 0; s.hi = s.data.length - 1; s.found = false; s.done = false; s.mid = -1; DEMOS.binarysearch._draw(s); },
    _step: function(s) {

      s.mid = Math.floor((s.lo + s.hi) / 2);
      DEMOS.binarysearch._draw(s);
      setTimeout(function() {
        if (s.data[s.mid] === s.target) { s.found = true; s.done = true; }
        else if (s.data[s.mid] < s.target) s.lo = s.mid + 1;
        else s.hi = s.mid - 1;
        DEMOS.binarysearch._draw(s);
      }, 500);
    },
    _draw: function(s) {
      var ctx = s.ctx; ctx.clearRect(0, 0, s.canvas.width, s.canvas.height);
      var bw = 36, gap = 6, startX = 20, baseY = 130;
      for (var i = 0; i < s.data.length; i++) {
        var x = startX + i * (bw + gap);
        var inRange = (i >= s.lo && i <= s.hi);
        var isMid = (i === s.mid);
        var isFound = (s.found && i === s.mid);
        ctx.fillStyle = isFound ? '#51CF66' : (isMid ? '#FF6B81' : (inRange ? '#FFC93C' : '#E0E0E0'));
        ctx.fillRect(x, baseY - 30, bw, 40);
        ctx.fillStyle = inRange || isMid ? '#2D1B2E' : '#999';
        ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(s.data[i], x + bw / 2, baseY - 5);
        if (isMid) { ctx.fillStyle = '#FF6B81'; ctx.font = '12px sans-serif'; ctx.fillText('↑中间', x + bw / 2, baseY - 40); }
      }
      ctx.fillStyle = '#2D1B2E'; ctx.font = '14px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('目标: ' + s.target, 20, 180);
      if (s.found) { ctx.fillStyle = '#51CF66'; ctx.font = '16px sans-serif'; ctx.fillText('✅ 找到了！在位置 ' + (s.mid + 1), 150, 180); }
      else if (s.done) { ctx.fillStyle = '#e74c3c'; ctx.fillText('❌ 没找到', 150, 180); }
      else { ctx.fillText('范围: [' + (s.lo + 1) + '-' + (s.hi + 1) + ']', 120, 180); }
    }
  }
};

    _tree: function(s, x, y, angle, len, depth) {

      DEMOS.fractal._tree(s, x2, y2, angle - 25, len * 0.7, depth - 1);

DEMOS['maze'] = {
  stage: function() {
    return '<div class="demo-stage" id="demoStage" style="background:#fff;">' +
      '<div class="demo-label">🗺 BFS 最短路径</div>' +
      '<canvas id="demoCanvas" width="440" height="200"></canvas>' +
      '</div>';
  },
  controls: function() {
    return '<button class="demo-btn motion" onclick="demoAction(\'new\')">🎲 新迷宫</button>' +
      '<button class="demo-btn control" onclick="demoAction(\'solve\')">▶ 寻找路径</button>' +
      '<button class="demo-btn reset" onclick="demoAction(\'reset\')">🔄 重置</button>';
  },
  init: function(s) {
    s.canvas = document.getElementById('demoCanvas');
    s.ctx = s.canvas.getContext('2d');
    s.cols = 22; s.rows = 10; s.cellW = 20; s.cellH = 20;
    DEMOS.maze._newMaze(s);
  },
  actions: {
    new: function(s) { DEMOS.maze._newMaze(s); },
    solve: function(s) { DEMOS.maze._bfs(s); },
    reset: function(s) { DEMOS.maze._newMaze(s); },
    _newMaze: function(s) {
      s.grid = [];
      for (var r = 0; r < s.rows; r++) {
        var row = []; for (var c = 0; c < s.cols; c++) {
          row.push(Math.random() < 0.25 ? 1 : 0);
        }
        s.grid.push(row);
      }
      s.grid[0][0] = 0; s.grid[s.rows-1][s.cols-1] = 0;
      s.path = null; DEMOS.maze._draw(s);
    },
    _bfs: function(s) {
      var visited = Array.from({length: s.rows}, function() { return new Array(s.cols).fill(false); });
      var parent = {};
      var queue = [[0, 0]]; visited[0][0] = true;
      var dirs = [[0,1],[1,0],[0,-1],[-1,0]];
      while (queue.length > 0) {
        var cur = queue.shift();
        if (cur[0] === s.rows - 1 && cur[1] === s.cols - 1) {
          s.path = []; var p = cur;
          while (p) { s.path.unshift(p); p = parent[p[0] + ',' + p[1]]; }
          break;
        }
        for (var d = 0; d < 4; d++) {
          var nr = cur[0] + dirs[d][0], nc = cur[1] + dirs[d][1];
          if (nr >= 0 && nr < s.rows && nc >= 0 && nc < s.cols && !visited[nr][nc] && s.grid[nr][nc] === 0) {
            visited[nr][nc] = true; parent[nr + ',' + nc] = cur; queue.push([nr, nc]);
          }
        }
      }
      DEMOS.maze._draw(s);
    },
    _draw: function(s) {
      var ctx = s.ctx; ctx.clearRect(0, 0, s.canvas.width, s.canvas.height);
      for (var r = 0; r < s.rows; r++) {
        for (var c = 0; c < s.cols; c++) {
          var x = c * s.cellW, y = r * s.cellH;
          if (s.grid[r][c] === 1) { ctx.fillStyle = '#5B6B8C'; ctx.fillRect(x, y, s.cellW, s.cellH); }
          else { ctx.fillStyle = '#F8F8F8'; ctx.fillRect(x, y, s.cellW, s.cellH); }
        }
      }
      ctx.strokeStyle = '#E0E0E0'; ctx.lineWidth = 0.5;
      for (var r2 = 0; r2 <= s.rows; r2++) { ctx.beginPath(); ctx.moveTo(0, r2*s.cellH); ctx.lineTo(s.cols*s.cellW, r2*s.cellH); ctx.stroke(); }
      for (var c2 = 0; c2 <= s.cols; c2++) { ctx.beginPath(); ctx.moveTo(c2*s.cellW, 0); ctx.lineTo(c2*s.cellW, s.rows*s.cellH); ctx.stroke(); }
      ctx.fillStyle = '#FF6B81'; ctx.fillRect(2, 2, s.cellW-4, s.cellH-4);
      ctx.fillStyle = '#51CF66'; ctx.fillRect((s.cols-1)*s.cellW+2, (s.rows-1)*s.cellH+2, s.cellW-4, s.cellH-4);
      if (s.path) {
        ctx.fillStyle = 'rgba(255,107,129,.4)';
        for (var i = 0; i < s.path.length; i++) {
          var pr = s.path[i][0], pc = s.path[i][1];
          ctx.fillRect(pc*s.cellW+4, pr*s.cellH+4, s.cellW-8, s.cellH-8);
        }
      }
    }
  }
};

  },
  controls: function() {

      '<button class="demo-btn sound" onclick="demoAction(\'pause\')">⏸ 暂停</button>' +
      '<button class="demo-btn control" onclick="demoAction(\'next\')">⏭ 下一首</button>' +
      '<button class="demo-btn reset" onclick="demoAction(\'stop\')">⏹ 停止</button>';
  },
  init: function(s) {
    s.note = document.getElementById('demoNote');
    s.name = document.getElementById('demoName');
    s.progress = document.getElementById('demoProgress');
    s.songs = [
      { name: '小星星', notes: [262,262,392,392,440,440,392], dur: 0.3 },
      { name: '生日快乐', notes: [262,262,294,262,349,330], dur: 0.4 },
      { name: '欢乐颂', notes: [330,330,349,392,392,349,330,294,262,262], dur: 0.3 }
    ];
    s.cur = 0; s.playing = false; s.noteIdx = 0; s.interval = null; s.audioCtx = null;
  },
  cleanup: function(s) { if (s.interval) { clearInterval(s.interval); s.interval = null; } s.playing = false; },
  actions: {
    play: function(s) {
      if (s.playing) return; s.playing = true;
      var song = s.songs[s.cur];
      s.name.textContent = '🎶 ' + song.name;
      s.noteIdx = 0;
      s.interval = setInterval(function() {
        if (s.noteIdx >= song.notes.length) { clearInterval(s.interval); s.interval = null; s.playing = false; s.progress.textContent = '播放完毕'; return; }
        DEMOS.musicplayer._playNote(s, song.notes[s.noteIdx]);
        var sec = Math.round(s.noteIdx * song.dur);
        var total = Math.round(song.notes.length * song.dur);
        s.progress.textContent = '00:' + String(sec).padStart(2,'0') + ' / 00:' + String(total).padStart(2,'0');
        s.noteIdx++;
      }, song.dur * 1000);
    },
    pause: function(s) { if (s.interval) { clearInterval(s.interval); s.interval = null; } s.playing = false; s.name.textContent = '⏸ 已暂停'; },
    next: function(s) { s.cur = (s.cur + 1) % s.songs.length; if (s.interval) { clearInterval(s.interval); s.interval = null; s.playing = false; } var song = s.songs[s.cur]; s.name.textContent = '🎶 ' + song.name; s.progress.textContent = '00:00 / 00:' + String(Math.round(song.notes.length * song.dur)).padStart(2,'0'); },
    stop: function(s) { if (s.interval) { clearInterval(s.interval); s.interval = null; } s.playing = false; s.noteIdx = 0; s.name.textContent = '点击播放'; s.progress.textContent = '00:00 / 00:00'; },
    _playNote: function(s, freq) {
      try {
        if (!s.audioCtx) s.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = s.audioCtx.createOscillator(); var gain = s.audioCtx.createGain();
        osc.frequency.value = freq; osc.type = 'sine'; osc.connect(gain); gain.connect(s.audioCtx.destination);
        gain.gain.setValueAtTime(0.15, s.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, s.audioCtx.currentTime + 0.4);
        osc.start(); osc.stop(s.audioCtx.currentTime + 0.4);
      } catch(e) {}
      s.note.textContent = ['🎵','🎶','🎼','🎵'][Math.floor(Math.random()*4)];
    }
  }
};

  init: function(s) {
    s.canvas = document.getElementById('demoCanvas');
    s.ctx = s.canvas.getContext('2d');
    s.stage = document.getElementById('demoStage');
    s.active = false; s.mode = 0; s.hue = 0;
    s.mouseHandler = function(e) {
      if (!s.active) return;
      var rect = s.canvas.getBoundingClientRect();
      var x = e.clientX - rect.left, y = e.clientY - rect.top;
      if (x < 0 || y < 0 || x > s.canvas.width || y > s.canvas.height) return;
      s.hue = (s.hue + 3) % 360;
      var ctx = s.ctx;
      if (s.mode === 0) {
        ctx.fillStyle = 'hsl(' + s.hue + ',80%,60%)';
        ctx.beginPath(); ctx.arc(x, y, 5 + Math.random() * 8, 0, Math.PI * 2); ctx.fill();
      } else if (s.mode === 1) {
        ctx.strokeStyle = 'hsl(' + s.hue + ',80%,60%)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + (Math.random()-0.5)*30, y + (Math.random()-0.5)*30); ctx.stroke();
      } else {
        for (var i = 0; i < 5; i++) {
          ctx.fillStyle = 'hsl(' + ((s.hue + i*30) % 360) + ',80%,60%)';
          ctx.beginPath(); ctx.arc(x + (Math.random()-0.5)*20, y + (Math.random()-0.5)*20, 3, 0, Math.PI * 2); ctx.fill();
        }
      }
    };
    s.stage.addEventListener('mousemove', s.mouseHandler);
  },
  cleanup: function(s) { if (s.mouseHandler) s.stage.removeEventListener('mousemove', s.mouseHandler); s.active = false; },
  actions: {
    start: function(s) { s.active = true; },
    mode: function(s) { s.mode = (s.mode + 1) % 3; },
    clear: function(s) { s.ctx.clearRect(0, 0, s.canvas.width, s.canvas.height); }
  }
};

DEMOS['algoanim'] = {
  stage: function() {
    return '<div class="demo-stage" id="demoStage" style="background:#fff;">' +
      '<div class="demo-label">🎬 算法演示动画</div>' +
      '<canvas id="demoCanvas" width="440" height="200"></canvas>' +
      '</div>';
  },
  controls: function() {
    return '<button class="demo-btn motion" onclick="demoAction(\'sort\')">🔢 排序演示</button>' +
      '<button class="demo-btn control" onclick="demoAction(\'search\')">🔍 查找演示</button>' +
      '<button class="demo-btn pen" onclick="demoAction(\'fractal\')">🌳 递归演示</button>' +
      '<button class="demo-btn reset" onclick="demoAction(\'clear\')">🧹 清空</button>';
  },
  init: function(s) {
    s.canvas = document.getElementById('demoCanvas');
    s.ctx = s.canvas.getContext('2d');
    s.data = []; s.i = 0; s.j = 0; s.interval = null; s.mode = '';
    for (var i = 0; i < 10; i++) s.data.push(Math.floor(Math.random() * 80) + 20);
    DEMOS.algoanim._draw(s);
  },
  cleanup: function(s) { if (s.interval) { clearInterval(s.interval); s.interval = null; } },
  actions: {
    sort: function(s) {
      if (s.interval) { clearInterval(s.interval); s.interval = null; }
      for (var i = 0; i < 10; i++) s.data[i] = Math.floor(Math.random() * 80) + 20;
      s.i = 0; s.j = 0; s.mode = 'sort';
      s.interval = setInterval(function() {
        if (s.i >= s.data.length - 1) { clearInterval(s.interval); s.interval = null; s.mode=''; DEMOS.algoanim._draw(s); return; }
        if (s.j < s.data.length - 1 - s.i) {
          if (s.data[s.j] > s.data[s.j+1]) { var t = s.data[s.j]; s.data[s.j] = s.data[s.j+1]; s.data[s.j+1] = t; }
          s.j++;
        } else { s.i++; s.j = 0; }
        DEMOS.algoanim._draw(s);
      }, 200);
    },
    search: function(s) {
      if (s.interval) { clearInterval(s.interval); s.interval = null; }
      s.data.sort(function(a,b){return a-b;});
      s.mode = 'search'; s.target = s.data[Math.floor(Math.random()*s.data.length)];
      s.lo = 0; s.hi = s.data.length - 1; s.mid = -1;
      s.interval = setInterval(function() {
        if (s.lo > s.hi) { clearInterval(s.interval); s.interval = null; return; }
        s.mid = Math.floor((s.lo + s.hi) / 2);
        DEMOS.algoanim._draw(s);
        setTimeout(function() {
          if (s.data[s.mid] === s.target) { clearInterval(s.interval); s.interval = null; }
          else if (s.data[s.mid] < s.target) s.lo = s.mid + 1; else s.hi = s.mid - 1;
        }, 200);
      }, 400);
    },
    fractal: function(s) {
      if (s.interval) { clearInterval(s.interval); s.interval = null; }
      s.mode = 'fractal'; s.depth = 0;
      s.interval = setInterval(function() {
        s.ctx.clearRect(0,0,s.canvas.width,s.canvas.height);
        DEMOS.algoanim._tree(s, 220, 190, -90, 45, s.depth);
        s.depth++;
        if (s.depth > 7) { clearInterval(s.interval); s.interval = null; }
      }, 500);
    },
    clear: function(s) { if (s.interval) { clearInterval(s.interval); s.interval = null; } s.ctx.clearRect(0,0,s.canvas.width,s.canvas.height); s.mode=''; },
    _draw: function(s) {
      var ctx = s.ctx; ctx.clearRect(0,0,s.canvas.width,s.canvas.height);
      var bw = 34, gap = 8, baseY = 180;
      for (var i = 0; i < s.data.length; i++) {
        var x = 20 + i * (bw + gap), h = s.data[i] * 1.6;
        var active = s.mode === 'sort' && (i === s.j || i === s.j + 1);
        var isMid = s.mode === 'search' && i === s.mid;
        ctx.fillStyle = isMid ? '#FF6B81' : (active ? '#FF7A45' : '#4F6BFF');
        ctx.fillRect(x, baseY - h, bw, h);
        ctx.fillStyle = '#fff'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(s.data[i], x + bw / 2, baseY - h - 3);
      }
    },
    _tree: function(s, x, y, angle, len, depth) {
      if (depth === 0 || len < 2) return;
      var ctx = s.ctx;
      var x2 = x + Math.cos(angle * Math.PI / 180) * len;
      var y2 = y + Math.sin(angle * Math.PI / 180) * len;
      ctx.strokeStyle = depth > 3 ? '#8B4513' : '#51CF66';
      ctx.lineWidth = Math.max(1, depth);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x2, y2); ctx.stroke();
      DEMOS.algoanim._tree(s, x2, y2, angle - 25, len * 0.7, depth - 1);
      DEMOS.algoanim._tree(s, x2, y2, angle + 25, len * 0.7, depth - 1);
    }
  }
};

  summary: '🎉 今天我们完成了<strong>Scratch L3 创意大师</strong>的结课路演！回顾 32 课时：从<strong>列表</strong>出发，经过<strong>自制积木、算法（排序/搜索/递归）、画笔高级、体感、云变量、密码、物理模拟</strong>……最终做出自己的结课项目并路演展示！你们已经从「会拼积木」成长为「能做项目、能展示、能表达」的<strong>小小编程师</strong>！下一步：Python 编程，更广阔的世界等着你们！🚀',
  knowledgePoints: ['路演展示', '3分钟讲解', '答辩技巧', '创意评分', '技术评分', '表达评分', 'L3全回顾', 'Python展望'],
  homework: [
    { stars: 1, title: '基础练习：路演复盘', desc: '写下你路演的 3 个亮点和 2 个可以改进的地方。' },
    { stars: 2, title: '进阶挑战：作品发布', desc: '把结课项目发布到 Scratch 官网，写好作品说明和操作指引。' },
    { stars: 3, title: '创意拓展：编程之旅日记', desc: '写一篇「我的 Scratch 编程之旅」日记：从 L1 到 L3 学了什么、做了什么、最喜欢什么、未来想学什么。' }
  ]
}
};

/* ================================================================
   渲染函数
   ================================================================ */
function renderTopbar(lesson) {
  var dots = lesson.steps.map(function(s, i) {
    return '<span class="progress-dot' + (i === 0 ? ' active' : '') + '" data-s="' + (i + 1) + '" title="' + s.title + '" onclick="scrollToStep(' + (i + 1) + ')"></span>';
  }).join('');
  var projectTag = lesson.isProject ? ' · 🎬 作品课' : '';
  return '<div class="topbar"><div class="container topbar-inner">' +
    '<div class="course-info">' +
      '<span class="course-badge">Scratch · L3</span>' +
      '<div><h1>第' + lesson.no + '课：' + lesson.title + '</h1>' +
      '<div class="meta">汽水老师 · 10-12岁 · ' + lesson.duration + ' · ' + lesson.unit + projectTag + '</div></div>' +
    '</div>' +
    '<div class="lesson-progress">' + dots +
      '<span class="progress-label" id="progressLabel">5 个环节</span>' +
    '</div>' +
  '</div></div>';
}

function renderGoals(lesson) {
  var goals = lesson.goals.map(function(g) {
    return '<div class="goal-item"><div class="icon">' + g.icon + '</div>' +
      '<h4>' + g.title + '</h4><p>' + g.desc + '</p></div>';
  }).join('');
  return '<section class="section"><div class="container">' +
    '<div class="goals-card"><h2>🎯 这节课我们要学会</h2>' +
    '<div class="goal-grid">' + goals + '</div></div></div></section>';
}

function renderInfoGrid(items) {
  var html = items.map(function(item) {
    return '<div style="background:' + item.bg + ';border-radius:var(--radius-sm);padding:16px;text-align:center;">' +
      '<div style="font-size:32px;margin-bottom:8px;">' + item.icon + '</div>' +
      '<h4 style="font-size:16px;margin-bottom:4px;">' + item.title + '</h4>' +
      '<p style="font-size:13px;color:var(--text-sub);">' + item.desc + '</p></div>';
  }).join('');
  return '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;margin:16px 0;">' + html + '</div>';
}

function renderBlocks(blocks) {
  var flagIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg>';
  var html = blocks.map(function(b) {
    var icon = b.type === 'event' ? flagIcon : '';
    return '<div class="block ' + b.type + '">' + icon + ' ' + b.text + '</div>';
  }).join('');
  return '<div class="stack-label">📦 积木搭建（按顺序拼好）：</div>' +
    '<div class="blocks">' + html + '</div>';
}

function renderTips(tips) {
  if (!tips) return '';
  return tips.map(function(t) {
    return '<div class="tip"><span class="tip-icon">' + t.icon + '</span>' +
      '<div><strong>' + t.strong + '</strong>' + t.text + '</div></div>';
  }).join('');
}

function renderTasks(tasks) {
  var html = tasks.map(function(t) {
    return '<div class="task-item" onclick="toggleTask(this)">' +
      '<div class="task-check"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
      '<div><div class="task-text">' + t.text + '</div>' +
      (t.hint ? '<div class="task-hint">' + t.hint + '</div>' : '') + '</div></div>';
  }).join('');
  return '<div class="task-list">' + html + '</div>';
}

function renderDemoBox(demoType) {
  var demo = DEMOS[demoType];
  if (!demo) return '';
  return '<div class="demo-box">' + demo.stage() +
    '<div class="demo-controls">' + demo.controls() + '</div></div>';
}

function renderSummary(lesson) {
  var chips = lesson.knowledgePoints.map(function(kp) {
    return '<span class="kp-chip">' + kp + '</span>';
  }).join('');
  return '<div class="summary-card"><h3>📝 今天我们学到了</h3>' +
    '<p>' + lesson.summary + '</p>' +
    '<div class="knowledge-points">' + chips + '</div></div>';
}

function renderHomework(lesson) {
  var items = lesson.homework.map(function(hw) {
    var stars = '';
    for (var i = 0; i < hw.stars; i++) stars += '⭐';
    return '<div class="hw-item"><span class="hw-star">' + stars + '</span>' +
      '<div><h4>' + hw.title + '</h4><p>' + hw.desc + '</p></div></div>';
  }).join('');
  return '<div style="margin-top:24px;" class="homework">' +
    '<h3 style="margin-bottom:6px;">🏠 课后小任务</h3>' +
    '<p style="color:var(--text-sub);font-size:14px;margin-bottom:16px;">回家后打开 Scratch，完成下面的练习，下节课带过来分享哦！</p>' +
    items + '</div>';
}

function renderStep(step, index, lesson) {
  var html = '<div class="step-block" id="step' + (index + 1) + '">' +
    '<div class="step-num">' + (index + 1) + '</div>' +
    '<div class="step-content">' +
      '<div class="step-head"><h3>' + step.emoji + ' ' + step.title + '</h3>' +
        '<span class="step-time">⏱ ' + step.time + '</span></div>' +
      '<p class="step-desc">' + step.desc + '</p>';
  if (step.infoGrid) html += renderInfoGrid(step.infoGrid);
  if (step.blocks) html += renderBlocks(step.blocks);
  if (step.demoType) html += renderDemoBox(step.demoType);
  if (step.tasks) html += renderTasks(step.tasks);
  if (step.tips) html += renderTips(step.tips);
  if (index === 4) {
    html += renderSummary(lesson);
    html += renderHomework(lesson);
  }
  html += '</div></div>';
  return html;
}

function renderNav(lesson, key) {
  var no = lesson.no;
  var prevKey = no > 1 ? 'l3-' + String(no - 1).padStart(2, '0') : null;
  var nextKey = no < 32 ? 'l3-' + String(no + 1).padStart(2, '0') : null;
  var prevHTML, nextHTML;
  if (prevKey) {
    prevHTML = '<a href="#' + prevKey + '"><span class="arrow">←</span><div><div class="label">上一节课</div><div class="title">第' + (no - 1) + '课：' + LESSONS[prevKey].title + '</div></div></a>';
  } else {
    prevHTML = '<a href="index.html#courses"><span class="arrow">←</span><div><div class="label">返回课程体系</div><div class="title">Scratch & Python</div></div></a>';
  }
  if (nextKey) {
    nextHTML = '<a href="#' + nextKey + '" class="next"><div style="text-align:right;"><div class="label">下一节课</div><div class="title">第' + (no + 1) + '课：' + LESSONS[nextKey].title + '</div></div><span class="arrow">→</span></a>';
  } else {
    nextHTML = '<a href="index.html#courses" class="next"><div style="text-align:right;"><div class="label">返回课程体系</div><div class="title">全部课程完成 🎉</div></div><span class="arrow">→</span></a>';
  }
  return '<div class="lesson-nav">' + prevHTML + nextHTML + '</div>';
}

/* ================================================================
   主渲染 + 事件处理
   ================================================================ */
var demoState = { type: null };
// Fix: promote helper methods starting with an underscore inside actions to the demo top level, ensuring DEMOS['x']._helper is available
Object.keys(DEMOS).forEach(function(k) {
  var d = DEMOS[k];
  if (d && d.actions) {
    Object.keys(d.actions).forEach(function(a) {
      if (a.charAt(0) === '_' && !d[a]) d[a] = d.actions[a];
    });
  }
});

function getCurrentKey() {
  var hash = location.hash.slice(1);
  if (!LESSONS[hash]) hash = 'l3-01';
  return hash;
}

function render(key) {
  var lesson = LESSONS[key];
  if (!lesson) { key = 'l3-01'; lesson = LESSONS[key]; }

  // 清理旧 demo
  if (demoState.type && DEMOS[demoState.type] && DEMOS[demoState.type].cleanup) {
    DEMOS[demoState.type].cleanup(demoState);
  }

  // 构建 steps HTML
  var stepsHTML = lesson.steps.map(function(s, i) {
    return renderStep(s, i, lesson);
  }).join('');

  var navHTML = renderNav(lesson, key);

  var html = renderTopbar(lesson) +
    renderGoals(lesson) +
    '<section class="section" style="padding-top:0;"><div class="container">' +
    stepsHTML + navHTML + '</div></section>';

  document.getElementById('app').innerHTML = html;
  document.title = 'Scratch L3 第' + lesson.no + '课 · ' + lesson.title + ' | 汽水老师编程课堂';

  // 初始化 demo
  var demoStep = lesson.steps.find(function(s) { return s.demoType; });
  if (demoStep) {
    demoState = { type: demoStep.demoType };
    var demo = DEMOS[demoStep.demoType];
    if (demo) demo.init(demoState);
  } else {
    demoState = { type: null };
  }

  // 设置滚动观察器
  setupScrollObserver();

  // 滚动到顶部
  window.scrollTo(0, 0);
}

function toggleTask(el) {
  el.classList.toggle('done');
  updateProgress();
}

function updateProgress() {
  var total = document.querySelectorAll('.task-item').length;
  var done = document.querySelectorAll('.task-item.done').length;
  var dots = document.querySelectorAll('.progress-dot');
  if (total === 0 || dots.length === 0) return;
  var ratio = done / total;
  dots.forEach(function(d, i) {
    d.classList.remove('done');
    if (ratio >= (i + 1) / dots.length) d.classList.add('done');
  });
  var label = document.getElementById('progressLabel');
  if (label) label.textContent = '任务完成 ' + done + '/' + total;
}

function scrollToStep(n) {
  var el = document.getElementById('step' + n);
  if (el) el.scrollIntoView({ behavior: 'smooth' });
}

function demoAction(action) {
  var demo = DEMOS[demoState.type];
  if (demo && demo.actions && demo.actions[action]) {
    demo.actions[action](demoState);
  }
}

function setupScrollObserver() {
  var stepBlocks = document.querySelectorAll('.step-block');
  var dots = document.querySelectorAll('.progress-dot');
  if (stepBlocks.length === 0 || dots.length === 0) return;
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        var idx = Array.from(stepBlocks).indexOf(e.target);
        dots.forEach(function(d) { d.classList.remove('active'); });
        if (dots[idx] && !dots[idx].classList.contains('done')) {
          dots[idx].classList.add('active');
        }
      }
    });
  }, { threshold: 0.3 });
  stepBlocks.forEach(function(s) { observer.observe(s); });
}

/* ================================================================
   左侧课程目录：列出全部课程，点击跳转；含回到首页
   ================================================================ */
var _rawRender = render;
render = function(key) { _rawRender(key); updateToc(); };

function buildToc() {
  var sidebar = document.getElementById('tocSidebar');
  var groups = {};
  Object.keys(LESSONS).forEach(function(k) {
    var l = LESSONS[k];
    var u = l.unitNo != null ? l.unitNo : 0;
    if (!groups[u]) groups[u] = { name: l.unit || '课程', items: [] };
    groups[u].items.push({ key: k, no: l.no, title: l.title });
  });
  var html = '<button id="tocCollapse" class="toc-collapse" title="收起/展开目录" aria-label="收起或展开目录">◀</button>' +
    '<div class="toc-head"><a class="toc-home" href="index.html">🏠 回到首页</a>' +
    '<div class="toc-title">课程目录</div></div><div class="toc-list">';
  Object.keys(groups).map(Number).sort(function(a, b) { return a - b; }).forEach(function(u) {
    html += '<div class="toc-unit">' + groups[u].name + '</div>';
    groups[u].items.forEach(function(it) {
      html += '<div class="toc-item" data-key="' + it.key + '"><span class="toc-no">第' + it.no + '课</span><span>' + it.title + '</span></div>';
    });
  });
  html += '</div>';
  sidebar.innerHTML = html;
  sidebar.addEventListener('click', function(e) {
    var item = e.target.closest('.toc-item');
    if (item) {
      location.hash = '#' + item.getAttribute('data-key');
      if (window.innerWidth <= 1100) toggleToc(false);
    }
  });
}

function updateToc() {
  var sidebar = document.getElementById('tocSidebar');
  if (!sidebar || !sidebar.querySelector('.toc-item')) return;
  var key = getCurrentKey();
  sidebar.querySelectorAll('.toc-item').forEach(function(el) {
    el.classList.toggle('active', el.getAttribute('data-key') === key);
  });
  var active = sidebar.querySelector('.toc-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function toggleToc(open) {
  document.getElementById('tocSidebar').classList.toggle('open', open);
  document.getElementById('tocMask').classList.toggle('open', open);
}

buildToc();
document.getElementById('tocFab').addEventListener('click', function() {
  toggleToc(!document.getElementById('tocSidebar').classList.contains('open'));
});
document.getElementById('tocMask').addEventListener('click', function() { toggleToc(false); });

/* 目录收起/展开（桌面端），状态记忆 */
try {
  if (localStorage.getItem('tocCollapsed') === '1') document.body.classList.add('toc-collapsed');
} catch (e) {}
document.getElementById('tocCollapse').addEventListener('click', function() {
  var collapsed = document.body.classList.toggle('toc-collapsed');
  try { localStorage.setItem('tocCollapsed', collapsed ? '1' : '0'); } catch (e) {}
});

// hash 变化时重新渲染
window.addEventListener('hashchange', function() { render(getCurrentKey()); });

// 初始渲染
var _initKey = getCurrentKey();
if (location.hash !== '#' + _initKey) {
  location.hash = _initKey;
} else {
  render(_initKey);
}
</script>
